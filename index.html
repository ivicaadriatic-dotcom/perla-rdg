<script>
/* PWA: manifest i service worker samo kad je objavljeno na webu (http/https),
   da spremljena .html datoteka na računalu ostane samostalna. */
(function(){
  if (!/^https?:$/.test(location.protocol)) return;
  var l=document.createElement('link'); l.rel='manifest'; l.href='manifest.json';
  document.head.appendChild(l);
  var a=document.createElement('link'); a.rel='apple-touch-icon'; a.href='apple-touch-icon.png';
  document.head.appendChild(a);
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function(){
      navigator.serviceWorker.register('sw.js').then(function(reg){
        reg.addEventListener('updatefound', function(){
          var n=reg.installing; if(!n) return;
          n.addEventListener('statechange', function(){
            if (n.state==='installed' && navigator.serviceWorker.controller) window.PN_NOVA_VERZIJA=true;
          });
        });
      }).catch(function(){});
    });
  }
})();
</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

<script>
/* Ako nema interneta pri prvom otvaranju, Chart.js mozda nije ucitan.
   Zamjenska praznina drzi aplikaciju na nogama - brojke i tablice rade, samo grafovi izostanu. */
if (typeof Chart === 'undefined') {
  window.PN_BEZ_GRAFOVA = true;
  window.Chart = function (cv) {
    try {
      var box = cv && cv.parentNode;
      if (box && !box.querySelector('.pn-nochart')) {
        var d = document.createElement('div');
        d.className = 'pn-nochart';
        d.style.cssText = 'display:flex;align-items:center;justify-content:center;height:100%;font-size:12px;color:#8e8e93;text-align:center;padding:12px';
        d.textContent = 'Graf nije dostupan bez internetske veze.';
        box.appendChild(d);
        if (cv.style) cv.style.display = 'none';
      }
    } catch (e) {}
    this.destroy = function () {}; this.update = function () {}; this.resize = function () {};
    this.data = { datasets: [] }; this.options = {};
  };
  Chart.defaults = {
    color: '#6e6e73', borderColor: 'rgba(60,60,67,.1)', font: {},
    animation: false, animations: {}, transitions: {},
    elements: { line: {}, point: {}, bar: {}, arc: {} },
    plugins: { legend: { labels: {} }, tooltip: {}, title: {} },
    scale: { grid: {}, ticks: {} }, scales: {}, datasets: {}, interaction: {}, layout: {}
  };
  Chart.register = function () {};
  Chart.getChart = function () { return null; };
}
</script>
<style>
/* ── Apple Design System ── */
:root{
  --nav-900:#0a1628; --nav-800:#0f1e35; --nav-700:#16294a; --nav-600:#1f3a63;
  --nav-500:#2b5088; --nav-400:#4a72ab; --gold:#c8a951; --gold-d:#a88a35;
  --bg:#f6f7fa; --surface:#ffffff; --surface2:#fafbfd; --surface3:#f1f3f8;
  --sep:#e8ebf1; --sep2:#f0f2f6;
  --label:#121826; --label2:#5a6478; --label3:#98a1b3; --label4:#b7bfcc;
  --blue:#2b5088; --blue-bg:#eaf2fe;
  --green:#22c55e; --green-bg:#e8faef;
  --red:#ef4444; --red-bg:#fdecec;
  --orange:#f59e0b; --orange-bg:#fef6e7;
  --r4:6px;--r8:9px;--r12:12px;--r16:15px;
  --shadow:0 2px 8px rgba(18,24,38,.05),0 10px 30px rgba(18,24,38,.05);
  --shadow-sm:0 1px 2px rgba(18,24,38,.04);
}
html[data-theme="dark"]{
  --bg:#080f1c; --surface:#101c30; --surface2:#16243c; --surface3:#1d2e49;
  --sep:#24354f; --sep2:#1b2a42;
  --label:#e8eef6; --label2:#9db0c8; --label3:#6b7f99; --label4:#4d5c70;
  --blue-bg:#132239;
  --green-bg:#0e2f1d;
  --red-bg:#331717;
  --orange-bg:#302614;
  --shadow:0 4px 16px rgba(0,0,0,.4);
  --shadow-sm:0 1px 3px rgba(0,0,0,.4);
}
html[data-theme="dark"] body{background:var(--bg);color:var(--label)}
html[data-theme="dark"] .header{background:var(--surface)}
html[data-theme="dark"] .hbtn{background:var(--surface2);color:var(--label);border-color:var(--sep)}
html[data-theme="dark"] .hbtn:hover{background:var(--surface3)}
html[data-theme="dark"] #periodSelect,html[data-theme="dark"] input,html[data-theme="dark"] select,html[data-theme="dark"] textarea{background:var(--surface2);color:var(--label);border-color:var(--sep)}
html[data-theme="dark"] .num-input,html[data-theme="dark"] .txt-input{background:var(--surface3);color:var(--label)}
html[data-theme="dark"] th{background:var(--surface2);color:var(--label3)}
html[data-theme="dark"] td{border-color:var(--sep2)}
html[data-theme="dark"] .card,html[data-theme="dark"] .chart-card,html[data-theme="dark"] .chart-card-wide,html[data-theme="dark"] .tbl-wrap,html[data-theme="dark"] .modal,html[data-theme="dark"] .pnModal{background:var(--surface);border-color:var(--sep)}
html[data-theme="dark"] .surface2,html[data-theme="dark"] .chip{background:var(--surface2)}
html[data-theme="dark"] .kpi-card,html[data-theme="dark"] .ceo-card{background:var(--surface)}
html[data-theme="dark"] .theme-toggle{background:rgba(255,255,255,.08)}
html[data-theme="dark"] .theme-toggle svg{color:#ffd166}
*{box-sizing:border-box;margin:0;padding:0;-webkit-font-smoothing:antialiased}
body{font-family:'Inter','SF Pro Display',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--label);font-size:13px;font-weight:400;line-height:1.5;overflow-anchor:none}
#view{flex:1;overflow-y:auto;padding:22px 24px 60px}
.main-wrap{margin-top:0}

/* ── SIDEBAR (DYS stil) ── */
body{display:flex;overflow:hidden;height:100vh}
#side{width:246px;flex:0 0 246px;background:var(--nav-800);color:#c4d3e6;display:flex;flex-direction:column;height:100vh;position:relative;z-index:20}
#side::after{content:'';position:absolute;inset:0 0 0 auto;width:1px;background:rgba(255,255,255,.07)}
.brand{padding:20px 18px 16px;border-bottom:1px solid rgba(255,255,255,.08);display:flex;gap:11px;align-items:center}
.brand-logo{width:auto;height:34px;border-radius:0;background:none;display:flex;align-items:center;justify-content:flex-start;flex:0 0 auto;overflow:hidden;font-weight:800;font-size:16px;color:var(--nav-900)}
.brand-logo img{width:auto;height:34px;max-width:190px;object-fit:contain;background:none}
.brand-t{font-size:13px;font-weight:700;color:#fff;letter-spacing:.2px;line-height:1.25}
.brand-s{font-size:10px;color:#7e93ad;letter-spacing:.3px;margin-top:2px}
#nav{flex:1;overflow-y:auto;padding:10px 10px 14px}
#nav::-webkit-scrollbar{width:5px}
#nav::-webkit-scrollbar-thumb{background:rgba(255,255,255,.14);border-radius:3px}
.nav-h{font-size:9.5px;font-weight:700;letter-spacing:1.3px;color:#607890;text-transform:uppercase;padding:14px 10px 6px}
.nav-i{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;cursor:pointer;color:#b3c5db;font-size:12.5px;font-weight:500;transition:background .13s,color .13s;user-select:none;position:relative}
.nav-i:hover{background:rgba(255,255,255,.06);color:#fff}
.nav-i.on{background:var(--nav-600);color:#fff;font-weight:600}
.nav-i.on::before{content:'';position:absolute;left:-10px;top:7px;bottom:7px;width:3px;background:var(--gold);border-radius:0 3px 3px 0}
.side-f{padding:11px 14px;border-top:1px solid rgba(255,255,255,.08);font-size:10px;color:#7e93ad}
#main{flex:1;display:flex;flex-direction:column;height:100vh;overflow:hidden;min-width:0}

/* ── HEADER (topbar unutar main) ── */
.header{
  height:56px;flex:0 0 56px;
  background:var(--surface);
  border-bottom:1px solid var(--sep);
  padding:0 22px;
  display:flex;align-items:center;justify-content:space-between;
  box-shadow:var(--shadow-sm);z-index:10;
  flex-wrap:wrap;gap:8px;
}
.header-left{display:flex;align-items:center;gap:11px}
.header-logo{
  width:32px;height:32px;
  background:linear-gradient(145deg,#1c1c1e,#2c2c2e);
  border-radius:8px;
  display:flex;align-items:center;justify-content:center;
  color:#fff;font-size:14px;flex-shrink:0;
  box-shadow:0 2px 8px rgba(0,0,0,.25);
}
.header-title{font-size:15px;font-weight:600;letter-spacing:.3px;color:var(--label)}
.header-sub{font-size:10px;color:var(--label3);letter-spacing:.2px;margin-top:1px}
.live-badge{
  padding:3px 10px;border-radius:20px;font-size:10px;font-weight:500;
  background:var(--green-bg);color:var(--green);letter-spacing:.2px;
}
.hbtns{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.hbtn{
  padding:6px 14px;border-radius:8px;border:none;
  font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text','Helvetica Neue',sans-serif;
  font-size:12px;font-weight:400;cursor:pointer;white-space:nowrap;
  transition:opacity .15s,transform .1s;
  background:var(--surface2);color:var(--label);
}
.hbtn:hover{opacity:.82}.hbtn:active{transform:scale(.97)}
.hbtn.grn{background:var(--green);color:#fff;font-weight:500}
.hbtn.blu{background:var(--blue);color:#fff;font-weight:500}
.hbtn.teal{background:#32ade6;color:#fff;font-weight:500}
#saveStatus{font-size:11px;color:var(--label4);white-space:nowrap}

/* ── TAB BAR ── */
.tabs{display:none}
.tabs::-webkit-scrollbar{display:none}
.tab-btn{
  padding:10px 14px;background:none;border:none;
  border-bottom:2px solid transparent;cursor:pointer;
  font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text',sans-serif;
  font-size:12px;color:var(--label3);white-space:nowrap;
  transition:color .2s;margin-bottom:-1px;font-weight:400;letter-spacing:.1px;
}
.tab-btn.active{color:var(--blue);border-bottom-color:var(--blue);font-weight:500}
.tab-btn.grp{background:rgba(0,0,0,.025);border-radius:6px 6px 0 0}
.tab-btn:hover:not(.active){color:var(--label)}

/* ── LAYOUT ── */
.content{padding:20px 24px;min-height:600px;position:relative;padding-top:24px}
.tab-pane{display:none}
.tab-pane.active{display:block}

/* ── SUMMARY CARDS ── */
.summary-row{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px}
.card{
  background:var(--surface);border-radius:var(--r12);
  padding:14px 18px;min-width:160px;
  box-shadow:var(--shadow);border:none;
}
.card-label{font-size:11px;color:var(--label3);margin-bottom:4px;font-weight:400;letter-spacing:.1px}
.card-value{font-size:18px;font-weight:600;color:var(--label);letter-spacing:-.3px}

/* ── TABLE ── */
.tbl-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;border-radius:var(--r12);background:var(--surface);margin-bottom:16px;box-shadow:var(--shadow)}
.tbl-wrap table{min-width:600px}
.tbl-wrap td:first-child,.tbl-wrap th:first-child{position:sticky;left:0;z-index:2;background:var(--surface);box-shadow:1px 0 0 var(--sep2)}
.tbl-wrap th:first-child{z-index:3;background:var(--surface2)}
.tbl-wrap .sec-row td:first-child{background:var(--surface3)}
.tbl-wrap .total-row td:first-child{background:var(--surface2)}
.tbl-wrap .dobit-row td:first-child{background:var(--nav-800)}
.tbl-wrap tr:hover td:first-child{background:var(--surface2)}
.tbl-wrap table td,.tbl-wrap table th{font-size:9.5px;font-weight:700;letter-spacing:.7px;text-transform:uppercase;color:var(--label3);background:var(--surface2);position:sticky;top:0;z-index:3;transition:none!important}
table{width:100%;border-collapse:collapse;font-size:12px}
thead tr{background:var(--surface2)}
th{
  padding:8px 6px;font-size:10px;color:var(--label3);text-transform:uppercase;
  text-align:center;border-bottom:1px solid var(--sep);white-space:nowrap;
  font-weight:500;letter-spacing:.4px;
}
th.left{text-align:left;padding-left:14px}
th.right{text-align:right;padding-right:8px}
td{padding:4px 5px;border-bottom:1px solid var(--sep2);vertical-align:middle}
tr:last-child td{border-bottom:none}

.sec-row td{
  background:linear-gradient(90deg,rgba(43,80,136,.04),transparent);
  padding:7px 14px;font-size:10px;letter-spacing:1.5px;
  text-transform:uppercase;font-weight:600;color:var(--blue);
  border-top:1px solid var(--sep);
}
.total-row td{
  background:var(--surface2)!important;
  font-weight:700;font-size:11px;border-top:1.5px solid var(--sep);border-bottom:1.5px solid var(--sep);
}
.dobit-row td{
  background:var(--nav-800)!important;color:#fff!important;
  font-weight:700;font-size:11px;
}
.num{text-align:right;font-size:11px;white-space:nowrap;padding-right:8px!important;font-weight:500;font-variant-numeric:tabular-nums}
.lbl{color:var(--label2);padding-left:14px!important;font-weight:400}
.lbl-bold{color:var(--label);padding-left:14px!important;font-weight:600;letter-spacing:.1px}

/* ── INPUTS ── */
.num-input{
  background:var(--surface2);border:1.5px solid transparent;
  border-radius:var(--r8);padding:4px 6px;
  font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text',sans-serif;
  font-size:12px;width:105px;text-align:right;color:var(--label);
  outline:none;transition:border-color .15s,background .15s;
}
.num-input:hover{background:#ebebf0;border-color:rgba(0,0,0,.07)}
.num-input:focus{border-color:var(--blue);background:var(--surface);box-shadow:0 0 0 3px rgba(43,80,136,.12)}
.txt-input{
  background:var(--surface2);border:1.5px solid transparent;
  border-radius:var(--r8);padding:4px 7px;
  font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text',sans-serif;
  font-size:12px;width:100%;color:var(--label);outline:none;
  transition:border-color .15s,background .15s;
}
.txt-input:hover{background:#ebebf0}
.txt-input:focus{border-color:var(--blue);background:var(--surface);box-shadow:0 0 0 3px rgba(43,80,136,.12)}
.txt-input[data-f="placeno"]{color:var(--red)!important}
.ieur{display:flex;align-items:center;gap:3px;justify-content:flex-end}
.eu{font-size:10px;color:var(--label4)}

/* ── MONTH PICKER (transaction tabs) ── */
.month-picker{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:14px}
.mbtn{
  padding:5px 12px;border-radius:20px;border:none;
  background:var(--surface2);cursor:pointer;
  font-family:-apple-system,BlinkMacSystemFont,sans-serif;
  font-size:11px;font-weight:500;color:var(--label3);
  transition:all .15s;
}
.mbtn.has{color:var(--label);background:var(--surface);box-shadow:var(--shadow-sm)}
.mbtn.act{background:var(--blue);color:#fff;box-shadow:0 2px 8px rgba(43,80,136,.3)}

/* ── TRANSACTION BUTTONS ── */
.trans-hdr{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.add-btn{
  padding:5px 12px;border-radius:8px;background:var(--blue-bg);
  border:none;cursor:pointer;
  font-family:-apple-system,BlinkMacSystemFont,sans-serif;
  font-size:11px;color:var(--blue);font-weight:500;transition:opacity .15s;
}
.add-btn:hover{opacity:.8}
.del-btn{
  background:none;border:none;cursor:pointer;
  color:var(--label4);font-size:14px;line-height:1;padding:3px 5px;
  border-radius:6px;transition:all .15s;
}
.del-btn:hover{color:var(--red);background:var(--red-bg)}

/* ── SEARCH ── */
.search-bar{display:flex;align-items:center;gap:7px;margin-bottom:12px}
.search-inp{
  flex:1;max-width:300px;background:var(--surface2);
  border:1.5px solid transparent;border-radius:10px;
  padding:7px 12px;
  font-family:-apple-system,BlinkMacSystemFont,sans-serif;
  font-size:12px;color:var(--label);outline:none;transition:all .15s;
}
.search-inp:focus{border-color:var(--blue);background:var(--surface);box-shadow:0 0 0 3px rgba(43,80,136,.12)}

/* ── DASHBOARD CHARTS ── */
.charts-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
.chart-card{background:var(--surface);border-radius:var(--r16);padding:16px 18px;box-shadow:var(--shadow)}
.chart-card-wide{background:var(--surface);border-radius:var(--r16);padding:16px 18px;box-shadow:var(--shadow);margin-bottom:12px}
.chart-title{font-size:12px;font-weight:600;color:var(--label);letter-spacing:.1px;margin-bottom:8px}

/* ── KPI CARDS ── */
.kpi-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:16px}
.kpi-card{background:var(--surface);border-radius:var(--r16);padding:16px 18px;box-shadow:var(--shadow)}
.kpi-label{font-size:11px;color:var(--label3);margin-bottom:6px;font-weight:400;letter-spacing:.2px}
.kpi-val{font-size:22px;font-weight:700;letter-spacing:-.5px}
.green{color:var(--green)!important}.red{color:var(--red)!important}

/* ── CEO PANEL ── */
.ceo-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:18px}
.ceo-card{
  background:var(--surface);border-radius:var(--r16);
  padding:16px 18px;position:relative;overflow:hidden;
  box-shadow:var(--shadow);
}
.ceo-card::before{
  content:'';position:absolute;top:0;left:0;right:0;height:3px;
}
.ceo-card.green::before{background:linear-gradient(90deg,var(--green),#30d158)}
.ceo-card.red::before{background:linear-gradient(90deg,var(--red),#ff6961)}
.ceo-card.blue::before{background:linear-gradient(90deg,var(--blue),#0a84ff)}
.ceo-card.amber::before{background:linear-gradient(90deg,var(--orange),#ffd60a)}
.ceo-label{font-size:11px;color:var(--label3);margin-bottom:5px;font-weight:400;letter-spacing:.2px}
.ceo-val{font-size:24px;font-weight:700;line-height:1.1;margin-bottom:3px;letter-spacing:-.5px}
.ceo-sub{font-size:11px;color:var(--label4)}

/* ── FORECAST ── */
.fc-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:18px}
.fc-card{background:var(--surface);border-radius:var(--r16);padding:16px 18px;box-shadow:var(--shadow)}
.fc-month{font-size:10px;letter-spacing:1px;color:var(--blue);text-transform:uppercase;margin-bottom:8px;font-weight:600}
.fc-row{display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px solid var(--sep2);font-size:12px}
.fc-row:last-child{border-bottom:none;padding-top:7px;font-weight:600}

/* ── ALERTS ── */
.sec-title{font-size:11px;font-weight:600;letter-spacing:1px;text-transform:uppercase;color:var(--label3);margin:0 0 12px;padding-bottom:7px;border-bottom:1px solid var(--sep)}
.al-card{display:flex;gap:12px;padding:13px 16px;border-radius:var(--r12);border:none;margin-bottom:8px;align-items:flex-start;box-shadow:var(--shadow-sm)}
.al-icon{font-size:20px;flex-shrink:0;margin-top:1px}
.al-title{font-size:13px;font-weight:600;color:var(--label);margin-bottom:3px;letter-spacing:.1px}
.al-body{font-size:12px;color:var(--label2);line-height:1.5;font-weight:400}
.al-month{font-size:11px;color:var(--label4);margin-top:3px}
.al-empty{text-align:center;padding:40px 0;color:var(--label4);font-size:14px}

@media(max-width:900px){
  .charts-grid{grid-template-columns:1fr}
  .kpi-grid{grid-template-columns:1fr 1fr}
  .ceo-grid{grid-template-columns:1fr 1fr}
  .fc-grid{grid-template-columns:1fr}
  .content{padding:14px 16px}
}
/* ── MOBILNA VERZIJA ── */
.card-h{padding:12px 16px 10px;border-bottom:1px solid var(--sep2)}
.card-t{font-size:12px;font-weight:650}
.card-b{padding:14px 16px}
.theme-toggle{display:flex;align-items:center;gap:6px;padding:6px 12px;border-radius:20px;border:1px solid var(--sep);background:var(--surface2);cursor:pointer;font-size:12px;font-weight:500;color:var(--label2);transition:all .15s}
.theme-toggle:hover{opacity:.8}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{padding:7px 14px;border-radius:20px;border:1px solid var(--sep);background:var(--surface);font-size:12px;font-weight:500;color:var(--label2);cursor:pointer;transition:all .13s;display:inline-flex;align-items:center;gap:6px}
.chip:hover{border-color:var(--nav-400);color:var(--label);box-shadow:var(--shadow-sm)}
.chip .c{font-size:9px}
.nav-badge{margin-left:auto;background:var(--red);color:#fff;font-size:9.5px;font-weight:700;border-radius:9px;padding:1px 6px;min-width:18px;text-align:center}
.nav-i{position:relative}
.nav-i svg{width:16px;height:16px;flex:0 0 16px;stroke-width:1.7}
.nav-i span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.menu-btn{display:none}
@media(max-width:820px){

  .kpi-grid{grid-template-columns:1fr}

  #sideOverlay{

@media(max-width:820px){

@media(max-width:820px){
  .header{flex-wrap:nowrap;overflow:hidden}

  .hbtns::-webkit-scrollbar{display:none}
  .hbtns > *{flex-shrink:0}
  html,body{max-width:100vw;overflow-x:hidden}
  .uvozGrid{grid-template-columns:1fr!important}
  #view{overflow-x:hidden}
  .content{max-width:100vw;overflow-x:hidden}
  .chart-card,.chart-card-wide,.card,.kpi-card,.ceo-card{min-width:0;max-width:100%}

  #artikliCard .artikliGrid{grid-template-columns:1fr!important}
  #artikliCard .artikliGrid > div:first-child{width:170px!important;height:170px!important;margin:0 auto}

body[data-ro] .num-input,body[data-ro] .txt-input{pointer-events:none;background:var(--surface2);border-color:transparent;color:var(--label2)}

}


/* ════════════════════════════════════════════
   APPLE THEME LAYER (v110) – svijetla i tamna
   ════════════════════════════════════════════ */
:root{
  --bg:#f2f2f7; --surface:#ffffff; --surface2:#f5f5f8; --surface3:#ececf1;
  --sep:#e3e3e8; --sep2:#efeff3;
  --label:#1d1d1f; --label2:#515156; --label3:#8a8a8f; --label4:#b0b0b5;
  --blue:#007aff; --blue-bg:#e6f1ff;
  --green:#34c759; --green-bg:#e7f8ec;
  --red:#ff3b30; --red-bg:#ffecea;
  --orange:#ff9500; --orange-bg:#fff3e2;
  --r4:8px;--r8:10px;--r12:14px;--r16:20px;
  --fill:rgba(118,118,128,.12);
  --glass:rgba(255,255,255,.76); --glass-brd:rgba(255,255,255,.75);
  --shadow:0 1px 2px rgba(0,0,0,.04),0 8px 28px rgba(15,23,42,.06);
  --shadow-sm:0 1px 2px rgba(0,0,0,.05);
  --font:-apple-system,BlinkMacSystemFont,'SF Pro Text','SF Pro Display','Inter','Helvetica Neue','Segoe UI',sans-serif;
}
html[data-theme="dark"]{
  --bg:#0c1728; --surface:#132239; --surface2:#1b2e49; --surface3:#24395a;
  --sep:#263a59; --sep2:#1a2b45;
  --label:#f5f5f7; --label2:#c7c7cc; --label3:#8e8e93; --label4:#636366;
  --blue:#0a84ff; --blue-bg:rgba(10,132,255,.16);
  --green:#30d158; --green-bg:rgba(48,209,88,.14);
  --red:#ff453a; --red-bg:rgba(255,69,58,.15);
  --orange:#ff9f0a; --orange-bg:rgba(255,159,10,.15);
  --fill:rgba(118,118,128,.24);
  --glass:rgba(19,34,57,.72); --glass-brd:rgba(255,255,255,.07);
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.35);
  --shadow-sm:0 1px 3px rgba(0,0,0,.4);
}
body{font-family:var(--font);font-size:13.5px;letter-spacing:-.003em}
button,input,select,textarea{font-family:var(--font)}
#view{background:
  radial-gradient(900px 500px at 12% -10%,rgba(0,122,255,.07),transparent 60%),
  radial-gradient(800px 500px at 100% 0%,rgba(175,82,222,.06),transparent 60%),var(--bg)}
html[data-theme="dark"] #view{background:
  radial-gradient(900px 500px at 12% -10%,rgba(10,132,255,.12),transparent 60%),
  radial-gradient(800px 500px at 100% 0%,rgba(191,90,242,.08),transparent 60%),var(--bg)}
.content{max-width:1400px;margin:0 auto}

/* Bocna traka */
#side{font-family:var(--font)}
.nav-i{border-radius:10px;font-size:13px;padding:8px 11px}
.nav-i.on{background:rgba(255,255,255,.13);box-shadow:inset 0 0 0 .5px rgba(255,255,255,.12)}
.nav-h{letter-spacing:.9px;font-size:10px}
.nav-badge{background:#ff3b30;border-radius:10px}

/* Zaglavlje – staklo */
.header{background:var(--glass)!important;-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);
  border-bottom:.5px solid var(--sep);box-shadow:none}
.header-title{font-size:17px;font-weight:600;letter-spacing:-.02em}
.hbtn{height:32px;padding:0 13px;border-radius:10px;font-size:13px;font-weight:500;display:inline-flex;align-items:center;justify-content:center;gap:6px;
  background:var(--fill);color:var(--label);border:none!important}
.header .hbtn{background:var(--fill)!important;color:var(--label)!important}
.hbtn svg{flex-shrink:0}
.hbtn.blu,.hbtn[style*="background:var(--nav-600)"],.hbtn[style*="background:var(--nav-800)"],.hbtn[style*="background:var(--blue)"]{background:#007aff!important;color:#fff!important;box-shadow:0 4px 12px rgba(0,122,255,.25)}
.hbtn.grn{background:#34c759!important;color:#fff!important}
.theme-toggle{height:32px;border:none;background:var(--fill);border-radius:999px;font-size:13px;color:var(--label)}
.theme-toggle svg{display:block}
#periodSelect{height:32px;border-radius:10px;border:none!important;background:var(--fill)!important;padding:0 10px;font-size:13px;color:var(--label)}

/* Naslovi rubrika */
.sec-title{font-size:20px!important;font-weight:700;letter-spacing:-.02em;text-transform:none!important;color:var(--label)!important;
  border:none!important;padding:0!important;margin:26px 2px 14px!important}
.tab-pane .sec-title:first-child,.tab-pane > div:first-child .sec-title:first-child{font-size:28px!important;margin-top:4px!important;letter-spacing:-.025em}

/* Kartice – staklo */
.card,.kpi-card,.ceo-card,.chart-card,.chart-card-wide,.fc-card,.tbl-wrap{
  background:var(--glass)!important;-webkit-backdrop-filter:saturate(180%) blur(22px);backdrop-filter:saturate(180%) blur(22px);
  border:1px solid var(--glass-brd)!important;border-radius:20px;box-shadow:var(--shadow)}
.card{padding:16px 20px}
.kpi-card,.ceo-card,.fc-card,.chart-card,.chart-card-wide{padding:18px 20px}
.card-label,.kpi-label,.ceo-label{font-size:12.5px;font-weight:500;color:var(--label3);letter-spacing:0}
.card-value{font-size:22px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.kpi-val{font-size:28px;font-weight:700;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.ceo-val{font-size:28px;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.ceo-card::before{display:none}
.ceo-card.green .ceo-label:before,.ceo-card.red .ceo-label:before,.ceo-card.blue .ceo-label:before,.ceo-card.amber .ceo-label:before{
  content:'';display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:7px;vertical-align:1px}
.ceo-card.green .ceo-label:before{background:#34c759}.ceo-card.red .ceo-label:before{background:#ff3b30}
.ceo-card.blue .ceo-label:before{background:#007aff}.ceo-card.amber .ceo-label:before{background:#ff9500}
.chart-title{font-size:15px;font-weight:600;letter-spacing:-.01em;margin-bottom:12px}
.fc-month{font-size:12px;letter-spacing:.02em;color:#007aff}
.green{color:#248a3d!important}.red{color:#ff3b30!important}
html[data-theme="dark"] .green{color:#30d158!important}html[data-theme="dark"] .red{color:#ff453a!important}
.kpi-val.green,.ceo-val.green,.card-value.green{color:#28a745!important}

/* Tablice */
table{font-size:12.5px}
th{font-size:10.5px;font-weight:600;letter-spacing:.03em;color:var(--label3);border-bottom:.5px solid var(--sep);padding:10px 6px}
thead tr,.tbl-wrap table th,.tbl-wrap th:first-child{background:transparent}
.tbl-wrap table th{background:var(--surface)!important}
html[data-theme="dark"] .tbl-wrap table th{background:#16263f!important}
td{border-bottom:.5px solid var(--sep2);padding:6px 6px}
tbody tr{transition:background .12s}
tbody tr:hover td{background:rgba(0,122,255,.035)}
.tbl-wrap td:first-child{background:var(--surface)}
html[data-theme="dark"] .tbl-wrap td:first-child{background:#16263f}
.tbl-wrap{background:var(--surface)!important;-webkit-backdrop-filter:none;backdrop-filter:none}
.tbl-wrap table td{font-size:12.5px;font-weight:450;letter-spacing:0;text-transform:none;color:var(--label);background:transparent;position:static;z-index:auto}
.tbl-wrap table td:first-child{position:sticky;left:0;z-index:2}
.tbl-wrap .sec-row td{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#007aff}
.tbl-wrap .total-row td{font-weight:700}
.tbl-wrap .dobit-row td{color:#fff!important}
.sec-row td{background:rgba(0,122,255,.05)!important;color:#007aff;letter-spacing:.06em;font-size:11px;border-top:none}
.total-row td{background:var(--fill)!important;border-top:none;border-bottom:none;font-size:12px}
.dobit-row td{background:linear-gradient(90deg,#0f1e35,#1f3a63)!important}
.num{font-size:12px}

/* Unosi */
.num-input,.txt-input,.search-inp{background:var(--fill);border:1px solid transparent;border-radius:9px;font-size:13px}
.num-input:hover,.txt-input:hover{background:var(--fill);border-color:rgba(0,0,0,.06)}
.num-input:focus,.txt-input:focus,.search-inp:focus{border-color:#007aff;background:var(--surface);box-shadow:0 0 0 3px rgba(0,122,255,.18)}
.search-inp{height:36px;border-radius:10px;max-width:340px}
#view select{border-radius:10px}

/* Segmentirani izbor mjeseci */
.month-picker{display:inline-flex;gap:2px;padding:3px;background:var(--fill);border-radius:12px;flex-wrap:wrap}
.mbtn{border-radius:9px;background:transparent;font-size:12px;padding:6px 12px;color:var(--label3)}
.mbtn.has{background:transparent;box-shadow:none;color:var(--label)}
.mbtn.act{background:var(--surface);color:var(--label);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.12),0 0 0 .5px rgba(0,0,0,.04)}
html[data-theme="dark"] .mbtn.act{background:#2b4570;color:#fff}

/* Gumbi i oznake */
.add-btn{height:30px;padding:0 13px;border-radius:9px;background:rgba(0,122,255,.1);color:#007aff;font-size:12.5px}
.del-btn{border-radius:8px}
.chip{border:none;background:var(--glass);box-shadow:var(--shadow-sm),inset 0 0 0 .5px var(--sep);font-size:12.5px;padding:8px 14px}
.chip:hover{box-shadow:0 4px 14px rgba(0,0,0,.08),inset 0 0 0 .5px var(--sep)}

/* Upozorenja */
.al-card{border-radius:16px;padding:14px 16px;background:var(--glass)!important;-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);
  border:1px solid var(--glass-brd)!important;box-shadow:var(--shadow);align-items:center}
.al-icon{width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;color:#fff;margin:0;font-size:0}
.al-title{font-size:14px}
.al-empty{font-size:15px}

/* Opci modali */
.pnOvl{-webkit-backdrop-filter:blur(10px) saturate(140%);backdrop-filter:blur(10px) saturate(140%);background:rgba(10,16,30,.36)!important}
.pnModal:not(.rsf){background:var(--glass)!important;-webkit-backdrop-filter:blur(30px) saturate(180%);backdrop-filter:blur(30px) saturate(180%);
  border:1px solid var(--glass-brd);border-radius:22px!important;box-shadow:0 30px 80px rgba(0,0,0,.28)!important;animation:rsfPop .26s cubic-bezier(.2,.9,.3,1.15)}
html[data-theme="dark"] .pnModal:not(.rsf){background:rgba(19,34,57,.94)!important}
.pnModal .mf-l{font-size:12.5px;font-weight:500;color:var(--label3);margin:0 0 6px 2px}
.pnModal input:not([type=checkbox]):not([type=radio]):not([type=file]),.pnModal select,.pnModal textarea{
  border:1px solid transparent!important;background:var(--fill)!important;border-radius:10px!important;color:var(--label)!important;font-size:14px!important}
.pnModal input:not([type=checkbox]):not([type=radio]):not([type=file]),.pnModal select{min-height:40px}
.pnModal input:focus,.pnModal select:focus,.pnModal textarea:focus{border-color:#007aff!important;box-shadow:0 0 0 3px rgba(0,122,255,.18)!important}
.pnModal .hbtn{height:38px;padding:0 16px;font-size:14px}

html[data-theme="dark"] #view [style*="background:#fff"]:not(img){background:var(--surface)!important;color:var(--label)}
html[data-theme="dark"] #view [style*="background:#ffffff"]{background:var(--surface)!important}
html[data-theme="dark"] #view [style*="color:var(--nav-600)"],
html[data-theme="dark"] #view [style*="color:var(--nav-800)"],
html[data-theme="dark"] #view [style*="color:var(--nav-900)"],
html[data-theme="dark"] #view [style*="color:#1a2744"],
html[data-theme="dark"] #view [style*="color:#1a1a2e"],
html[data-theme="dark"] #view [style*="color:#555"],
html[data-theme="dark"] #view [style*="color:#121826"]{color:var(--label)!important}
html[data-theme="dark"] #view [style*="color:var(--nav-500)"],html[data-theme="dark"] #view [style*="color:var(--nav-400)"]{color:#64a8ff!important}
html[data-theme="dark"] #view [style*="background:#f0fdf4"],
html[data-theme="dark"] #view [style*="background:#f1f3f5"],
html[data-theme="dark"] #view [style*="background:#f4f6f8"],
html[data-theme="dark"] #view [style*="background:#f5f5f5"],
html[data-theme="dark"] #view [style*="background:#fff5f5"],
html[data-theme="dark"] #view [style*="background:#f8f9fa"]{background:var(--surface2)!important}
/* Mobitel (mora biti na kraju sloja) */
@media(max-width:820px){
  .hbtn{padding:0 10px;font-size:12px}
  #headerSub{font-size:15px!important;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:34vw}
  #side:not(.open){box-shadow:none}
  .chart-box{height:200px!important}
  .tab-pane .sec-title:first-child,.tab-pane > div:first-child .sec-title:first-child{font-size:24px!important}
  .kpi-val,.ceo-val{font-size:24px}
  .month-picker{display:flex}
  .pnOvl:not(.rsf-ovl){align-items:flex-end!important;padding:0!important}
  .pnModal:not(.rsf){max-width:100%!important;border-radius:22px 22px 0 0!important;max-height:92vh!important}
}

/* ── POSTAVKE (Apple stil) ── */
.pst{max-width:760px;margin:0 auto;font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text','SF Pro Display','Helvetica Neue',sans-serif;
  --pst-glass:rgba(255,255,255,.72);--pst-brd:rgba(255,255,255,.7);--pst-inp:rgba(118,118,128,.08);--pst-line:rgba(60,60,67,.12);
  --pst-t:#1d1d1f;--pst-t2:#6e6e73;--pst-t3:#8e8e93}
html[data-theme="dark"] .pst{--pst-glass:rgba(19,34,57,.72);--pst-brd:rgba(255,255,255,.08);--pst-inp:rgba(118,118,128,.2);--pst-line:rgba(255,255,255,.08);
  --pst-t:#f5f5f7;--pst-t2:#a1a1a6;--pst-t3:#8e8e93}
.pst-head{margin:4px 4px 20px}
.pst-head h2{font-size:28px;font-weight:700;letter-spacing:-.025em;color:var(--pst-t);margin:0;line-height:1.15}
.pst-head p{font-size:13.5px;color:var(--pst-t2);margin:4px 0 0}
.pst-card{background:var(--pst-glass);-webkit-backdrop-filter:saturate(180%) blur(24px);backdrop-filter:saturate(180%) blur(24px);
  border:1px solid var(--pst-brd);border-radius:20px;padding:22px 24px;margin-bottom:18px;
  box-shadow:0 1px 2px rgba(0,0,0,.04),0 8px 28px rgba(15,23,42,.06)}
.pst-card-h{display:flex;align-items:center;gap:12px;margin-bottom:18px}
.pst-ico{width:34px;height:34px;border-radius:9px;display:inline-flex;align-items:center;justify-content:center;color:#fff;flex-shrink:0;
  box-shadow:inset 0 0 0 .5px rgba(0,0,0,.08)}
.pst-ico.sm{width:30px;height:30px;border-radius:8px}
.pst-ico.sm svg{width:15px;height:15px}
.pst-title{font-size:16px;font-weight:600;color:var(--pst-t);letter-spacing:-.01em}
.pst-sub{font-size:12.5px;color:var(--pst-t3);margin-top:1px}
.pst-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px 16px}
.pst-f.full{grid-column:1/-1}
.pst-f label{display:block;font-size:12px;font-weight:500;color:var(--pst-t2);margin:0 0 6px 2px}
.pst .pst-f input{width:100%;height:42px;padding:0 13px;box-sizing:border-box;background:var(--pst-inp);border:1px solid transparent;border-radius:11px;
  font-family:inherit;font-size:14px;color:var(--pst-t);outline:none;transition:border-color .15s,box-shadow .15s,background .15s}
.pst .pst-f input::placeholder{color:var(--pst-t3);opacity:.7}
.pst .pst-f input:focus{border-color:#007aff;box-shadow:0 0 0 4px rgba(0,122,255,.16);background:var(--surface)}
.pst-logo-row{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.pst-logo{width:180px;height:96px;border-radius:14px;border:1.5px dashed var(--pst-line);background:var(--pst-inp);
  display:flex;align-items:center;justify-content:center;overflow:hidden;padding:10px;box-sizing:border-box}
.pst-logo img{max-width:100%!important;max-height:76px!important;object-fit:contain}
.pst-logo{background:#fff}
.pst-empty{font-size:12.5px;color:var(--pst-t3)}
.pst-logo-btns{display:flex;gap:8px;flex-wrap:wrap}
.pst-btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:34px;padding:0 15px;border-radius:10px;border:none;cursor:pointer;
  font-family:inherit;font-size:13px;font-weight:500;white-space:nowrap;transition:transform .1s,opacity .15s,background .15s;margin:0}
.pst-btn:hover{opacity:.85}.pst-btn:active{transform:scale(.97)}
.pst-btn.pri{background:#007aff;color:#fff}

.ap-list{margin-top:14px;border-radius:14px;overflow:hidden;background:var(--surface);box-shadow:inset 0 0 0 .5px var(--sep)}

.ap-row{display:flex;align-items:center;gap:12px;padding:11px 14px;position:relative;transition:background .12s}
.ap-row+.ap-row:before{content:'';position:absolute;top:0;left:58px;right:0;height:.5px;background:var(--sep)}
.ap-row:hover{background:rgba(0,122,255,.035)}
.ap-tile{width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;color:#fff;flex-shrink:0}
.ap-av{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:14px;flex-shrink:0}
.ap-rt{flex:1;min-width:0}
.ap-rn{font-size:14px;font-weight:600;color:var(--label);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ap-rs{font-size:12.5px;color:var(--label3);margin-top:2px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.ap-amt{font-size:14.5px;font-weight:700;color:#ff3b30;white-space:nowrap;font-variant-numeric:tabular-nums}
.ap-amt.green{color:#248a3d}
html[data-theme="dark"] .ap-amt.green{color:#30d158}
.ap-amt small{font-size:10px;color:var(--label3);font-weight:600}
.ap-ok{width:30px;height:30px;border-radius:50%;border:none;cursor:pointer;background:rgba(52,199,89,.14);color:#248a3d;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .15s}
.ap-ok:hover{background:#34c759;color:#fff;transform:scale(1.06)}
.ap-x{width:28px;height:28px;border-radius:50%;border:none;cursor:pointer;background:transparent;color:var(--label4);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.ap-x:hover{background:rgba(255,59,48,.1);color:#ff3b30}
.ap-rok{font-size:11px;font-weight:600;padding:1px 8px;border-radius:999px;background:var(--fill);color:var(--label2)}
.ap-rok.red{background:rgba(255,59,48,.12);color:#ff3b30}
.ap-rok.org{background:rgba(255,149,0,.14);color:#c26a00}
.ap-req{font-size:10.5px;font-weight:600;color:#007aff;background:rgba(0,122,255,.1);padding:1px 7px;border-radius:999px;margin-left:4px;vertical-align:1px}
.ap-empty{text-align:center;padding:26px 10px 10px;color:var(--label4)}
.ap-empty div{font-size:15px;font-weight:600;color:var(--label2);margin-top:8px}
.ap-empty span{font-size:12.5px;color:var(--label3)}
.ap-row-card{margin-top:16px}
@media(max-width:900px){ .ap-grid{grid-template-columns:1fr} }
@media(max-width:560px){ .ap-card{padding:18px 14px} .ap-row-card .ap-head{flex-wrap:wrap} .ap-row-card .ap-btn{width:100%;justify-content:center} .ap-total{font-size:17px} }
/* ── MOBILNO SUČELJE ── */
#mobTop,#mobTabs{display:none}
body.mob #side,body.mob .header,body.mob #sideOverlay{display:none!important}
body.mob #main{width:100%}
body.mob #view{padding:calc(60px + env(safe-area-inset-top)) 0 calc(96px + env(safe-area-inset-bottom))}
body.mob .content{padding:14px 16px 10px;max-width:100%}
body.mob #autoTitle{font-size:30px!important;margin:2px 2px 16px!important}
body.mob #backBar{margin:0 0 12px}
body.mob{--font:-apple-system,BlinkMacSystemFont,'SF Pro Text','SF Pro Display','Inter',sans-serif}

#mobTop{position:fixed;top:0;left:0;right:0;height:calc(60px + env(safe-area-inset-top));padding:env(safe-area-inset-top) 14px 0;z-index:300;
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  background:var(--glass);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);border-bottom:.5px solid var(--sep)}
body.mob #mobTop{display:flex}
.mob-brand{display:flex;align-items:center;gap:10px;min-width:0}
.mob-brand img{width:34px;height:34px;border-radius:9px;object-fit:contain;background:#fff;padding:2px}
.mob-lg{width:34px;height:34px;border-radius:9px;background:linear-gradient(145deg,var(--gold),var(--gold-d));color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:15px}
.mob-bn{font-size:14px;font-weight:700;color:var(--label);letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:42vw}
.mob-bs{font-size:11px;color:var(--label3);margin-top:1px}
.mob-right{display:flex;align-items:center;gap:8px;flex-shrink:0}
.mob-dot{width:8px;height:8px;border-radius:50%;background:#34c759;box-shadow:0 0 0 3px rgba(52,199,89,.2)}
.mob-chip{display:inline-flex;align-items:center;gap:5px;height:32px;padding:0 11px;border:none;border-radius:999px;background:var(--fill);color:var(--label);
  font-family:var(--font);font-size:13px;font-weight:600;cursor:pointer}
.mob-chip.ico{padding:0;width:32px;justify-content:center;color:var(--label2)}

#mobTabs{position:fixed;left:0;right:0;bottom:0;z-index:300;height:calc(64px + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);
  display:flex;align-items:center;justify-content:space-around;
  background:var(--glass);-webkit-backdrop-filter:saturate(180%) blur(22px);backdrop-filter:saturate(180%) blur(22px);border-top:.5px solid var(--sep)}
body.mob #mobTabs{display:flex}
.mob-tab{flex:1;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;border:none;background:none;cursor:pointer;
  color:var(--label3);font-family:var(--font);font-size:10.5px;font-weight:500;padding:0;transition:color .15s}
.mob-tab.on{color:#007aff}
.mob-fab{width:58px;height:58px;margin-top:-22px;border:none;border-radius:50%;background:#007aff;color:#fff;cursor:pointer;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;box-shadow:0 8px 22px rgba(0,122,255,.45);transition:transform .12s}
.mob-fab:active{transform:scale(.94)}

.mob-head{margin:2px 2px 16px}
.mob-kick{font-size:12.5px;font-weight:700;letter-spacing:.08em;color:#007aff;text-transform:uppercase}
.mob-h1{font-size:34px;font-weight:700;letter-spacing:-.03em;color:var(--label);margin:2px 0 0;line-height:1.1}
.mob-sub{font-size:14px;color:var(--label3);margin-top:6px;line-height:1.35}
.mob-new{display:inline-flex;align-items:center;gap:8px;height:46px;padding:0 22px 0 18px;margin-bottom:18px;border:none;border-radius:999px;cursor:pointer;
  background:#007aff;color:#fff;font-family:var(--font);font-size:16px;font-weight:600;box-shadow:0 8px 22px rgba(0,122,255,.35)}
.mob-new:active{transform:scale(.97)}
.mob-kpis{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px}
.mob-kpi{background:var(--glass);border:1px solid var(--glass-brd);border-radius:20px;padding:14px 14px 16px;box-shadow:var(--shadow);min-width:0}
.mob-kpi-i{width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;color:#fff;margin-bottom:10px}
.mob-kpi-l{font-size:13px;color:var(--label3);font-weight:500;line-height:1.25}
.mob-kpi-v{font-size:22px;font-weight:700;letter-spacing:-.03em;color:var(--label);margin-top:4px;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mob-kpi-v.green{color:#248a3d}.mob-kpi-v.red{color:#ff3b30}
html[data-theme="dark"] .mob-kpi-v.green{color:#30d158}
.mob-kpi-s{font-size:11.5px;color:var(--label4);margin-top:3px;line-height:1.3}
.mob-card{display:block;width:100%;text-align:left;background:var(--glass);border:1px solid var(--glass-brd);border-radius:22px;padding:18px 16px;margin-bottom:14px;box-shadow:var(--shadow)}
.mob-link{cursor:pointer;-webkit-tap-highlight-color:transparent}
.mob-link:active{transform:scale(.99)}
.mob-ct{font-size:17px;font-weight:600;letter-spacing:-.015em;color:var(--label)}
.mob-cs{font-size:13px;color:var(--label3);margin-top:3px}
.mob-big{font-size:28px;font-weight:700;letter-spacing:-.03em;color:var(--label);margin:8px 0 2px;font-variant-numeric:tabular-nums}
.mob-big.red{color:#ff3b30}
.mob-badge{background:#ff3b30;color:#fff;font-size:11px;font-weight:700;border-radius:999px;padding:1px 7px;min-width:20px;text-align:center}
.mob-chev{color:var(--label4);display:flex;align-items:center}
body.mob .ap-cap{margin:18px 4px 7px}
.mob-acts{display:flex;flex-direction:column;gap:10px;margin-bottom:6px}
.mob-act{display:flex;align-items:center;gap:13px;width:100%;padding:13px 14px;border:none;border-radius:16px;background:var(--rsf-card,var(--surface));cursor:pointer;text-align:left}
.mob-act:active{transform:scale(.98)}
.mob-act-t b{display:block;font-family:var(--font);font-size:15.5px;font-weight:600;color:var(--label)}
.mob-act-t span{font-size:12.5px;color:var(--label3)}
/* na mobitelu su tablice i kartice uže */
body.mob .charts-grid,body.mob .ceo-grid,body.mob .fc-grid,body.mob .ap-grid{grid-template-columns:1fr!important}
body.mob .kpi-grid{grid-template-columns:1fr 1fr!important;gap:12px}
body.mob .kpi-card{padding:14px}
body.mob .kpi-val{font-size:20px}
body.mob .sec-title{font-size:26px!important}
body.mob .tab-pane .sec-title:first-child{font-size:30px!important}

.mob-god{display:inline-flex;align-items:center;gap:2px;padding:3px;border-radius:12px;background:var(--fill)}
.mob-god-y{border:none;border-radius:9px;background:var(--surface);color:var(--label);font-family:var(--font);font-size:13px;font-weight:700;padding:5px 12px;box-shadow:0 1px 3px rgba(0,0,0,.12)}
.mob-god-p{border:none;background:transparent;color:var(--label3);width:26px;height:26px;border-radius:8px;font-size:16px;font-weight:700;cursor:pointer}
.mob-per{display:flex;align-items:center;gap:10px;margin:0 2px 16px}
.mob-per span{font-size:11px;font-weight:700;letter-spacing:.06em;color:var(--label3);text-transform:uppercase;flex-shrink:0}
.mob-per select{flex:1;min-width:0;height:40px;border:none;border-radius:12px;background:var(--fill);color:var(--label);font-family:var(--font);font-size:15px;padding:0 12px}

.mob-per-row{width:100%;text-align:left;border:none;background:none;cursor:pointer}
.mob-per-row.on .ap-rn{color:#007aff;font-weight:600}
.mob-per-ok{color:#007aff;display:flex;align-items:center}

.izv-segs{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.izv-seg{display:flex;flex-direction:column;align-items:center;gap:6px;padding:14px 6px;border:none;border-radius:14px;cursor:pointer;
  background:var(--rsf-card,var(--surface));color:var(--label2);font-family:var(--font);font-size:13px;font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.05)}
.izv-seg.on{background:#007aff;color:#fff;box-shadow:0 6px 16px rgba(0,122,255,.3)}
.izv-row{width:100%;text-align:left;border:none;background:none;cursor:pointer}
.izv-row.on .ap-rn{color:#007aff}
.izv-djel{padding:0 14px 12px}
.izv-djel select{width:100%;height:38px;border:none;border-radius:10px;background:var(--fill);color:var(--label);font-family:var(--font);font-size:14px;padding:0 10px}

/* ── Nadzorna ploča: raspored po uzoru na Perla Notte HACCP ── */
.hd-cap{font-size:10.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--label3);margin:2px 0 9px}
.hd-status{display:grid;grid-template-columns:repeat(auto-fit,minmax(255px,1fr));gap:11px;margin-bottom:20px}
.hd-card{display:flex;align-items:center;gap:12px;width:100%;text-align:left;cursor:pointer;font-family:inherit;
  background:var(--surface);border:.5px solid var(--sep);border-radius:16px;padding:13px 14px;transition:transform .12s,box-shadow .15s,border-color .15s}
.hd-card:hover{transform:translateY(-1px);box-shadow:0 6px 20px rgba(0,0,0,.07);border-color:var(--sep2)}
.hd-card:active{transform:scale(.99)}
.hd-ico{width:34px;height:34px;border-radius:10px;display:inline-flex;align-items:center;justify-content:center;color:#fff;flex:0 0 34px}
.hd-ico.sm{width:28px;height:28px;border-radius:9px;flex:0 0 28px;margin-bottom:9px}
.hd-body{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.hd-t{font-size:13.5px;font-weight:650;color:var(--label);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hd-s{font-size:11px;color:var(--label3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hd-badge{font-size:10px;font-weight:700;letter-spacing:.2px;padding:3px 9px;border-radius:20px;white-space:nowrap;
  background:var(--surface2);color:var(--label3)}
.hd-badge.ok{background:var(--green-bg);color:var(--green)}
.hd-badge.warn{background:rgba(255,149,0,.13);color:#ff9500}
.hd-badge.bad{background:var(--red-bg);color:var(--red)}
.hd-chev{color:var(--label4);display:flex;flex:0 0 15px}

.hd-kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(215px,1fr));gap:11px;margin-bottom:20px}
.hd-kpi{background:var(--surface);border:.5px solid var(--sep);border-radius:16px;padding:15px 16px}
.hd-kl{font-size:11px;color:var(--label3);margin-bottom:3px}
.hd-kv{font-size:24px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.15}
.hd-kv em{font-style:normal;font-size:11px;font-weight:500;color:var(--label4);margin-left:2px}
.hd-kn{font-size:11px;color:var(--label3);margin-top:4px}

.hd-split{display:grid;grid-template-columns:minmax(0,1.85fr) minmax(0,1fr);gap:14px;margin-bottom:18px;align-items:start}
@media (max-width:1150px){ .hd-split{grid-template-columns:minmax(0,1fr)} }
.hd-side{background:var(--surface);border:.5px solid var(--sep);border-radius:18px;padding:16px 17px}
.hd-cal-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:12px}
.hd-ct{font-size:13.5px;font-weight:650;color:var(--label)}
.hd-cs{font-size:11px;color:var(--label3);margin-top:2px}
.hd-cal-nav{display:flex;gap:5px}
.hd-cal-nav button{width:26px;height:26px;border-radius:8px;border:.5px solid var(--sep);background:var(--surface2);
  color:var(--label2);cursor:pointer;font-size:15px;line-height:1;font-family:inherit;padding:0}
.hd-cal-nav button:hover{color:var(--nav-500);border-color:var(--nav-500)}
.hd-cal-dow{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:5px}
.hd-cal-dow span{font-size:9.5px;font-weight:700;letter-spacing:.4px;color:var(--label4);text-align:center}
.hd-cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.hd-d{aspect-ratio:1/1;border-radius:8px;display:flex;align-items:flex-end;justify-content:flex-end;
  padding:4px 5px;font-size:10.5px;font-weight:600;font-variant-numeric:tabular-nums;cursor:default}
.hd-d.empty{background:none}
.hd-d.ok{background:rgba(52,199,89,.18);color:#248a3d}
.hd-d.miss{background:rgba(255,59,48,.15);color:#c9302c}
.hd-d.soon{background:var(--surface2);color:var(--label4)}
html[data-theme="dark"] .hd-d.ok{background:rgba(52,199,89,.2);color:#5fd97e}
html[data-theme="dark"] .hd-d.miss{background:rgba(255,59,48,.2);color:#ff7a70}
.hd-cal-leg{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:12px;font-size:10.5px;color:var(--label3)}
.hd-cal-leg span{display:inline-flex;align-items:center;gap:5px}
.hd-cal-leg i{width:9px;height:9px;border-radius:3px;display:inline-block}
.hd-cal-leg i.ok{background:rgba(52,199,89,.55)}
.hd-cal-leg i.miss{background:rgba(255,59,48,.5)}
.hd-cal-leg i.soon{background:var(--surface3)}
.hd-cal-leg b{margin-left:auto;color:var(--label2);font-weight:650}

body.mob .hd-status,body.mob .hd-kpis{grid-template-columns:minmax(0,1fr)}
body.mob .hd-split{grid-template-columns:minmax(0,1fr)}

/* ── Vending aparati ── */
.mob-chip.ap{gap:5px;padding:0 10px;font-size:11px;font-weight:700;letter-spacing:.3px;max-width:104px;overflow:hidden}
.mob-chip.ap .ap-dot{width:7px;height:7px;flex:0 0 7px;box-shadow:none}
.pst-fields{display:flex;flex-direction:column;gap:7px;margin-top:8px;max-width:420px}
.pst-inp{width:100%;height:36px;padding:0 12px;box-sizing:border-box;background:var(--pst-inp);border:1px solid transparent;border-radius:10px;
  font-family:inherit;font-size:13px;color:inherit;outline:none}
.pst-inp:focus{box-shadow:0 0 0 3px rgba(0,122,255,.22)}
.pst-chk{display:inline-flex;align-items:center;gap:7px;margin-top:9px;font-size:12.5px;color:var(--pst-t3);cursor:pointer}
.pst-chk input{width:auto;height:auto}
.cfr-red{display:flex;align-items:center;gap:12px;width:100%;padding:8px 4px;border:none;background:none;cursor:pointer;
  font-family:inherit;border-top:.5px solid var(--sep);text-align:left;transition:background .15s}
.cfr-red:hover{background:var(--surface2)}
.cfr-d{flex:0 0 54px;font-size:11.5px;color:var(--label2)}
.cfr-o{flex:1;min-width:0;font-size:12.5px;color:var(--label);display:flex;flex-direction:column;gap:1px}
.cfr-o i{font-style:normal;font-size:10.5px;color:var(--label3)}
.cfr-i{font-size:12.5px;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.ap-hdr{display:inline-flex;align-items:center;gap:10px;padding:7px 14px 7px 13px;border-radius:14px;border:1px solid var(--sep);
  background:var(--surface);color:var(--label);font-family:inherit;cursor:pointer;text-align:left;max-width:340px;transition:border-color .15s,transform .1s}
.ap-hdr:hover{border-color:var(--nav-500)}
.ap-hdr:active{transform:scale(.985)}
.ap-hdr .ap-dot{width:9px;height:9px;flex:0 0 9px}
.ap-hdr-t{display:flex;flex-direction:column;gap:1px;min-width:0}
.ap-hdr-t b{font-size:17px;font-weight:700;letter-spacing:-.01em;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ap-hdr-t em{font-style:normal;font-size:11px;color:var(--label3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
body.mob .ap-hdr{max-width:100%;width:100%}
body.mob .ap-hdr-t b{font-size:15px}
.ap-chip-lg{height:34px;font-size:12.5px;max-width:300px}
.ap-chip{display:inline-flex;align-items:center;gap:7px;height:32px;padding:0 13px;border-radius:999px;border:1px solid var(--sep);
  background:var(--surface);color:var(--label);font-family:inherit;font-size:12px;font-weight:600;cursor:pointer;white-space:nowrap;
  max-width:230px;overflow:hidden;text-overflow:ellipsis;transition:border-color .15s,transform .1s}
.ap-chip:hover{border-color:var(--nav-500)}
.ap-chip:active{transform:scale(.97)}
.ap-dot{width:8px;height:8px;border-radius:50%;background:#34c759;flex:0 0 8px;box-shadow:0 0 0 3px rgba(52,199,89,.18)}
.ap-dot.svi{background:#007aff;box-shadow:0 0 0 3px rgba(0,122,255,.18)}

.ap-izbor{display:flex;align-items:center;gap:12px;width:100%;min-height:58px;padding:9px 14px;border:none;background:none;
  cursor:pointer;font-family:inherit;text-align:left;position:relative}
.ap-izbor+.ap-izbor:before{content:'';position:absolute;top:0;left:56px;right:0;height:.5px;background:var(--rsf-line)}
.ap-izbor.on{background:rgba(0,122,255,.1)}
.ap-izbor-t{display:flex;flex-direction:column;gap:2px;min-width:0;flex:1}
.ap-izbor-t b{font-size:15px;font-weight:600;color:var(--rsf-t);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ap-izbor-t i{font-style:normal;font-size:12px;color:var(--rsf-t3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.ap-preg{background:var(--surface);border:.5px solid var(--sep);border-radius:16px;padding:14px 16px;margin-bottom:16px}
.ap-preg-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:10px;
  font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--label3)}
.ap-preg-h b{font-size:14px;letter-spacing:-.01em;text-transform:none;color:var(--green)}
.ap-preg-r{display:flex;align-items:center;gap:10px;width:100%;padding:6px 4px;border:none;background:none;cursor:pointer;
  font-family:inherit;border-radius:8px;transition:background .15s}
.ap-preg-r:hover{background:var(--surface2)}
.ap-preg-r.on{background:var(--blue-bg)}

  }

function periodDatumU(iso){ // '2026-07-15'

  return '<span style="color:'+c+';font-weight:600">'+(v<0?'-':'')+fmt2(v)+'</span> <span style="font-size:9px;color:#aaa;font-weight:400">EUR</span>';
}
function syncTDtoP(id) {
  var key = TAB_TO_P[id]; if (!key) return;
  if (!P[key]) P[key]=mk12();
  for (var i=0; i<12; i++) P[key][i] = sumR(TD[id][i]);
}
function getRowVal(k, i) { return (P[k] && P[k][i]) ? parseFloat(P[k][i])||0 : 0; }

// ═══════════════════════════════════════════
// CALC
// ═══════════════════════════════════════════
function getKeys(sec) {
  var r=[];
  for (var i=0; i<ROWS.length; i++) { if (ROWS[i].sec===sec) r.push(ROWS[i].key); }
  return r;
}
function calc26() {
  var pK=getKeys('place'), fK=getKeys('fiksni'), oK=getKeys('ostali');
  var rashodi=[]; var dobit=[];
  for (var i=0; i<12; i++) {
    var t=0;
    var j;
    for (j=0; j<pK.length; j++) t+=getRowVal(pK[j],i);
    for (j=0; j<fK.length; j++) t+=getRowVal(fK[j],i);
    for (j=0; j<oK.length; j++) t+=getRowVal(oK[j],i);
    rashodi.push(t);
    dobit.push((getRowVal('prihodi_grupe',i)||0)-t);
  }
  // Kombinirani prihodi: prihodi_grupe + prihodi_vending (dnevni)
  var _pv = P.prihodi_vending || mk12();
  var _comb = mk12();
  for (var _ci=0; _ci<12; _ci++) {
    _comb[_ci] = (parseFloat((P.prihodi_grupe && P.prihodi_grupe[_ci]) || 0)) + (parseFloat(_pv[_ci]) || 0);
    dobit[_ci] = _comb[_ci] - rashodi[_ci];
  }
  return {prihodi:_comb, rashodi:rashodi, dobit:dobit};
}

var chartU=null, chartP=null, chartR=null, chartD=null, chartS=null;

function cf() { return {family:"'Calibri Light','Calibri','Carlito',sans-serif", size:10}; }
function makeTooltip() {
  return {callbacks:{label:function(ctx){
    var v = (ctx.raw != null) ? ctx.raw : 0;
    return ' '+ctx.dataset.label+': '+v.toLocaleString('hr-HR',{minimumFractionDigits:2,maximumFractionDigits:2})+' EUR';
  }}};
}
function makeYAxis() {
  return {ticks:{font:cf(), callback:function(v){
    return v.toLocaleString('hr-HR',{maximumFractionDigits:0})+'EUR';
  }}};
}

function buildCharts() {
  var c26 = calc26();
  var baseOpt = {
    responsive:true, maintainAspectRatio:false,
    plugins:{legend:{labels:{font:cf(),boxWidth:12}}, tooltip:makeTooltip()},
    scales:{x:{ticks:{font:cf()}}, y:makeYAxis()}
  };

  if (chartU) chartU.destroy();
  chartU = new Chart(document.getElementById('cU'), {
    type:'bar',
    data:{labels:MONTHS, datasets:[
      {label:'Prihodi 2026', data:c26.prihodi, backgroundColor:'rgba(34,197,94,.85)', borderRadius:6, barPercentage:.62, categoryPercentage:.7},
      {label:'Rashodi 2026', data:c26.rashodi, backgroundColor:'rgba(239,68,68,.85)', borderRadius:6, barPercentage:.62, categoryPercentage:.7}
    ]},
    options:{responsive:true, maintainAspectRatio:false, plugins:{legend:{position:'top',labels:{font:cf(),boxWidth:12}},tooltip:makeTooltip()}, scales:{x:{ticks:{font:cf()}},y:makeYAxis()}}
  });

  if (chartP) chartP.destroy();
  chartP = new Chart(document.getElementById('cP'), {
    type:'bar',
    data:{labels:MONTHS, datasets:[
      {label:'Prihodi', data:c26.prihodi, backgroundColor:'rgba(34,197,94,.85)', borderRadius:6, barPercentage:.5, categoryPercentage:.65}
    ]},
    options:baseOpt
  });

  if (chartR) chartR.destroy();
  chartR = new Chart(document.getElementById('cR'), {
    type:'bar',
    data:{labels:MONTHS, datasets:[
      {label:'Rashodi', data:c26.rashodi, backgroundColor:'rgba(239,68,68,.85)', borderRadius:6, barPercentage:.5, categoryPercentage:.65}
    ]},
    options:baseOpt
  });

  if (chartD) chartD.destroy();
  var dobitBg = [];
  for (var di=0; di<c26.dobit.length; di++) {
    dobitBg.push(c26.dobit[di]>=0 ? 'rgba(34,197,94,.85)' : 'rgba(220,38,38,.8)');
  }
  chartD = new Chart(document.getElementById('cD'), {
    type:'bar',
    data:{labels:MONTHS, datasets:[
      {label:'Dobit', data:c26.dobit, backgroundColor:dobitBg, borderRadius:6, barPercentage:.5, categoryPercentage:.65}
    ]},
    options:baseOpt
  });

  if (chartS) chartS.destroy();
  var pK=getKeys('place'), fK=getKeys('fiksni'), oK=getKeys('ostali');
  var sv0=0,sv1=0,sv2=0, j;
  for (j=0; j<pK.length; j++) sv0+=sumA(P[pK[j]]);
  for (j=0; j<fK.length; j++) sv1+=sumA(P[fK[j]]);
  for (j=0; j<oK.length; j++) sv2+=sumA(P[oK[j]]);
  var sVals=[sv0,sv1,sv2];
  var sLbls=['Pla\u0107e','Fiksni','Ostali'];
  var sBg=['rgba(245,158,11,.85)','rgba(239,68,68,.85)','rgba(139,92,246,.85)'];

  var sTot=sVals.reduce(function(a,b){return a+b;},0);
  var sEmpty = sTot<=0;
  chartS = new Chart(document.getElementById('cS'), {
    type:'doughnut',
    data: sEmpty
      ? {labels:['Nema podataka'], datasets:[{data:[1], backgroundColor:['#e2e5ec'], borderWidth:0, spacing:0}]}
      : {labels:sLbls, datasets:[{data:sVals, backgroundColor:sBg, borderWidth:0, borderRadius:4, spacing:3}]},
    options:{
      responsive:true,
      maintainAspectRatio:false,
      cutout:'74%',
      centerText: sEmpty ? {label:'Nema tro\u0161kova', value:'jo\u0161 uneseno'} : {label:'Ukupno', value:fmt2(sTot)+' EUR'},
      plugins:{
        legend:{display:false},
        tooltip:{enabled:!sEmpty, callbacks:{label:function(ctx){
          var rv = (ctx.raw!=null) ? ctx.raw : 0;
          var tot=0;
          for (var i=0; i<ctx.dataset.data.length; i++) tot+=ctx.dataset.data[i];
          var pct = tot>0 ? ((rv/tot)*100).toFixed(1) : '0.0';
          return ' '+ctx.label+': '+rv.toLocaleString('hr-HR',{minimumFractionDigits:2,maximumFractionDigits:2})+' EUR ('+pct+'%)';
        }}}
      }
    }
  });

  var cSLegendEl=document.getElementById('cSLegend');
  if (cSLegendEl) {
    var legH='';
    for (var _si=0; _si<sLbls.length; _si++) {
      if (!sVals[_si]) continue;
      var _pct = sTot>0 ? ((sVals[_si]/sTot)*100).toFixed(1) : '0.0';
      legH+='<div style="display:flex;align-items:center;justify-content:space-between;padding:5px 0;border-bottom:1px solid var(--sep2);font-size:12px">';
      legH+='<span style="display:flex;align-items:center;gap:7px"><span style="width:9px;height:9px;border-radius:3px;background:'+sBg[_si]+';flex:0 0 9px"></span>'+sLbls[_si].toUpperCase()+'</span>';
      legH+='<span><b>'+fmt2(sVals[_si])+' €</b> <span style="color:var(--label3);margin-left:6px">'+_pct+' %</span></span></div>';
    }
    cSLegendEl.innerHTML=legH;
  }
  refreshKPI(c26);
}

function refreshCharts() {
  var c26=calc26();
  if (typeof pFilt==='function') c26={prihodi:pFilt(c26.prihodi), rashodi:pFilt(c26.rashodi), dobit:pFilt(c26.dobit)};
  // naslovi grafova prate razdoblje
  try {
    var _p=periodLbl();
    var _t=document.querySelectorAll('#tab-dash .chart-title');
    if (_t[0]) _t[0].textContent='Prihodi vs Rashodi \u00b7 '+_p;
  } catch(e) {}
  if (chartU) {
    chartU.data.datasets[0].data=c26.prihodi;
    chartU.data.datasets[1].data=c26.rashodi; chartU.update();
  }
  if (chartP) { chartP.data.datasets[0].data=c26.prihodi; chartP.update(); }
  if (chartR) { chartR.data.datasets[0].data=c26.rashodi; chartR.update(); }
  if (chartD) {
    var bg=[];
    for (var i=0; i<c26.dobit.length; i++) bg.push(c26.dobit[i]>=0?'rgba(34,197,94,.85)':'rgba(220,38,38,.8)');
    chartD.data.datasets[0].data=c26.dobit; chartD.data.datasets[0].backgroundColor=bg; chartD.update();
  }
  if (chartS) {
    var pK=getKeys('place'), fK=getKeys('fiksni'), oK=getKeys('ostali');
    var sv0=0,sv1=0,sv2=0,j;
    for (j=0; j<pK.length; j++) sv0+=sumA(pFilt(P[pK[j]]));
    for (j=0; j<fK.length; j++) sv1+=sumA(pFilt(P[fK[j]]));
    for (j=0; j<oK.length; j++) sv2+=sumA(pFilt(P[oK[j]]));
    chartS.data.datasets[0].data=[sv0,sv1,sv2]; chartS.update();
  }
  refreshKPI(c26);
  try { if (document.getElementById('cArtikli') && typeof buildArtikliChart==='function') buildArtikliChart(); } catch(e) {}
  try { if (document.getElementById('cCum') && typeof buildCumulativeChart==='function') buildCumulativeChart(); } catch(e) {}
}

// ── Statusne kartice (gornji red) ──
function hdStatusHtml(){
  var h='';
  // Dospijeća
  var dosp=(typeof getDospijeca==='function')?getDospijeca():[];
  var dospIzn=0; dosp.forEach(function(it){ dospIzn+=(pnImaRate(it.r)?pnOstatak(it.r):(parseFloat(it.r.iznos)||0)); });
  h+=hdKartica({ikona:'clock', boja:'#ff9500', naslov:'Dospijeća',
    podnaslov: dosp.length ? (dosp.length+' neplaćenih · '+fmt2(dospIzn)+' EUR') : 'nema dospjelih obveza',
    oznaka: dosp.length?'Kasni':'Uredno', stanje: dosp.length?'bad':'ok', akcija:"switchTab('dospijeca')"});

  // Čeka izvod
  var ceka=(typeof pnCekaIzvod==='function')?pnCekaIzvod():[];
  var cekaIzn=0; ceka.forEach(function(x){ cekaIzn+=x.iznos; });
  h+=hdKartica({ikona:'bank', boja:'#af52de', naslov:'Čeka izvod',
    podnaslov: ceka.length ? (ceka.length+' stavki · '+fmt2(cekaIzn)+' EUR') : 'sve je potvrđeno izvodom',
    oznaka: ceka.length?'Provjeri':'Uredno', stanje: ceka.length?'warn':'ok', akcija:"switchTab('cashflow')"});

  // Cash flow tjedan
  var neto=null;
  try { var cf=cfCalcWeek(); neto=0; for (var i=0;i<7;i++) neto+=cf.net[i]; } catch(e) {}
  h+=hdKartica({ikona:'wallet', boja:'#007aff', naslov:'Cash flow · tjedan',
    podnaslov: (neto===null?'—':((neto>=0?'+':'−')+fmt2(Math.abs(neto))+' EUR neto')),
    oznaka: (neto===null?'—':(neto>=0?'Pozitivan':'Negativan')), stanje:(neto===null?'':(neto>=0?'ok':'bad')), akcija:"switchTab('cashflow')"});

  // Prodaja po danima — pokrivenost tekućeg mjeseca
  var d=new Date(), mo=(d.getFullYear()===2026)?d.getMonth():HD_CAL_MO;
  var doDana=(d.getFullYear()===2026)?d.getDate():new Date(2026,mo+1,0).getDate();
  var ima=0; for (var dd=0; dd<doDana; dd++) if (parseFloat(DAILY[mo]&&DAILY[mo][dd])||0) ima++;
  var pot=(ima>=doDana);
  h+=hdKartica({ikona:'box', boja:'#34c759', naslov:'Prodaja po danima',
    podnaslov: ima+' od '+doDana+' dana · '+MNAMES[mo].toLowerCase(),
    oznaka: pot?'Potpuno':(ima?'Djelomično':'Nedostaje'), stanje: pot?'ok':(ima?'warn':'bad'), akcija:"switchTab('dnevni')"});
  return h;
}

// ── Kalendar pokrivenosti (desni stupac) ──
var HD_CAL_MO = (new Date()).getFullYear()===2026 ? (new Date()).getMonth() : 8;
function hdCalPomak(n){
  HD_CAL_MO=Math.max(0,Math.min(11,HD_CAL_MO+n));
  var el=document.getElementById('hdCalWrap'); if (el) el.innerHTML=hdCalHtml();
}
function hdCalHtml(){
  var mo=HD_CAL_MO, dana=new Date(2026,mo+1,0).getDate();
  var prvi=(new Date(2026,mo,1).getDay()+6)%7;             // ponedjeljak = 0
  var danas=new Date(), jeOvaGod=(danas.getFullYear()===2026);
  var uk=0, imaDana=0;
  var h='<div class="hd-cal-head"><div><div class="hd-ct">Pokrivenost — '+MNAMES[mo].toLowerCase()+'</div>'+
        '<div class="hd-cs" id="hdCalSub">Dnevna prodaja (Prodaja po danima)</div></div>'+
        '<div class="hd-cal-nav"><button type="button" onclick="hdCalPomak(-1)">‹</button><button type="button" onclick="hdCalPomak(1)">›</button></div></div>';
  h+='<div class="hd-cal-dow">'+['Po','Ut','Sr','Če','Pe','Su','Ne'].map(function(x){return '<span>'+x+'</span>';}).join('')+'</div>';
  h+='<div class="hd-cal">';
  for (var i=0;i<prvi;i++) h+='<span class="hd-d empty"></span>';
  for (var dd=1; dd<=dana; dd++) {
    var v=parseFloat(DAILY[mo]&&DAILY[mo][dd-1])||0;
    var dat=new Date(2026,mo,dd);
    var buduci = jeOvaGod ? (dat> danas) : false;
    var kls = buduci ? 'soon' : (v>0 ? 'ok' : 'miss');
    if (v>0) { uk+=v; imaDana++; }
    var tip = buduci ? (dd+'.'+(mo+1)+'. — još nije') : (dd+'.'+(mo+1)+'. — '+(v>0?fmt2(v)+' EUR':'nema unosa'));
    h+='<span class="hd-d '+kls+'" title="'+tip+'">'+dd+'</span>';
  }
  h+='</div>';
  h+='<div class="hd-cal-leg"><span><i class="ok"></i>Uneseno</span><span><i class="miss"></i>Nedostaje</span><span><i class="soon"></i>Predstoji</span>'+
     '<b>'+imaDana+' dana · '+fmt2(uk)+' EUR</b></div>';
  return h;
}

function refreshKPI(c26) {
  var _lbl=(typeof periodLbl==='function')?periodLbl():'2026';
  var _f=(typeof pFilt==='function')?pFilt:function(a){return a;};
  var p26=sumA(_f(c26.prihodi)), r26=sumA(_f(c26.rashodi)), d26=sumA(_f(c26.dobit));
  var marza = p26>0 ? ((d26/p26)*100).toFixed(1) : '0.0';

  var st=document.getElementById('hdStatus');
  if (st) st.innerHTML=hdStatusHtml();

  var g=document.getElementById('hdKpi');
  if (g) {
    var brojStavki=0;
    try { brojStavki=pnSveStavke().length; } catch(e) {}
    g.innerHTML =
      hdKpi({ikona:'up', boja:'#34c759', boja2:'var(--green)', label:'Ukupni prihodi · '+_lbl, vrijednost:fmt2(p26)+' <em>EUR</em>'}) +
      hdKpi({ikona:'down', boja:'#ff3b30', boja2:'var(--red)', label:'Ukupni rashodi · '+_lbl, vrijednost:fmt2(r26)+' <em>EUR</em>'}) +
      hdKpi({ikona:'chart', boja:(d26>=0?'#007aff':'#ff3b30'), boja2:(d26>=0?'var(--green)':'var(--red)'),
             label:'Dobit / gubitak · '+_lbl, vrijednost:(d26<0?'−':'')+fmt2(Math.abs(d26))+' <em>EUR</em>',
             nota:'Marža: <b style="color:'+(d26>=0?'var(--green)':'var(--red)')+'">'+marza+'%</b>'}) +
      hdKpi({ikona:'calendar', boja:'#af52de', label:'Evidentiranih stavki', vrijednost:String(brojStavki),
             nota:'u svim kategorijama 2026.'});
  }
  var cw=document.getElementById('hdCalWrap');
  if (cw) cw.innerHTML=hdCalHtml();

  // stari ID-evi (mobilni prikaz i starija mjesta)
  var k0=document.getElementById('kpi0'), k1=document.getElementById('kpi1'), k2=document.getElementById('kpi2');
  if (k0) k0.innerHTML='<div class="kpi-label">Ukupni prihodi · '+_lbl+'</div><div class="kpi-val green">'+fmt2(p26)+' <span style="font-size:11px;color:#aaa">EUR</span></div>';
  if (k1) k1.innerHTML='<div class="kpi-label">Ukupni rashodi · '+_lbl+'</div><div class="kpi-val red">'+fmt2(r26)+' <span style="font-size:11px;color:#aaa">EUR</span></div>';
  if (k2) k2.innerHTML='<div class="kpi-label">Dobit / gubitak · '+_lbl+'</div><div class="kpi-val '+(d26>=0?'green':'red')+'">'+(d26<0?'-':'')+fmt2(d26)+' <span style="font-size:11px;color:#aaa">EUR</span></div><div class="kpi-vs">Marža: <span style="color:'+(d26>=0?'#16a34a':'#dc2626')+'">'+marza+'%</span></div>';
}

function buildCumulativeChart() {

  var cum=[]; var run=0;
  for (var i=0;i<12;i++) { run+=c26.dobit[i]; cum.push(run); }

function buildTopTroskovi() {
  var el=document.getElementById('topTroskoviList'); if(!el) return;
  var items=[];
  ROWS.forEach(function(r){ var t=sumA(P[r.key]); if(t>0) items.push({lbl:r.lbl.toUpperCase(), val:t}); });
  items.sort(function(a,b){return b.val-a.val;});
  items=items.slice(0,10);
  var max=items.length?items[0].val:1;
  var pal=['#2b5088','#38bdf8','#22c55e','#84cc16','#f59e0b','#fb923c','#ef4444','#8b5cf6','#6366f1','#ec4899'];
  var h='';
  items.forEach(function(it, idx){
    h+='<div style="margin-bottom:10px"><div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:4px"><span style="color:var(--label2)">'+it.lbl+'</span><span style="font-weight:700">'+fmt2(it.val)+' EUR</span></div>';
    h+='<div style="height:6px;background:var(--sep2);border-radius:3px;overflow:hidden"><div style="height:100%;width:'+((it.val/max)*100).toFixed(0)+'%;background:'+pal[idx%pal.length]+'"></div></div></div>';
  });
  el.innerHTML = h || '<div style="font-size:12px;color:var(--label3)">Nema podataka.</div>';
}

    for (j=0; j<oK.length; j++) tOst[i]+=getRowVal(oK[j],i);
    tUR[i]=tPlace[i]+tFiks[i]+tOst[i];
    tD[i]=(getRowVal('prihodi_grupe',i)||0)-tUR[i];
  }

  // rowKey -> kategorija (transakcijski tab) za T-oznaku i klik-navigaciju
  var ROWKEY_TO_CAT={};
  for (var _k in TAB_TO_P) ROWKEY_TO_CAT[TAB_TO_P[_k]]=_k;

  function numPlain(val, color, catId) {

  var th='<th class="left">Stavka</th>';

  h+='</div>';

  // PRIHODI

  var totProw=sumA(P.prihodi_grupe);
  h+='<tr><td class="lbl">'+rowBar('#22c55e')+'PRIHODI GRUPE</td>';

  h+=numPlain(totProw, '#22c55e', null).replace('<td class="num"','<td class="num" style="font-weight:700"');

  h+=numPlain(totVend, '#0d9488', null);

  var tPriArr=mk12(); var totTPri=0;

  if (totTPri>0) {
    h+='<tr class="total-row"><td class="lbl-bold" style="color:#22c55e">Ukupno prihodi</td>';
    for(i=0;i<12;i++) h+=numPlain(tPriArr[i],'var(--label)','');
    h+='<td class="num" style="font-weight:700">'+fmt2(totTPri)+'</td></tr>';
  }

  // Sortiraj ROWS po sekcijama
  var secOrder={'place':0,'fiksni':1,'ostali':2};
  var sortedRows=ROWS.slice().sort(function(a,b){return (secOrder[a.sec]||0)-(secOrder[b.sec]||0);});
  var prev=null;
  var accentPalette=['#22c55e','#2b5088','#f59e0b','#8b5cf6','#0d9488','#ef4444','#c8a951'];

      } else if (prev==='fiksni') {
        h+='<tr class="total-row" data-subtotal="fiksni"><td class="lbl-bold">Ukupno fiksni</td>';

    var rowArr=P[rowKey]||mk12();

    var accent=accentPalette[accentIdx%accentPalette.length]; accentIdx++;
    var catId=ROWKEY_TO_CAT[rowKey];

    for (i=0; i<12; i++) h+=numPlain(rowArr[i], accent, catId);
    h+='<td class="num" style="font-weight:600">'+(rowTot?fmt2(rowTot):'—')+'</td></tr>';
  }

  if (prev==='ostali') {
    h+='<tr class="total-row" data-subtotal="ostali"><td class="lbl-bold">Ukupno ostali</td>';
    for (i=0; i<12; i++) h+=numPlain(tOst[i],'var(--label)','');
    h+='<td class="num" style="font-weight:700">'+fmt2(totOst)+'</td></tr>';
  } else if (prev==='fiksni') {
    h+='<tr class="total-row" data-subtotal="fiksni"><td class="lbl-bold">Ukupno fiksni</td>';
    for (i=0; i<12; i++) h+=numPlain(tFiks[i],'var(--label)','');
    h+='<td class="num" style="font-weight:700">'+fmt2(totFiks)+'</td></tr>';
  }

  h+='<tr class="total-row" data-subtotal="total"><td class="lbl-bold" style="color:var(--red)">Ukupni rashodi</td>';
  for (i=0; i<12; i++) h+=numPlain(tUR[i],'var(--red)','');
  h+='<td class="num" style="font-weight:700;color:var(--red)">'+fmt2(totUR)+'</td></tr>';
  h+='<tr class="dobit-row" data-subtotal="dobit"><td class="lbl-bold">DOBIT PRIJE OPOREZIVANJA</td>';
  for (i=0; i<12; i++) h+='<td class="num" style="color:'+(tD[i]>=0?'#4ade80':'#f87171')+';font-weight:700">'+(tD[i]?(tD[i]<0?'-':'')+fmt2(tD[i]):'—')+'</td>';
  h+='<td class="num" style="color:'+(totD>=0?'#4ade80':'#f87171')+';font-weight:700">'+(totD<0?'-':'')+fmt2(totD)+'</td></tr>';
  h+='</tbody></table></div>';

  var tab=document.getElementById('tab-rdg');
  tab.innerHTML=h;
}

    var r=rows[ri2];
    h+='<tr>';
    h+='<td style="padding:2px 3px"><input class="txt-input" type="text" data-f="datum" data-id="'+id+'" data-r="'+ri2+'" value="'+(r.datum||'')+'" placeholder="dd.mm." style="width:62px" /></td>';
    h+='<td style="padding:2px 3px"><input class="txt-input" type="text" data-f="tvrtka" data-id="'+id+'" data-r="'+ri2+'" value="'+(r.tvrtka||'')+'" placeholder="Opis..." />'+
      (pnViseRata(r)?'<div class="rate-info">'+pnUplate(r).length+' '+pnRateRijec(pnUplate(r).length)+' &middot; '+pnOpisRata(r)+'</div>':'')+'</td>';
    h+='<td style="padding:2px 3px"><div class="ieur"><input class="num-input" type="text" data-f="iznos" data-id="'+id+'" data-r="'+ri2+'" value="'+fmtInp(r.iznos)+'" placeholder="0,00" /><span class="eu">EUR</span></div></td>';

  h+='</tbody></table></div>';
  el.innerHTML=h;

  var iznosi=el.querySelectorAll('input[data-f="iznos"]');
  for (var ii=0; ii<iznosi.length; ii++) {
    (function(inp) {
      inp.addEventListener('focus', function() {
        var raw=parseHR(this.value); this.value=raw===0?'':String(raw).replace('.',','); this.select();
      });
      inp.addEventListener('blur', function() {
        var id2=this.dataset.id, ri=parseInt(this.dataset.r,10), mo=TS[id2];
        var raw=parseHR(this.value);
        TD[id2][mo][ri].iznos=raw; this.value=fmtInp(raw);

      if (isDate) {
        inp.setAttribute('inputmode','numeric');
        if (inp.dataset.f==='placeno') {
          inp.style.color = inp.value ? '#dc2626' : '';
        }
        inp.addEventListener('input', function() {
          var pos = this.selectionStart;
          var old = this.value;
          var digits = old.replace(/[^0-9]/g,'').slice(0,4);
          var result = '';
          if (digits.length<=2) {
            result = digits;
          } else {
            result = digits.slice(0,2) + '.' + digits.slice(2);
          }
          if (digits.length===4) result += '.';
          this.value = result;
          if (this.dataset.f==='placeno') {
            this.style.color = this.value ? '#dc2626' : '';
          }
        });
      }
      inp.addEventListener('blur', function() {
        var id2=this.dataset.id, ri=parseInt(this.dataset.r,10), mo=TS[id2];
        var red=TD[id2][mo][ri];
        red[this.dataset.f]=this.value;

        if (this.dataset.f==='placeno' && pnUplate(red).length===1) {

// ═══════════════════════════════════════════
function linearReg(data) {
  var pts=[];
  for (var i=0; i<data.length; i++) { if (data[i]>0) pts.push({x:i,y:data[i]}); }
  if (pts.length<2) return null;
  var n=pts.length, sx=0,sy=0,sxy=0,sx2=0;
  for (var i=0; i<pts.length; i++) { sx+=pts[i].x; sy+=pts[i].y; sxy+=pts[i].x*pts[i].y; sx2+=pts[i].x*pts[i].x; }
  var b=(n*sxy-sx*sy)/(n*sx2-sx*sx), a=(sy-b*sx)/n;
  return function(x) { return Math.max(0,a+b*x); };
}
function getForecast3() {
  var c26=calc26();
  var regP=linearReg(c26.prihodi), regR=linearReg(c26.rashodi);
  var activeCount=0;
  for (var i=0; i<c26.prihodi.length; i++) { if (c26.prihodi[i]>0) activeCount++; }
  var results=[];
  for (var i=0; i<3; i++) {
    var mIdx=activeCount+i;
    var fp=regP?regP(mIdx):0, fr=regR?regR(mIdx):0;
    results.push({label:MNAMES[mIdx%12]||('Mj.'+(mIdx+1)), prihod:fp, rashod:fr, dobit:fp-fr});
  }
  return results;
}

function buildAlertsList() {
  var c26=calc26();
  var activeIdx=[];
  for (var i=0; i<12; i++) { if (c26.prihodi[i]>0||c26.rashodi[i]>0) activeIdx.push(i); }
  var n=activeIdx.length;
  var alerts=[];
  if (n>=2) {
    var prev=activeIdx[n-2], curr=activeIdx[n-1];
    var delta=c26.rashodi[curr]-c26.rashodi[prev];
    var pct=c26.rashodi[prev]>0?delta/c26.rashodi[prev]*100:0;
    if (pct>10) alerts.push({type:'danger',icon:'!',title:'Tro\u0161kovi +'+pct.toFixed(1)+'% vs prosli mj.',body:'Tro\u0161kovi porasli s '+fmt2(c26.rashodi[prev])+' na '+fmt2(c26.rashodi[curr])+' EUR.',month:MNAMES[curr]});
    else if (pct<-10) alerts.push({type:'good',icon:'OK',title:'Tro\u0161kovi -'+Math.abs(pct).toFixed(1)+'% vs prosli mj.',body:'Tro\u0161kovi smanjeni s '+fmt2(c26.rashodi[prev])+' na '+fmt2(c26.rashodi[curr])+' EUR.',month:MNAMES[curr]});
  }
  for (var i=0; i<activeIdx.length; i++) {
    var idx=activeIdx[i];
    if (c26.dobit[idx]<-1000) alerts.push({type:'danger',icon:'!',title:'Negativna dobit \u2014 '+MNAMES[idx],body:'Gubitak od '+fmt2(Math.abs(c26.dobit[idx]))+' EUR. Prihodi: '+fmt2(c26.prihodi[idx])+' | Rashodi: '+fmt2(c26.rashodi[idx])+' EUR.',month:MNAMES[idx]});
  }
  var totalDobit=c26.dobit.reduce(function(a,b){return a+b;},0);
  var avgBurn=n?activeIdx.reduce(function(s,i){return s+c26.rashodi[i];},0)/n:0;
  if (avgBurn>0) {
    var runway=totalDobit/avgBurn;
    if (runway<3&&runway>0) alerts.push({type:'danger',icon:'!',title:'Cash Runway: '+runway.toFixed(1)+' mj.',body:'Burn rate: '+fmt2(avgBurn)+' EUR/mj. Runway je kriti\u010dno nizak!',month:'Trend'});
    else if (runway<6&&runway>0) alerts.push({type:'warn',icon:'!',title:'Cash Runway: '+runway.toFixed(1)+' mj.',body:'Preporu\u010deni runway min 6 mj. Trenutno: '+runway.toFixed(1)+' mj.',month:'Trend'});
  }
  if (n>=2) {
    var prev2=activeIdx[n-2], curr2=activeIdx[n-1];
    var delta2=c26.prihodi[curr2]-c26.prihodi[prev2];
    var pct2=c26.prihodi[prev2]>0?delta2/c26.prihodi[prev2]*100:0;
    if (pct2>15) alerts.push({type:'good',icon:'UP',title:'Prihod +'+pct2.toFixed(1)+'% vs prosli mj.!',body:'Prihod porastao s '+fmt2(c26.prihodi[prev2])+' na '+fmt2(c26.prihodi[curr2])+' EUR.',month:MNAMES[curr2]});
  }
  var pK=getKeys('place');
  for (var i=0; i<activeIdx.length; i++) {
    var idx2=activeIdx[i];
    var place=0;
    for (var j=0; j<pK.length; j++) place+=getRowVal(pK[j],idx2);
    var rash=c26.rashodi[idx2];
    if (rash>0&&(place/rash*100)>60) alerts.push({type:'warn',icon:'!',title:'Pla\u0107e > 60% rashoda \u2014 '+MNAMES[idx2],body:'Pla\u0107e \u010dine '+(place/rash*100).toFixed(1)+'% rashoda ('+fmt2(place)+' od '+fmt2(rash)+' EUR).',month:MNAMES[idx2]});
  }
  var fc=getForecast3();
  var negFc=[];
  for (var fi=0; fi<fc.length; fi++) { if (fc[fi].dobit<0) negFc.push(fc[fi].label); }
  if (negFc.length>0) alerts.push({type:'warn',icon:'!',title:'Forecast: negativna dobit ocekivana',body:'Linearna projekcija predvida gubitak u: '+negFc.join(', ')+'.',month:'Forecast'});

    return alerts;
}

var cols={danger:{bg:'rgba(239,68,68,.06)',border:'rgba(239,68,68,.2)'},warn:{bg:'rgba(245,158,11,.06)',border:'rgba(245,158,11,.22)'},good:{bg:'rgba(34,197,94,.06)',border:'rgba(34,197,94,.22)'}};
