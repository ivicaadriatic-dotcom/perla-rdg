function ocrPotvrdiUvoz() {
  var datum=document.getElementById('ocrDatum').value;
  if (!datum) { alert('Molimo odaberite datum prije uvoza.'); return; }
  var parts=datum.split('-'); var mo=parseInt(parts[1],10)-1, dd=parseInt(parts[2],10);
  var n=0;
  OCR_ROWS.forEach(function(r){
    if (!r.ukljuci) return;
    if (!DAILY_ARTIKLI[mo]) DAILY_ARTIKLI[mo]={};
    if (!DAILY_ARTIKLI[mo][dd]) DAILY_ARTIKLI[mo][dd]={};
    if (!DAILY_ARTIKLI[mo][dd][r.naziv]) DAILY_ARTIKLI[mo][dd][r.naziv]=[0,0];
    DAILY_ARTIKLI[mo][dd][r.naziv][0]+=r.kom;
    DAILY_ARTIKLI[mo][dd][r.naziv][1]=Math.round((DAILY_ARTIKLI[mo][dd][r.naziv][1]+r.iznos)*100)/100;
    n++;
  });
  saveDailyArtikliAndSync();
  closeModal();
  renderPrihodiEvidencija();
  alert('\u2713 Uvezeno '+n+' stavki za '+datum+'.');
}


// ── UVOZ EXCEL IZVOZA S VENDING PLATFORME (najpouzdanije - pravi brojevi, bez OCR-a) ──
function unosIzExcela() {
  if (!apZaUnos()) { apTraziOdabir(); return; }
  var inp=document.createElement('input');
  inp.type='file'; inp.accept='.xlsx,.xls,.csv';
  inp.style.cssText='position:fixed;left:-9999px;top:-9999px;opacity:0';
  inp.onchange=function(e){
    var file=e.target.files[0];
    document.body.removeChild(inp);
    if(!file) return;
    excelProcessFile(file);
  };
  document.body.appendChild(inp);
  inp.click();
}

function excelProcessFile(file) {
  var reader=new FileReader();
  reader.onload=function(e){
    try {
      var wb=XLSX.read(e.target.result, {type:'array'});
      var ws=wb.Sheets[wb.SheetNames[0]];
      var rows=XLSX.utils.sheet_to_json(ws, {header:1, raw:true, defval:''});
      excelParseVendingReport(rows);
    } catch(err) {
      alert('Gre\u0161ka pri \u010ditanju Excel datoteke: '+err.message);
    }
  };
  reader.readAsArrayBuffer(file);
}

function excelParseVendingReport(rows) {
  OCR_ROWS=[];
  window.OCR_RAW_TEXT = 'Excel uvoz - sirovi redovi:\n'+rows.map(function(r){return r.join(' | ');}).join('\n');

  // 1. Pronadji Start Time / End Time za automatsko popunjavanje datuma (samo ako je isti dan)
  var dateLike=/\d{4}[-\/]\d{2}[-\/]\d{2}|\d{2}[-\/]\d{2}[-\/]\d{4}/;
  var detectedDate=null;
  var startDate=null, endDate=null;
  for (var i=0;i<rows.length;i++) {
    var r=rows[i];
    for (var j=0;j<r.length;j++) {
      var cell=String(r[j]).trim();
      if (/start\s*time/i.test(cell)) {
        // Vrijednost moze biti pored (ista celija+1) ILI ispod (sljedeci redak, ista kolona) - prihvati samo ako izgleda kao datum
        var v1=r[j+1]!==undefined?String(r[j+1]).trim():'';
        var v2=(rows[i+1] && rows[i+1][j]!==undefined)?String(rows[i+1][j]).trim():'';
        if (dateLike.test(v1)) startDate=v1;
        else if (dateLike.test(v2)) startDate=v2;
      }
      if (/end\s*time/i.test(cell)) {
        var w1=r[j+1]!==undefined?String(r[j+1]).trim():'';
        var w2=(rows[i+1] && rows[i+1][j]!==undefined)?String(rows[i+1][j]).trim():'';
        if (dateLike.test(w1)) endDate=w1;
        else if (dateLike.test(w2)) endDate=w2;
      }
    }
  }
  function normDate(s) {
    var m=s.match(/(20\d{2})[-\/](\d{2})[-\/](\d{2})/);
    return m ? (m[1]+'-'+m[2]+'-'+m[3]) : null;
  }
  var sd=startDate?normDate(startDate):null, ed=endDate?normDate(endDate):null;
  // Datum je jasno naveden na sheetu (Start Time) - uvijek ga predloziti, ispravka je i dalje moguca
  detectedDate = sd || ed || null;
  OCR_DETECTED_DATE = null;
  window.EXCEL_SUGGESTED_DATE = detectedDate;
  window.EXCEL_RANGE_WARNING = (sd && ed && sd!==ed) ? (sd+' \u2192 '+ed) : null;

  // 2. Pronadji redak zaglavlja tablice (sadrzi "Goods Name")
  var headerIdx=-1, colGoods=-1, colKom=-1, colIznos=-1;
  for (var i2=0;i2<rows.length;i2++) {
    var r2=rows[i2];
    for (var j2=0;j2<r2.length;j2++) {
      var cellL=String(r2[j2]).toLowerCase().replace(/\s+/g,' ').trim();
      if (/goods\s*name/.test(cellL)) { headerIdx=i2; colGoods=j2; }
      if (/completed/.test(cellL)) colKom=j2;
      if (/transaction\s*amount/.test(cellL)) colIznos=j2;
    }
    if (colGoods>=0 && colKom>=0 && colIznos>=0) { headerIdx=i2; break; }
  }
  if (headerIdx<0 || colGoods<0 || colKom<0 || colIznos<0) {
    alert('Nije prona\u0111ena o\u010dekivana struktura tablice (Goods Name / Number Of Completed Orders / Transaction Amount). Provjerite format datoteke.');
    return;
  }

  // 3. Ucitaj sve podatkovne retke ispod zaglavlja
  for (var i3=headerIdx+1; i3<rows.length; i3++) {
    var dr=rows[i3];
    var naziv=String(dr[colGoods]||'').trim();
    if (!naziv) continue;
    // Uskladi naziv case-insensitive s postojecim popisom artikala (Excel platforma ponekad koristi drugaciji zapis velikih/malih slova)
    var canon = CRM_ARTIKLI.filter(function(a){ return a.name.toLowerCase()===naziv.toLowerCase(); })[0];
    if (canon) naziv = canon.name;
    var kom=parseInt(dr[colKom],10);
    var iznosRaw=dr[colIznos];
    var iznos = typeof iznosRaw==='number' ? iznosRaw : parseFloat(String(iznosRaw).replace(',','.'));
    if (isNaN(kom)||isNaN(iznos)||kom<=0) continue;
    OCR_ROWS.push({naziv:naziv, kom:kom, iznos:Math.round(iznos*100)/100, ukljuci:true});
  }

  if (!OCR_ROWS.length) {
    alert('Nije prona\u0111en nijedan redak s podacima u datoteci.');
    return;
  }
  ocrRenderPreview();
}

// ── UVOZ ULAZNIH RAČUNA (pojedinačni PDF racun: OIB, broj racuna, datum, rok, iznos) ──
var UL_RACUNI = [];

function unosUlazniRacunPdf(inputEl) {
  var files = inputEl.files; if (!files || !files.length) return;
  var status = document.getElementById('ulRacStatus');
  if (status) status.textContent = 'U\u010ditavanje '+files.length+' datoteka(a)\u2026';
  var promises = [];
  for (var i=0;i<files.length;i++) {
    promises.push(citajPdfTekst(files[i]));
  }
  Promise.all(promises).then(function(tekstovi){
    tekstovi.forEach(function(txt){ if (txt) parseUlazniRacunPdf(txt); });
    if (status) status.textContent = '\u2713 U\u010ditano '+tekstovi.length+' ra\u010duna';
    renderUlRacPreview();
  }).catch(function(err){
    if (status) status.textContent = '\u26a0 Gre\u0161ka: '+err.message;
  });
}

function citajPdfTekst(file) {
  return new Promise(function(resolve, reject){
    var reader = new FileReader();
    reader.onload = function(e){
      var typedarray = new Uint8Array(e.target.result);
      pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
      pdfjsLib.getDocument(typedarray).promise.then(function(pdf){
        var pagePromises = [];
        for (var p=1;p<=pdf.numPages;p++) {
          pagePromises.push(pdf.getPage(p).then(function(page){
            return page.getTextContent().then(function(tc){
              return pdfItemsToLines(tc.items);
            });
          }));
        }
        Promise.all(pagePromises).then(function(pages){ resolve(pages.join('\n')); });
      }).catch(reject);
    };
    reader.onerror = reject;
    reader.readAsArrayBuffer(file);
  });
}

function parseUlazniRacunPdf(text) {
  // OIB: tocno 11 znamenki (hrvatski format), trazi i uz oznaku "OIB" i samostalno
  var oibM = text.match(/OIB[:\s]*?(\d{11})/i) || text.match(/\b(\d{11})\b/);
  var oib = oibM ? oibM[1] : '';

  // Broj racuna: uzorci poput "RN.BR:123-1-1", "Ra\u010dun br. 15-U-1/2026", "R1-2026-01"
  var brojM = text.match(/(?:RN\.?\s*BR\.?|Ra\u010dun\s*br\.?|Broj\s*ra\u010duna)[:\s]*([A-Za-z0-9\-\/\.]+)/i);
  var broj = brojM ? brojM[1].trim() : '';
  if (!broj) {
    // Oblici bez oznake \u201ebr.\u201c, npr. \u201eRa\u010dun - Veleprodaja HR 2627-01-262\u201c
    var brojM2 = text.match(/RA\u010cUN[^\n]{0,48}?\b(\d{2,7}[-\/]\d{1,4}[-\/]\d{1,7})\b/i)
              || text.match(/\b(\d{3,7}[-\/]\d{1,4}[-\/]\d{1,7})\b/);
    if (brojM2) broj = brojM2[1].trim();
  }
  // Ponuda (nije ra\u010dun): zapamti broj ponude i ozna\u010di stavku
  var ponudaM = text.match(/PONUDA\s*(?:BR\.?|BROJ)?\s*[*:#\-\u2013]?\s*([0-9][A-Za-z0-9\-\/]*)/i);
  var jePonuda = /\bPONUDA\b/i.test(text) && !/\bRA\u010cUN\s*(BR|BROJ)/i.test(text);
  var brojPonude = ponudaM ? ponudaM[1].replace(/\.$/,'').trim() : '';

  // Dobavljac: prvi redak teksta (obicno naziv tvrtke na vrhu racuna), ocisceno
  var firstLine = text.split(/\n/)[0] || text.slice(0,60);
  var dobavljac = firstLine.replace(/\s+/g,' ').trim().slice(0,50);

  // Svi datumi u formatu dd.mm.yyyy - prvi = datum racuna, drugi (ako postoji) = rok placanja
  var dateMatches = text.match(/\d{2}\.\d{2}\.\d{4}\.?/g) || [];
  var datum = dateMatches[0] ? dateMatches[0].replace(/\.$/,'') : '';
  var rok = dateMatches[1] ? dateMatches[1].replace(/\.$/,'') : datum;

  // Iznos: najveci decimalni broj u tekstu (obicno je to ukupan iznos s PDV-om, na dnu racuna)
  var amtMatches = text.match(/\d{1,3}(?:[.,]\d{3})*[.,]\d{2}/g) || [];
  var iznos = 0;
  amtMatches.forEach(function(a){
    var norm = a.replace(/\./g,'').replace(',','.');
    // ako format vec koristi tocku kao decimalni separator (npr. "1234.56") provjeri duljinu razlomka
    if (/^\d+\.\d{2}$/.test(a) && a.indexOf(',')<0) norm = a;
    var v = parseFloat(norm);
    if (!isNaN(v) && v > iznos && v < 1000000) iznos = v;
  });

  if (!datum && !iznos) return; // nije prepoznat kao racun

  var naucenaKat = pravioZaPartnera(dobavljac);
  var ponCilj = jePonuda ? null : pnPonudaZaRacun(dobavljac, iznos);
  UL_RACUNI.push({
    dobavljac: dobavljac || '(nepoznat dobavlja\u010d)',
    oib: oib, broj: broj || '\u2014',
    ponuda: jePonuda, brojPonude: brojPonude,
    datum: datum, rok: jePonuda ? '' : rok, iznos: iznos,
    kat: naucenaKat || 'razno',
    naucenaKat: !!naucenaKat,
    ponudaCilj: ponCilj ? {kat:ponCilj.kat, mo:ponCilj.mo, ri:ponCilj.ri} : null,
    dopuniPonudu: !!ponCilj,
    ukljuci: true
  });
}

  var catOptions = ALL_TABS.filter(function(t){return ['dash','rdg','ceo','alerts','postavke','radni_sati','prihodi26','dnevni'].indexOf(t.id)===-1;});
  var ukupno=0; UL_RACUNI.forEach(function(r){ if(r.ukljuci) ukupno+=r.iznos; });

  for (var i=0;i<UL_RACUNI.length;i++) {
    var r=UL_RACUNI[i];
    h+='<tr><td class="lbl">'+r.dobavljac+' <span style="color:var(--label3);font-size:10.5px">'+r.broj+'</span></td>';

    if (r.ponudaCilj) {
      var pc=r.ponudaCilj, pr=(TD[pc.kat]&&TD[pc.kat][pc.mo]&&TD[pc.kat][pc.mo][pc.ri]);
      h+='<label style="display:flex;gap:6px;align-items:flex-start;cursor:pointer">'+
         '<input type="checkbox" class="ulRacDop" data-i="'+i+'"'+(r.dopuniPonudu?' checked':'')+' style="margin-top:2px">'+
         '<span><b style="color:var(--nav-600)">Dopuni ranije unesenu ponudu</b><br>'+
         '<span style="color:var(--label3);font-size:10.5px">'+String((pr&&pr.tvrtka)||'').slice(0,54)+'</span></span></label>';
    }
    if (!r.dopuniPonudu) {
      h+='<select data-i="'+i+'" class="ulRacKat" style="border:none;background:transparent;color:var(--nav-600);font-weight:600;font-size:11px">';
      for (var j=0;j<catOptions.length;j++) h+='<option value="'+catOptions[j].id+'"'+(catOptions[j].id===r.kat?' selected':'')+'>'+catOptions[j].lbl+'</option>';
      h+='</select>';
    }
    h+='</td>';
    h+='<td><button class="del-btn" onclick="UL_RACUNI.splice('+i+',1);renderUlRacPreview();">Obri\u0161i</button></td></tr>';
  }
  h+='</tbody></table></div>';
  h+='<div style="display:flex;justify-content:flex-end;gap:8px;margin-top:14px">';
  h+='<button class="hbtn" onclick="UL_RACUNI=[];renderUlRacPreview();">Odustani</button>';
  h+='<button class="hbtn" style="background:var(--green);color:#fff" onclick="potvrdiUlazneRacune()">&#10003; Uvezi ra\u010dune</button>';
  h+='</div></div>';
  wrap.innerHTML=h;
  wrap.querySelectorAll('.ulRacKat').forEach(function(sel){
    sel.addEventListener('change', function(){
      var idx=parseInt(this.dataset.i,10);
      UL_RACUNI[idx].kat=this.value;
      zapamtiPravilo(UL_RACUNI[idx].dobavljac, this.value);
    });
  });
  wrap.querySelectorAll('.ulRacDop').forEach(function(ch){
    ch.addEventListener('change', function(){
      UL_RACUNI[parseInt(this.dataset.i,10)].dopuniPonudu=this.checked;
      renderUlRacPreview();
    });
  });
}

function potvrdiUlazneRacune() {
  var n=0, nDop=0;
  UL_RACUNI.forEach(function(r){
    if (!r.ukljuci || !r.datum) return;
    var parts=r.datum.split('.'); var mo=parseInt(parts[1],10)-1;
    if (isNaN(mo)||mo<0||mo>11) return;
    // Ra\u010dun koji je stigao na ranije unesenu ponudu \u2014 dopunjuje je, ne stvara novi tro\u0161ak
    if (r.dopuniPonudu && r.ponudaCilj) {
      var c=r.ponudaCilj, t=(TD[c.kat]&&TD[c.kat][c.mo]&&TD[c.kat][c.mo][c.ri]);
      if (t) {
        var brR=(r.broj && r.broj!=='\u2014') ? r.broj : '';
        t.tvrtka=String(t.tvrtka||'').replace(/(RN\.?\s*BR:)\s*$/i, '$1'+brR);
        if (r.rok) t.vpl=(function(){ var p=String(r.rok).split('.'); return p.length>=2 ? (p[0]+'.'+p[1]+'.') : t.vpl; })();
        if (r.iznos) t.iznos=r.iznos;
        syncTDtoP(c.kat); nDop++;
        return;
      }
    }
    if (!TD[r.kat]) { TD[r.kat]=[]; for(var m2=0;m2<12;m2++) TD[r.kat].push([]); }
    if (!TD[r.kat][mo]) TD[r.kat][mo]=[];
    var opis = r.ponuda
      ? (String(r.dobavljac||'').toUpperCase().replace(/\s+D\.?\s?O\.?\s?O\.?/i,' d.o.o.').trim()+' PONUDA BR:'+(r.brojPonude||'')+'-RN.BR:')
      : (r.dobavljac+(r.broj&&r.broj!=='\u2014'?' '+r.broj:''));
    TD[r.kat][mo].push({datum:parts[0]+'.'+parts[1]+'.', iznos:r.iznos, tvrtka:opis, vpl:r.ponuda?'':(r.rok||''), placeno:''});
    syncTDtoP(r.kat);
    n++;
  });
  saveAll();
  UL_RACUNI=[];
  var pw=document.getElementById('ulRacPreviewWrap'); if(pw) pw.innerHTML='';
  var status=document.getElementById('ulRacStatus'); if(status) status.textContent='';
  var por='Uvezeno '+n+' ra\u010dun(a)';
  if (nDop) por+=', a '+nDop+' ra\u010dun(a) dopunilo je ranije unesenu ponudu (bez novog tro\u0161ka)';
  pnAlert('\u2713 '+por+'.', {title:'Ulazni ra\u010duni'});
  renderUlazni();
}


// ── UVOZ IZLAZNIH RAČUNA (generički: obavezni Datum+Iznos, ostalo opcionalno) ──
var IZ_RACUNI = [];
var IZ_HEADER_MAP = {
  datum: ['datum ra\u010duna','datum izdavanja','datum izdanja','datum dokumenta','datum'],
  iznos: ['iznos s pdv','ukupno s pdv','za platiti','sveukupno','iznos (eur)','iznos'],
  broj: ['broj ra\u010duna','br. ra\u010duna','br.ra\u010duna','broj dokumenta','broj'],
  kupac: ['kupac','partner','naziv kupca','naziv partnera'],
  valuta: ['datum dospije\u0107a','dospije\u0107e','rok pla\u0107anja','valuta pla\u0107anja'],
  placeno: ['datum pla\u0107anja','pla\u0107eno','napla\u0107eno','datum naplate']
};

function parseIzlazniOdabirDatoteke(inputEl) {
  var file = inputEl.files[0]; if (!file) return;
  var status = document.getElementById('izRacStatus');
  var ext = file.name.split('.').pop().toLowerCase();
  if (ext==='pdf') {
    citajPdfTekst(file).then(function(txt){
      parseIzlazniTablicu(txt);
      if (status) status.textContent='\u2713 U\u010ditano iz PDF-a';
    }).catch(function(err){ if(status) status.textContent='\u26a0 Gre\u0161ka: '+err.message; });
  } else {
    var reader = new FileReader();
    reader.onload = function(e){
      try {
        var wb = XLSX.read(e.target.result, {type:'array'});
        var ws = wb.Sheets[wb.SheetNames[0]];
        var rows = XLSX.utils.sheet_to_json(ws, {header:1, raw:true, defval:''});
        parseIzlazniRedovi(rows);
        if (status) status.textContent='\u2713 U\u010ditano iz '+ext.toUpperCase()+'-a';
      } catch(err) { if(status) status.textContent='\u26a0 Gre\u0161ka: '+err.message; }
    };
    reader.readAsArrayBuffer(file);
  }
}

function nadjiStupac(headerRow, kljucevi) {
  for (var i=0;i<headerRow.length;i++) {
    var h=String(headerRow[i]).toLowerCase().replace(/\s+/g,' ').trim();
    for (var k=0;k<kljucevi.length;k++) { if (h.indexOf(kljucevi[k])>=0) return i; }
  }
  return -1;
}

function parseIzlazniRedovi(rows) {
  if (!rows.length) return;
  var headerRow = rows[0];
  var colDatum = nadjiStupac(headerRow, IZ_HEADER_MAP.datum);
  var colIznos = nadjiStupac(headerRow, IZ_HEADER_MAP.iznos);
  var colBroj = nadjiStupac(headerRow, IZ_HEADER_MAP.broj);
  var colKupac = nadjiStupac(headerRow, IZ_HEADER_MAP.kupac);
  var colValuta = nadjiStupac(headerRow, IZ_HEADER_MAP.valuta);
  var colPlaceno = nadjiStupac(headerRow, IZ_HEADER_MAP.placeno);

  if (colDatum<0 || colIznos<0) { alert('Nisu prepoznata oba obavezna stupca (Datum ra\u010duna i Iznos). Provjerite zaglavlje tablice.'); return; }

  for (var i=1;i<rows.length;i++) {
    var r=rows[i];
    var datRaw=String(r[colDatum]||'').trim(); if (!datRaw) continue;
    var datum = normalizirajDatumHR(datRaw);
    if (!datum) continue;
    var iznosRaw = r[colIznos];
    var iznos = typeof iznosRaw==='number' ? iznosRaw : parseFloat(String(iznosRaw).replace(/\./g,'').replace(',','.'));
    if (isNaN(iznos) || iznos===0) continue;
    var kupac = colKupac>=0 ? String(r[colKupac]||'').trim() : '';
    var broj = colBroj>=0 ? String(r[colBroj]||'').trim() : '';
    var valuta = colValuta>=0 ? normalizirajDatumHR(String(r[colValuta]||'')) : '';
    var placeno = colPlaceno>=0 ? normalizirajDatumHR(String(r[colPlaceno]||'')) : '';
    var dupliciran = pdvIzvodProvjeriDuplikat(datum, Math.abs(iznos), kupac);
    IZ_RACUNI.push({datum:datum, iznos:Math.abs(iznos), broj:broj, kupac:kupac||'(bez partnera)', valuta:valuta, placeno:placeno, ukljuci:!dupliciran, dupliciran:dupliciran});
  }
  renderIzRacPreview();
}

function normalizirajDatumHR(s) {
  s=(s||'').trim(); if (!s) return '';
  var m = s.match(/(\d{1,2})[.\/](\d{1,2})[.\/](\d{4})/);
  if (m) return m[1].padStart(2,'0')+'.'+m[2].padStart(2,'0');
  var m2 = s.match(/(\d{4})-(\d{2})-(\d{2})/);
  if (m2) return m2[3]+'.'+m2[2];
  return '';
}

function parseIzlazniTablicu(text) {
  var lines = text.split(/\n/).map(function(l){return l.trim();}).filter(function(l){return l.length>1;});
  if (!lines.length) return;
  // Provjeri izgleda li prvi redak kao zaglavlje (sadrzi barem jednu prepoznatu rijec)
  var allKeys = [].concat(IZ_HEADER_MAP.datum, IZ_HEADER_MAP.iznos, IZ_HEADER_MAP.broj, IZ_HEADER_MAP.kupac);
  var firstLower = lines[0].toLowerCase();
  var izgledaKaoZaglavlje = allKeys.some(function(k){ return firstLower.indexOf(k)>=0; });

  if (izgledaKaoZaglavlje) {
    var rows = lines.map(function(l){ return l.split(/\t|;|,(?=(?:[^"]*"[^"]*")*[^"]*$)/).map(function(x){return x.trim();}); });
    parseIzlazniRedovi(rows);
    return;
  }

  // Generički fallback: dd.mm.yyyy ... iznos po retku (kao kod Uvoza izvoda)
  var dateRe = /(\d{2}\.\d{2}\.\d{4})/;
  var amtRe = /(-?\d{1,3}(?:\.\d{3})*,\d{2})(?!.*\d{1,3}(?:\.\d{3})*,\d{2})/;
  for (var i=0;i<lines.length;i++) {
    var ln=lines[i];
    var dM=ln.match(dateRe); if(!dM) continue;
    var aM=ln.match(amtRe); if(!aM) continue;
    var amt=parseFloat(aM[1].replace(/\./g,'').replace(',','.'));
    if (isNaN(amt)||amt===0) continue;
    var kupac=ln.replace(dM[0],'').replace(aM[1],'').replace(/\s+/g,' ').trim();
    var datumKratki = dM[1].split('.').slice(0,2).join('.')+'.';
    var dupliciran = pdvIzvodProvjeriDuplikat(datumKratki, Math.abs(amt), kupac);
    IZ_RACUNI.push({datum:datumKratki, iznos:Math.abs(amt), broj:'', kupac:kupac||'(bez partnera)', valuta:'', placeno:'', ukljuci:!dupliciran, dupliciran:dupliciran});
  }
  renderIzRacPreview();
}

function renderIzRacPreview() {
  var wrap=document.getElementById('izRacPreviewWrap'); if(!wrap) return;
  if (!IZ_RACUNI.length) { wrap.innerHTML=''; return; }
  var nDup = IZ_RACUNI.filter(function(r){return r.dupliciran;}).length;
  var ukupno=0; IZ_RACUNI.forEach(function(r){ if(r.ukljuci) ukupno+=r.iznos; });

  var h='<div class="card" style="padding:22px;margin-top:14px">';
  h+='<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px">';
  h+='<div><div style="font-size:13.5px;font-weight:650">Prepoznati ra\u010duni ('+IZ_RACUNI.length+')</div><div style="font-size:11px;color:var(--label3);margin-top:2px">Ukupno za uvoz: '+fmt2(ukupno)+' EUR'+(nDup>0?' \u00b7 <span style="color:var(--red)">'+nDup+' mogu\u0107ih duplikata</span>':'')+'</div></div>';
  h+='<button class="hbtn" style="background:var(--red-bg);color:var(--red);font-size:11px" onclick="IZ_RACUNI=[];renderIzRacPreview();">Ukloni sve</button>';
  h+='</div>';
  h+='<div class="tbl-wrap"><table><thead><tr><th class="left">Datum</th><th class="left">Broj</th><th class="left">Kupac / partner</th><th class="left">Valuta pla\u0107anja</th><th>Iznos</th><th class="left">Status</th><th></th></tr></thead><tbody>';
  for (var i=0;i<IZ_RACUNI.length;i++) {
    var r=IZ_RACUNI[i];
    h+='<tr style="'+(r.dupliciran?'opacity:.5':'')+'">';
    h+='<td class="lbl">'+r.datum+'</td><td class="lbl">'+(r.broj||'\u2014')+'</td><td class="lbl">'+r.kupac+'</td><td class="lbl">'+(r.valuta||'\u2014')+'</td>';
    h+='<td class="num" style="color:var(--green);font-weight:600">'+fmt2(r.iznos)+' EUR</td>';
    h+='<td>'+(r.dupliciran?'<span style="color:var(--red);font-size:10px;font-weight:700">MOGU\u0106I DUPLIKAT</span>':r.placeno?'<span style="color:var(--green);font-size:10px;font-weight:700">NAPLA\u0106ENO</span>':'<span style="color:var(--nav-500);font-size:10px;font-weight:700">NOVO</span>')+'</td>';
    h+='<td><button class="del-btn" onclick="IZ_RACUNI.splice('+i+',1);renderIzRacPreview();">Obri\u0161i</button></td>';
    h+='</tr>';
  }
  h+='</tbody></table></div>';
  h+='<div style="display:flex;justify-content:flex-end;gap:8px;margin-top:14px">';
  h+='<button class="hbtn" onclick="IZ_RACUNI=[];renderIzRacPreview();">Odustani</button>';
  h+='<button class="hbtn" style="background:var(--green);color:#fff" onclick="potvrdiIzlazneRacune()">&#10003; Uvezi ra\u010dune</button>';
  h+='</div></div>';
  wrap.innerHTML=h;
}

function potvrdiIzlazneRacune() {
  var ciljKat = document.getElementById('izKnjiziU') ? document.getElementById('izKnjiziU').value : 'prihodi26';
  var n=0;
  IZ_RACUNI.forEach(function(r){
    if (!r.ukljuci) return;
    var parts=r.datum.split('.'); var mo=parseInt(parts[1],10)-1;
    if (isNaN(mo)||mo<0||mo>11) return;
    if (!TD[ciljKat]) { TD[ciljKat]=[]; for(var m2=0;m2<12;m2++) TD[ciljKat].push([]); }
    if (!TD[ciljKat][mo]) TD[ciljKat][mo]=[];
    TD[ciljKat][mo].push({datum:parts[0]+'.'+parts[1]+'.', iznos:r.iznos, tvrtka:r.kupac+(r.broj?' '+r.broj:''), vpl:r.valuta||'', placeno:r.placeno||''});
    syncTDtoP(ciljKat);

// ── KOMPLETAN JSON BACKUP (izvoz/uvoz svih podataka aplikacije) ──
var PN_BACKUP_KEYS = ['pn_p_full','pn_td','pn_rows','pn_custom_map','pn_settings','pn_logo',
  'pn_daily_artikli','pn_daily_artikli_ap','pn_aparati','pn_aparat_akt',
  'pn_djel_sati','pn_zaposlenici','pn_zaposlenici_info','pn_rules','pn_izvod_potpisi','pn_cf_bal_'];


// ═══════════════════════════════════════════
// SINKRONIZACIJA U OBLAKU (Supabase)
// Aplikacija uvijek radi lokalno; oblak je samo kopija koja spaja uređaje.
// Tablica rdg_stanje je odvojena od HACCP-a i robno-materijalnog u istom Supabase projektu.
// Komunikacija ide izravno preko REST sučelja — bez vanjskih knjižnica.
// ═══════════════════════════════════════════
var SB = (function(){
  var d={url:'', kljuc:'', email:'', token:'', refresh:'', istek:0, korisnik:'', auto:true};
  try { var s=localStorage.getItem('pn_sb'); if(s) { var o=JSON.parse(s); for(var k in o) d[k]=o[k]; } } catch(e){}
  return d;
})();
var SB_KLJUCEVI = (typeof PN_BACKUP_KEYS!=='undefined' ? PN_BACKUP_KEYS : []).concat(['pn_daily','pn_cf_rucno','pn_p','pn_izvod_migracija_1','pn_rate_ocisti_1']);
var SB_LOK = (function(){ try { return JSON.parse(localStorage.getItem('pn_sync_lok')||'{}'); } catch(e){ return {}; } })();
var SB_POSAO = null, SB_ZADNJI = '';

function sbSpremiPostavke(){ try { localStorage.setItem('pn_sb', JSON.stringify(SB)); } catch(e){} }
function sbUkljucen(){ return !!(SB.url && SB.kljuc && SB.token); }
function pnSyncKljuc(k){
  if (!k || k.indexOf('pn_')!==0) return false;
  if (k==='pn_sync_lok' || k==='pn_sb') return false;
  for (var i=0;i<SB_KLJUCEVI.length;i++) {
    var sk=SB_KLJUCEVI[i];
    if (k===sk) return true;
    if (sk.charAt(sk.length-1)==='_' && k.indexOf(sk)===0) return true;   // npr. pn_cf_bal_
  }
  return false;
}
function pnSyncOznaci(k){
  SB_LOK[k]=new Date().toISOString();
  try { localStorage.setItem('pn_sync_lok', JSON.stringify(SB_LOK)); } catch(e){}
  if (SB.auto && sbUkljucen()) sbZakaziSlanje();
}
// Svaka izmjena u localStorage automatski se biljezi za sinkronizaciju
(function(){
  try {
    var orig = localStorage.setItem.bind(localStorage);
    localStorage.setItem = function(k, v){
      orig(k, v);
      try { if (pnSyncKljuc(k)) pnSyncOznaci(k); } catch(e){}
    };
  } catch(e){}
})();

function sbStatus(txt, vrsta){
  SB_ZADNJI = txt||'';
  var el=document.getElementById('sbStatus');
  if (el) { el.textContent=txt||''; el.style.color = vrsta==='err' ? 'var(--red)' : (vrsta==='ok' ? 'var(--green)' : 'var(--label3)'); }
  var el2=document.getElementById('sbStatusMini');
  if (el2) el2.textContent = txt||'';
}
function sbZaglavlja(sJson){
  var h={'apikey':SB.kljuc, 'Authorization':'Bearer '+SB.token};
  if (sJson) h['Content-Type']='application/json';
  return h;
}
function sbOsvjeziToken(){
  if (!SB.refresh) return Promise.reject(new Error('nema prijave'));
  return fetch(SB.url+'/auth/v1/token?grant_type=refresh_token', {
    method:'POST', headers:{'apikey':SB.kljuc,'Content-Type':'application/json'},
    body:JSON.stringify({refresh_token:SB.refresh})
  }).then(function(r){ return r.json().then(function(j){
    if (!r.ok || !j.access_token) throw new Error(j.error_description||j.msg||'prijava istekla');
    SB.token=j.access_token; SB.refresh=j.refresh_token||SB.refresh;
    SB.istek=Date.now()+((j.expires_in||3600)*1000)-60000;
    sbSpremiPostavke(); return true;
  }); });
}
function sbSpreman(){
  if (!SB.url || !SB.kljuc || !SB.token) return Promise.reject(new Error('sinkronizacija nije postavljena'));
  if (SB.istek && Date.now()>SB.istek) return sbOsvjeziToken();
  return Promise.resolve(true);
}
function sbPrijava(email, lozinka){
  if (!SB.url || !SB.kljuc) { pnAlert('Prvo upišite adresu projekta i javni ključ.', {kind:'warn'}); return; }
  sbStatus('Prijava…');
  fetch(SB.url+'/auth/v1/token?grant_type=password', {
    method:'POST', headers:{'apikey':SB.kljuc,'Content-Type':'application/json'},
    body:JSON.stringify({email:email, password:lozinka})
  }).then(function(r){ return r.json().then(function(j){
    if (!r.ok || !j.access_token) throw new Error(j.error_description||j.msg||j.message||'neuspješna prijava');
    SB.token=j.access_token; SB.refresh=j.refresh_token||'';
    SB.istek=Date.now()+((j.expires_in||3600)*1000)-60000;
    SB.email=email; SB.korisnik=(j.user&&j.user.id)||'';
    sbSpremiPostavke();
    sbStatus('Prijavljen — povlačim podatke…','ok');
    // Prva prijava: prvo povuci što je u oblaku, pa pošalji sve što je na ovom uređaju
    return sbPovuci(true).then(function(){ sbOznaciSve(); return sbPosalji(false); });
  }); }).then(function(){
    if (typeof renderPostavke==='function') renderPostavke();
  }).catch(function(e){
    sbStatus('Greška: '+e.message,'err');
    pnAlert('Prijava nije uspjela.\n\n'+e.message, {kind:'warn', title:'Sinkronizacija'});
  });
}
function sbOdjava(){
  SB.token=''; SB.refresh=''; SB.istek=0; SB.korisnik='';
  sbSpremiPostavke(); sbStatus('Odjavljen.');
  if (typeof renderPostavke==='function') renderPostavke();
}
// Sve što na ovom uređaju postoji, a još nije zabilježeno za slanje — zabilježi sada.
// Bez ovoga bi se slali samo ključevi promijenjeni nakon prijave.
function sbOznaciSve(){
  var n=0;
  try {
    for (var i=0;i<localStorage.length;i++) {
      var k=localStorage.key(i);
      if (!pnSyncKljuc(k) || SB_LOK[k]) continue;
      SB_LOK[k]=new Date().toISOString(); n++;
    }
    if (n) localStorage.setItem('pn_sync_lok', JSON.stringify(SB_LOK));
  } catch(e){}
  return n;
}
function sbZakaziSlanje(){
  if (SB_POSAO) clearTimeout(SB_POSAO);
  SB_POSAO=setTimeout(function(){ SB_POSAO=null; sbPosalji(); }, 2500);
}
function sbPosalji(tiho){
  return sbSpreman().then(function(){
    var redovi=[];
    for (var k in SB_LOK) {
      if (!pnSyncKljuc(k)) continue;
      var v=null; try { v=localStorage.getItem(k); } catch(e){}
      redovi.push({kljuc:k, vrijednost:(v===null?'':v), azurirano:SB_LOK[k]});
    }
    if (!redovi.length) { if(!tiho) sbStatus('Nema promjena za slanje.'); return; }
    if (!tiho) sbStatus('Šaljem '+redovi.length+' zapisa…');
    return fetch(SB.url+'/rest/v1/rdg_stanje?on_conflict=korisnik,kljuc', {
      method:'POST',
      headers:(function(){ var h=sbZaglavlja(true); h['Prefer']='resolution=merge-duplicates,return=minimal'; return h; })(),
      body:JSON.stringify(redovi)
    }).then(function(r){
      if (!r.ok) return r.text().then(function(t){ throw new Error(t.slice(0,180)); });
      sbStatus('Spremljeno u oblak · '+new Date().toLocaleTimeString('hr-HR'),'ok');
    });
  }).catch(function(e){ sbStatus('Slanje nije uspjelo: '+e.message,'err'); });
}
function sbPovuci(tiho){
  return sbSpreman().then(function(){
    if (!tiho) sbStatus('Povlačim iz oblaka…');
    return fetch(SB.url+'/rest/v1/rdg_stanje?select=kljuc,vrijednost,azurirano', {headers:sbZaglavlja()});
  }).then(function(r){
    if (!r.ok) return r.text().then(function(t){ throw new Error(t.slice(0,180)); });
    return r.json();
  }).then(function(redovi){
    if (!redovi) return;
    var promjena=0;
    redovi.forEach(function(x){
      if (!pnSyncKljuc(x.kljuc)) return;
      var lok=SB_LOK[x.kljuc]||'';
      // Noviji zapis pobjeđuje; kod jednakog vremena ostaje lokalni
      if (lok && new Date(lok)>=new Date(x.azurirano)) return;
      try {
        if (x.vrijednost==null || x.vrijednost==='') localStorage.removeItem(x.kljuc);
        else localStorage.setItem(x.kljuc, x.vrijednost);
        SB_LOK[x.kljuc]=x.azurirano; promjena++;
      } catch(e){}
    });
    try { localStorage.setItem('pn_sync_lok', JSON.stringify(SB_LOK)); } catch(e){}
    if (promjena) {
      sbStatus(promjena+' zapisa povučeno — osvježavam prikaz…','ok');
      setTimeout(function(){ location.reload(); }, 800);
    } else if (!tiho) {
      sbStatus('Sve je već usklađeno · '+new Date().toLocaleTimeString('hr-HR'),'ok');
    }
  }).catch(function(e){ sbStatus('Povlačenje nije uspjelo: '+e.message,'err'); });
}

    for (var i=0;i<localStorage.length;i++) {

function uvozKompletanBackup() {
  var inp = document.createElement('input');
  inp.type = 'file'; inp.accept = '.json';
  inp.style.cssText = 'position:fixed;left:-9999px;top:-9999px;opacity:0';
  inp.onchange = function(e) {
    var file = e.target.files[0];
    document.body.removeChild(inp);
    if (!file) return;
    var reader = new FileReader();
    reader.onload = function(ev) {
      try {
        var backup = JSON.parse(ev.target.result);
        if (!backup.podaci) { alert('Ovo ne izgleda kao ispravna Perla Note backup datoteka.'); return; }
        var brojKljuceva = Object.keys(backup.podaci).length;
        pnConfirm('Uvesti backup od '+(backup.datum?new Date(backup.datum).toLocaleString('hr-HR'):'nepoznatog datuma')+'?\n\n'+brojKljuceva+' stavki \u0107e ZAMIJENITI trenutne podatke u ovom pregledniku.\n\nOva radnja se ne mo\u017ee poni\u0161titi.', {ok:'Uvezi', kind:'danger'}).then(function(ok){ if (!ok) return;
        Object.keys(backup.podaci).forEach(function(key){
          try { localStorage.setItem(key, backup.podaci[key]); } catch(err) {}
        });
        try { localStorage.setItem('pn_backup_uvezen','1'); } catch(e) {}
        pnAlert('\u2713 Backup uvezen ('+brojKljuceva+' stavki). Aplikacija \u0107e se sada ponovno u\u010ditati.').then(function(){ location.reload(); });
        });
      } catch(err) {
        alert('Gre\u0161ka pri u\u010ditavanju backupa: '+err.message);
      }
    };
    reader.readAsText(file, 'UTF-8');
  };
  document.body.appendChild(inp);
  inp.click();
}

  'Rad no\u0107u': 'nocu', 'Prekovremeni rad': 'preko', 'Smjenski rad': 'smjena',

};

var RS_STUPCI = [
  {key:'datum', lbl:'DATUM'}, {key:'pocetak', lbl:'PO\u010cETAK RADA'}, {key:'zavrsetak', lbl:'ZAVR\u0160ETAK RADA'},

  {key:'bolovanje', lbl:'Bolovanje'}, {key:'placeni', lbl:'Pla\u0107eni dop.'}, {key:'ocinski', lbl:'O\u010dinski dop.'},
  {key:'neplaceni', lbl:'Neplac\u0107eni dop.'.replace('plac\u0107','pla\u0107')}, {key:'total', lbl:'UKUPNO SATI'}
];
var HR_DANI_KR = ['Pon','Uto','Sri','\u010cet','Pet','Sub','Ned'];
var HR_MJESECI = ['Sije\u010danj','Velja\u010da','O\u017eujak','Travanj','Svibanj','Lipanj','Srpanj','Kolovoz','Rujan','Listopad','Studeni','Prosinac'];

function rsBlagdaniHR(y) {
  // Uskrs (Meeus/Jones/Butcher)
  var a=y%19,b=Math.floor(y/100),c=y%100,d=Math.floor(b/4),e=b%4,f=Math.floor((b+8)/25),g=Math.floor((b-f+1)/3),
      h=(19*a+b-d-g+15)%30,i=Math.floor(c/4),k=c%4,l=(32+2*e+2*i-h-k)%7,mm=Math.floor((a+11*h+22*l)/451),
      em=Math.floor((h+l-7*mm+114)/31)-1,ed=((h+l-7*mm+114)%31)+1;
  var set={}; var add=function(dt){ set[dt.getMonth()+'-'+dt.getDate()]=true; };
  [[0,1],[0,6],[4,1],[4,30],[5,22],[7,5],[7,15],[10,1],[10,18],[11,25],[11,26]].forEach(function(p){ add(new Date(y,p[0],p[1])); });
  add(new Date(y,em,ed)); add(new Date(y,em,ed+1)); add(new Date(y,em,ed+60));
  return set;
}

function exportRadniSatiXLSX(imeFiltar) {
  var y=2026;
  var mjeseci=(typeof izvMjeseci==='function') ? izvMjeseci() : [curSatiMonth];
  if (mjeseci.length===12) {
    var _ima={}; DJELATNICI_SATI.forEach(function(e){ _ima[parseInt(e.datum.substring(5,7),10)-1]=true; });
    var _f=mjeseci.filter(function(x){ return _ima[x]; });
    mjeseci = _f.length ? _f : [curSatiMonth];
  }
  if (!ZAPOSLENICI.length) { alert('Nema zaposlenika za izvoz.'); return; }
  if (!window.ExcelJS) { alert('ExcelJS se jo\u0161 u\u010ditava, poku\u0161ajte za nekoliko sekundi.'); return; }

  var wb = new ExcelJS.Workbook();
  var NAVY='FF1F4E79', BLUE='FF0070C0', GRID='FFBFBFBF';
  var fillNavy={type:'pattern',pattern:'solid',fgColor:{argb:NAVY}};
  var fillSub ={type:'pattern',pattern:'solid',fgColor:{argb:'FFFFFF99'}};
  var fillNed ={type:'pattern',pattern:'solid',fgColor:{argb:'FFFFB3B3'}};
  var bThin={style:'thin',color:{argb:GRID}};
  var border={top:bThin,bottom:bThin,left:bThin,right:bThin};
  var blagdani=rsBlagdaniHR(y);
  var KODOVI=['nocu','preko','smjena','nedblag','godisnji','blagdan','bolovanje','placeni','ocinski','neplaceni'];
  var UVIJEK_NULA={osnovno:1,preko:1,nedblag:1,total:1}; // u retku UKUPNO se prikazuje i 0
  var colL=function(n){ return String.fromCharCode(64+n); };

  var _popis = imeFiltar ? ZAPOSLENICI.filter(function(n){return n===imeFiltar;}) : ZAPOSLENICI;
  mjeseci.forEach(function(m){
  var daysInMonth=new Date(y,m+1,0).getDate();
  _popis.forEach(function(ime){
    var perDay = {};
    for (var d=1; d<=daysInMonth; d++) perDay[d] = {};
    DJELATNICI_SATI.forEach(function(e){
      if (e.ime!==ime) return;
      var em=parseInt(e.datum.substring(5,7),10)-1, ey=parseInt(e.datum.substring(0,4),10), edd=parseInt(e.datum.substring(8,10),10);
      if (em!==m || ey!==y) return;
      var row = perDay[edd] || (perDay[edd]={});
      var sati = parseFloat(e.sati)||0;
      var stupac = RS_VRSTA_STUPAC[e.vrsta || 'Radni dan'] || 'osnovno';
      if (stupac==='zastoj') row.zastoj = (row.zastoj||0) + sati*60;
      else row[stupac] = (row[stupac]||0) + sati;
      if (e.pocetak && (!row.pocetak || e.pocetak < row.pocetak)) row.pocetak = e.pocetak;
      if (e.zavrsetak && (!row.zavrsetak || e.zavrsetak > row.zavrsetak)) row.zavrsetak = e.zavrsetak;
    });

    var sheetName=(ime.split(' ')[0]+' '+String(m+1).padStart(2,'0')+'.'+y).slice(0,31);
    var ws = wb.addWorksheet(sheetName, {
      views:[{state:'frozen', xSplit:1, ySplit:3}],
      pageSetup:{paperSize:9, orientation:'landscape', fitToPage:true, fitToWidth:1, fitToHeight:1,
                 margins:{left:0.4,right:0.4,top:0.5,bottom:0.5,header:0.3,footer:0.3}}
    });
    ws.columns = RS_STUPCI.map(function(s,idx){
      return {width: idx===0?11 : idx===1?10 : idx===2?11 : idx===15?11 : 9.5};
    });

    // Red 1: naslov
    var r1 = ws.getRow(1);
    r1.values = ['EVIDENCIJA RADNIH SATI', ime, HR_MJESECI[m]+' '+y];
    r1.font = {name:'Calibri', size:10};
    r1.height = 16;
    ws.getRow(2).height = 10;

    // Red 3: zaglavlje
    var HR=3, r3 = ws.getRow(HR);
    r3.height = 36;
    RS_STUPCI.forEach(function(s,ci){
      var c = r3.getCell(ci+1);
      c.value = s.lbl;
      c.font = {name:'Calibri', size:10, bold:true, color:{argb:'FFFFFFFF'}};
      c.fill = fillNavy; c.border = border;
      c.alignment = {horizontal:'center', vertical:'middle', wrapText:true};
    });

    // Dani
    var prvi=HR+1, zadnji=HR+daysInMonth;
    var ukupno = {};
    for (var d2=1; d2<=daysInMonth; d2++) {
      var ri = HR+d2;
      var dt = new Date(y,m,d2), dow=(dt.getDay()+6)%7;
      var isSub = dow===5, isNed = dow===6 || !!blagdani[m+'-'+d2];
      var row = perDay[d2] || {};
      var total = (row.osnovno||0); KODOVI.forEach(function(k){ total += (row[k]||0); });
      total = Math.round(total*100)/100;

      var vals = {datum:d2+'. ('+HR_DANI_KR[dow]+')', pocetak:row.pocetak||null, zavrsetak:row.zavrsetak||null,
                  zastoj:row.zastoj||null, osnovno:row.osnovno||null, total:null};
      KODOVI.forEach(function(k){ vals[k]=row[k]||null; });

      var r = ws.getRow(ri);
      r.height = 18;
      RS_STUPCI.forEach(function(s,ci){
        var c = r.getCell(ci+1);
        if (s.key==='total') {
          c.value = total ? {formula:'SUM(E'+ri+':O'+ri+')', result:total} : null;
        } else c.value = vals[s.key];
        c.border = border;
        var bold = (s.key==='osnovno'||s.key==='total');
        c.font = {name:'Calibri', size:11, bold:bold, color: bold?{argb:BLUE}:undefined};
        c.alignment = (ci===0) ? {horizontal:'left', vertical:'middle', indent:0}
                    : (ci<3)   ? {horizontal:'left', vertical:'middle'}
                    :            {horizontal:'center', vertical:'middle'};
        if (ci>0 && (isSub||isNed)) c.fill = isNed ? fillNed : fillSub;
      });
      ['zastoj','osnovno'].concat(KODOVI).forEach(function(k){ ukupno[k]=(ukupno[k]||0)+(row[k]||0); });
      ukupno.total=(ukupno.total||0)+total;
    }

    // Red UKUPNO
    var ti = zadnji+1, rT = ws.getRow(ti);
    rT.height = 22;
    RS_STUPCI.forEach(function(s,ci){
      var c = rT.getCell(ci+1), L=colL(ci+1);
      if (ci===0) c.value='UKUPNO';
      else if (ci>=3) {
        var v=Math.round((ukupno[s.key]||0)*100)/100;
        c.value = (v || UVIJEK_NULA[s.key]) ? {formula:'SUM('+L+prvi+':'+L+zadnji+')', result:v} : null;
      }
      c.font = {name:'Calibri', size:11, bold:true, color:{argb:'FFFFFFFF'}};
      c.fill = fillNavy; c.border = border;
      c.alignment = {horizontal: ci===0?'left':'center', vertical:'middle'};
    });
  });

  }); // kraj petlje po mjesecima

  wb.xlsx.writeBuffer().then(function(buf){
    var blob = new Blob([buf], {type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
    var a=document.createElement('a');
    a.href=URL.createObjectURL(blob);
    a.download='radni-sati-'+(imeFiltar?imeFiltar.replace(/[^A-Za-z0-9]+/g,'_')+'-':'')+(mjeseci.length===1?HR_MJESECI[mjeseci[0]]:'razdoblje')+'-'+y+'.xlsx';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
  }).catch(function(err){ alert('Gre\u0161ka pri generiranju Excela: '+err.message); });
}

function urediArtiklUnos(dateISO, artikl) {
  var parts=dateISO.split('-'); var mo=parseInt(parts[1],10)-1, dd=parseInt(parts[2],10);
  var val=DAILY_ARTIKLI[mo] && DAILY_ARTIKLI[mo][dd] && DAILY_ARTIKLI[mo][dd][artikl];
  if (!val) return;
  var a2=artikl.replace(/\\/g,'\\\\').replace(/'/g,"\\'").replace(/"/g,'&quot;');
  prihodSheet({kicker:'Uredi stavku prihoda', datum:dateISO, artikl:artikl, kom:val[0], iznos:val[1], nap:false,
    del:'<button type="button" class="rsf-del" onclick="obrisiArtiklUnos(\''+dateISO+'\',\''+a2+'\')">'+RS_ICO.trash+'<span>Obri\u0161i</span></button>',
    save:'potvrdiUrediArtikl(\''+dateISO+'\',\''+a2+'\')', saveLbl:'Spremi izmjene'});
}
function potvrdiUrediArtikl(oldDateISO, oldArtikl) {
  var newDate=document.getElementById('mPrihDatum').value;
  var kom=parseInt(document.getElementById('mPrihKom').value,10)||0;
  var iznos=parseFloat((document.getElementById('mPrihIznos').value||'0').replace(',','.'))||0;
  var artikl=document.getElementById('mPrihKat').value;
  if (!newDate || !artikl || artikl==='__novi__') { pnAlert('Popunite datum i artikl.'); return; }
  var op=oldDateISO.split('-'); var oMo=parseInt(op[1],10)-1, oDd=parseInt(op[2],10);
  if (DAILY_ARTIKLI[oMo] && DAILY_ARTIKLI[oMo][oDd]) { delete DAILY_ARTIKLI[oMo][oDd][oldArtikl]; if(!Object.keys(DAILY_ARTIKLI[oMo][oDd]).length) delete DAILY_ARTIKLI[oMo][oDd]; }
  var np=newDate.split('-'); var nMo=parseInt(np[1],10)-1, nDd=parseInt(np[2],10);
  if (!DAILY_ARTIKLI[nMo]) DAILY_ARTIKLI[nMo]={};
  if (!DAILY_ARTIKLI[nMo][nDd]) DAILY_ARTIKLI[nMo][nDd]={};
  DAILY_ARTIKLI[nMo][nDd][artikl]=[kom, Math.round(iznos*100)/100];
  saveDailyArtikliAndSync();
  renderPrihodiEvidencija();
  closeModal();
}
function obrisiArtiklUnos(dateISO, artikl) {
  pnConfirm('Obrisati stavku?\n\n\u201e'+artikl+'\u201d za '+rsDatumTekst(dateISO), {ok:'Obri\u0161i', kind:'danger'}).then(function(ok){
    if (!ok) return;
    var parts=dateISO.split('-'); var mo=parseInt(parts[1],10)-1, dd=parseInt(parts[2],10);
    if (DAILY_ARTIKLI[mo] && DAILY_ARTIKLI[mo][dd]) {
      delete DAILY_ARTIKLI[mo][dd][artikl];
      if (Object.keys(DAILY_ARTIKLI[mo][dd]).length===0) delete DAILY_ARTIKLI[mo][dd];
    }
    saveDailyArtikliAndSync();
    closeModal();
    renderPrihodiEvidencija();
  });
}

function zatvoriRowEditor(){ var m=document.getElementById('rowEditorModal'); if(m) m.remove(); renderRDG(); }
function deleteRowKey(key) {
  var r=ROWS.filter(function(x){return x.key===key;})[0];
  pnConfirm('Obrisati stavku?\n\n\u201e'+(r?r.lbl:'')+'\u201d \u0107e nestati iz Ra\u010duna D i G.', {ok:'Obri\u0161i', kind:'danger'}).then(function(ok){
    if (!ok) return;
    for (var i=0; i<ROWS.length; i++) { if (ROWS[i].key===key) { ROWS.splice(i,1); saveAll(); break; } }
    openRowEditor(); renderRDG();
  });
}
function addRow26(sec) {
  pnPrompt('Nova stavka', '', {ph:'Naziv stavke', ok:'Dodaj'}).then(function(lbl){
    if (!lbl || !lbl.trim()) return;
    var key='custom_'+Date.now();
    var secOrder={'place':0,'fiksni':1,'ostali':2};
    var insertIdx=ROWS.length;
    for (var _i=ROWS.length-1; _i>=0; _i--) {
      if ((secOrder[ROWS[_i].sec]||0) <= (secOrder[sec]||0)) { insertIdx=_i+1; break; }
      if (_i===0) insertIdx=0;
    }
    ROWS.splice(insertIdx,0,{key:key, lbl:lbl.trim(), sec:sec});
    P[key]=mk12(); saveAll(); openRowEditor(); renderRDG();
  });
}
function resetRows() {
  pnConfirm('Vratiti sve stavke na zadano?\n\nVlastite stavke koje ste dodali bit \u0107e uklonjene.', {ok:'Vrati', kind:'danger'}).then(function(ok){
    if (!ok) return;
    ROWS.length=0;
    for (var i=0; i<ROWS_DEF.length; i++) ROWS.push({key:ROWS_DEF[i].key,lbl:ROWS_DEF[i].lbl,sec:ROWS_DEF[i].sec});
    saveAll(); openRowEditor(); renderRDG();
  });
}

// povuci-i-ispusti za sve zone
function apBindDrop(root){
  (root||document).querySelectorAll('.ap-drop').forEach(function(z){
    ['dragenter','dragover'].forEach(function(ev){ z.addEventListener(ev,function(e){e.preventDefault();z.classList.add('over');}); });
    ['dragleave','drop'].forEach(function(ev){ z.addEventListener(ev,function(e){e.preventDefault();z.classList.remove('over');}); });
    z.addEventListener('drop',function(e){
      var inp=document.getElementById(z.getAttribute('data-input')); if(!inp||!e.dataTransfer||!e.dataTransfer.files.length) return;
      try { inp.files=e.dataTransfer.files; inp.dispatchEvent(new Event('change')); } catch(err) {}
    });
  });
}

function izvRDG(){
  var c=calc26(), mj=izvMjeseci();
  var head=['Stavka'].concat(mj.map(function(i){return MNAMES[i];})).concat(['UKUPNO']);
  var red=function(lbl,arr){ var s=0; var r=[lbl]; mj.forEach(function(i){ s+=arr[i]||0; r.push(fmt2(arr[i]||0)); }); r.push(fmt2(s)); return r; };
  var rows=[head, red('Prihodi', c.prihodi), red('Rashodi', c.rashodi), red('Dobit / gubitak', c.dobit)];
  // detalji po stavkama
  ['place','fiksni','ostali'].forEach(function(sec){
    getKeys(sec).forEach(function(k){
      var arr=[]; for (var i=0;i<12;i++) arr.push(getRowVal(k,i)||0);
      var ima=false; mj.forEach(function(i){ if(arr[i]) ima=true; });
      if (ima) rows.push(red((ROWS.filter(function(r){return r.key===k;})[0]||{}).lbl||k, arr));
    });

}
function izvTransakcije(catId){

  var rows=[['Datum','Tvrtka / opis','Iznos (EUR)','Valuta pla\u0107anja','Pla\u0107eno']], uk=0;
  izvMjeseci().forEach(function(m){

}
function izvProdajaPoDanima(){
  var rows=[['Datum','Artikl','Komada','Iznos (EUR)']], uk=0, ukKom=0;
  izvMjeseci().forEach(function(m){
    var dani=DAILY_ARTIKLI[m]||{};
    Object.keys(dani).sort(function(a,b){return a-b;}).forEach(function(d){
      Object.keys(dani[d]).forEach(function(art){
        var v=dani[d][art]; uk+=v[1]||0; ukKom+=v[0]||0;
        rows.push([ d+'.'+(m+1)+'.2026.', art, v[0]||0, fmt2(v[1]||0) ]);
      });
    });
  });
  if (rows.length>1) rows.push(['UKUPNO','',ukKom,fmt2(uk)]);
  return rows;
}
function izvRadniSati(ime){
  var rows=[['Datum','Zaposlenik','Radno mjesto','Po\u010detak','Zavr\u0161etak','Pauza (min)','Vrsta unosa','Sati','Napomena']], uk=0;
  DJELATNICI_SATI.slice().sort(function(a,b){return (a.datum||'').localeCompare(b.datum||'');}).forEach(function(e){
    if (!periodDatumU(e.datum)) return;
    if (ime && e.ime!==ime) return;
    uk+=parseFloat(e.sati)||0;
    rows.push([e.datum||'', e.ime||'', e.pozicija||'', e.pocetak||'', e.zavrsetak||'', (e.pauza!=null?e.pauza:''), e.vrsta||'', e.sati, e.nap||'']);
  });
  if (rows.length>1) rows.push(['UKUPNO','','','','','','',Math.round(uk*100)/100,'']);
  return rows;
}
function izvPDV(){
  var c=pdvCalcMonthly(), rows=[['Mjesec','Osnovica prihoda','Izlazni PDV','Osnovica tro\u0161kova','Pretporez','Razlika (za uplatu)']];
  var t=[0,0,0,0,0];
  izvMjeseci().forEach(function(m){
    var x=c[m]; t[0]+=x.izlOsn; t[1]+=x.izlPdv; t[2]+=x.ulOsn; t[3]+=x.ulPdv; t[4]+=x.razlika;
    rows.push([MNAMES[m], fmt2(x.izlOsn), fmt2(x.izlPdv), fmt2(x.ulOsn), fmt2(x.ulPdv), fmt2(x.razlika)]);
  });
  rows.push(['UKUPNO'].concat(t.map(fmt2)));
  return rows;
}
function izvDospijeca(){
  var rows=[['Rok pla\u0107anja','Dobavlja\u010d / opis','Kategorija','Iznos (EUR)','Status']], uk=0;
  getDospijeca().forEach(function(it){ uk+=parseFloat(it.r.iznos)||0; rows.push([it.r.vpl||'', it.r.tvrtka||'', it.katLbl, fmt2(it.r.iznos||0), 'kasni '+(it.dana||0)+' d.']); });
  getNadolazeca().forEach(function(it){ uk+=parseFloat(it.r.iznos)||0; rows.push([it.r.vpl||'', it.r.tvrtka||'', it.katLbl, fmt2(it.r.iznos||0), 'za '+(it.dana||0)+' d.']); });
  if (rows.length>1) rows.push(['UKUPNO','','',fmt2(uk),'']);
  return rows;
}
function izvZaposlenici(){
  var rows=[['Ime i prezime','Radno mjesto','Vrsta zaposlenja','Datum zaposlenja','Satnica (EUR/h)','Telefon','E-mail','Sati u razdoblju']];
  ZAPOSLENICI.forEach(function(ime){
    var inf=(typeof ZAP_INFO!=='undefined' && ZAP_INFO[ime])||{}, s=0;
    DJELATNICI_SATI.forEach(function(e){ if (e.ime===ime && periodDatumU(e.datum)) s+=parseFloat(e.sati)||0; });
    rows.push([ime, inf.pozicija||'', inf.ugovor||'', inf.datum||'', inf.satnica||'', inf.tel||'', inf.email||'', Math.round(s*100)/100]);
  });
  return rows;
}
// vra\u0107a {naziv, redovi} za trenutnu (ili zadanu) rubriku
function izvPodaciRubrike(id){
  var lbl=nazivRubrike(id);
  if (id==='rdg') return {naziv:'Ra\u010dun dobiti i gubitka', redovi:izvRDG()};
  if (id==='dash'||id==='ceo'||id==='mobhome') return {naziv:'Sa\u017eetak poslovanja', redovi:izvRDG()};
  if (id==='dnevni'||id==='izlazni_prihodi'||id==='mobprihodi') return {naziv:'Prodaja po danima', redovi:izvProdajaPoDanima()};
  if (id==='radni_sati') return {naziv:'Evidencija radnih sati', redovi:izvRadniSati(null)};
  if (id==='zaposlenici') return {naziv:'Popis djelatnika', redovi:izvZaposlenici()};
  if (id==='pdv') return {naziv:'PDV obra\u010dun', redovi:izvPDV()};
  if (id==='dospijeca'||id==='ulazni'||id==='izlazni') return {naziv:'Dospije\u0107a i otvorene stavke', redovi:izvDospijeca()};
  if (TD[id]) return {naziv:lbl, redovi:izvTransakcije(id)};
  var t=scrapeActiveTable();
  return {naziv:lbl, redovi:t||[]};
}
function izvSveRubrike(){
  var out=[{naziv:'Ra\u010dun dobiti i gubitka', redovi:izvRDG()}];
  var kat=ALL_TABS.filter(function(t){ return TD[t.id]; });
  kat.forEach(function(t){ var r=izvTransakcije(t.id); if (r.length>1) out.push({naziv:t.lbl, redovi:r}); });
  var pd=izvProdajaPoDanima(); if (pd.length>1) out.push({naziv:'Prodaja po danima', redovi:pd});
  var rs=izvRadniSati(null); if (rs.length>1) out.push({naziv:'Radni sati', redovi:rs});
  out.push({naziv:'Zaposlenici', redovi:izvZaposlenici()});
  out.push({naziv:'PDV obra\u010dun', redovi:izvPDV()});
  var dp=izvDospijeca(); if (dp.length>1) out.push({naziv:'Dospije\u0107a', redovi:dp});
  return out;
}
function pnBezKvacica(t){
  var m={'č':'c','ć':'c','đ':'d','š':'s','ž':'z','Č':'C','Ć':'C','Đ':'D','Š':'S','Ž':'Z'};
  return String(t).replace(/[čćđšžČĆĐŠŽ]/g,function(z){return m[z];});
}
function izvIme(t){ return pnBezKvacica(t).replace(/[^A-Za-z0-9]+/g,'_').replace(/^_|_$/g,''); }

function izvoziExcel(dijelovi, ime){
  if (!window.XLSX) { pnAlert('Excel biblioteka nije u\u010ditana.'); return; }
  var wb=XLSX.utils.book_new();
  dijelovi.forEach(function(d,i){
    var ws=XLSX.utils.aoa_to_sheet([[d.naziv],['Razdoblje: '+periodLbl()],[]].concat(d.redovi));
    ws['!cols']=(d.redovi[0]||['','']).map(function(_,ci){ return {wch: ci===0?26:16}; });
    XLSX.utils.book_append_sheet(wb, ws, (d.naziv.slice(0,26)||('List'+i)).replace(/[\\\/\?\*\[\]:]/g,''));
  });
  XLSX.writeFile(wb, ime+'_'+izvIme(periodKratko())+'.xlsx');
}
function izvoziPdf(dijelovi, naslov){
  var tijelo=dijelovi.map(function(d){ return izvTablicaHtml(d.redovi, dijelovi.length>1?d.naziv:''); }).join('');
  pnPrintHtml(izvPdfOmot(naslov, tijelo));
}
function izvoziCsv(dijelovi, ime){
  var rows=[];
  dijelovi.forEach(function(d,i){ if(i) rows.push([]); rows.push([d.naziv]); rows.push(['Razdoblje: '+periodLbl()]); d.redovi.forEach(function(r){ rows.push(r); }); });
  downloadCSV(rows, ime+'_'+izvIme(periodKratko()));
}
function izvoziPokreni(format, opseg, dodatak){
  var dijelovi, naslov, ime;
  if (opseg==='sve'){ dijelovi=izvSveRubrike(); naslov='Perla Note \u2014 cjelovit izvje\u0161taj 2026'; ime='PerlaNote_SVE'; }
  else if (opseg==='djelatnik'){ dijelovi=[{naziv:'Radni sati \u2014 '+dodatak, redovi:izvRadniSati(dodatak)}]; naslov='Radni sati \u2014 '+dodatak; ime='Radni_sati_'+izvIme(dodatak); }
  else { var d=izvPodaciRubrike(activeTab); dijelovi=[d]; naslov=d.naziv; ime=izvIme(d.naziv); }
  if (!dijelovi.length || (dijelovi.length===1 && dijelovi[0].redovi.length<2)) { pnAlert('Nema podataka za izvoz u odabranom razdoblju.'); return; }
  if (format==='xlsx' && opseg==='djelatnik' && typeof exportRadniSatiXLSX==='function') { exportRadniSatiXLSX(dodatak); closeModal(); return; }
  if (format==='xlsx' && opseg==='ova' && activeTab==='radni_sati' && typeof exportRadniSatiXLSX==='function') { exportRadniSatiXLSX(null); closeModal(); return; }
  if (format==='xlsx') izvoziExcel(dijelovi, ime);
  else if (format==='pdf') izvoziPdf(dijelovi, naslov);
  else izvoziCsv(dijelovi, ime);
  closeModal();
}
var IZV_FORMAT='xlsx', IZV_OPSEG='ova', IZV_DJEL='';
function izvOdabir(vrsta, v){
  if (vrsta==='f') IZV_FORMAT=v; else if (vrsta==='o') IZV_OPSEG=v; else IZV_DJEL=v;
  izvoziSheet(true);
}
function izvoziSheet(osvjezi){
  var d=izvPodaciRubrike(activeTab);
  var redaka=Math.max(0,(izvPodaciRubrike(activeTab).redovi.length-1));
  var fmts=[['xlsx','Excel','<path d="M3 3h18v18H3z"/><path d="M3 9h18M3 15h18M9 3v18"/>'],['pdf','PDF','<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6M8 13h8M8 17h5"/>'],['csv','CSV','<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m7 10 5 5 5-5M12 15V3"/>']];
  var seg=fmts.map(function(f){ return '<button type="button" class="izv-seg'+(IZV_FORMAT===f[0]?' on':'')+'" onclick="izvOdabir(\'f\',\''+f[0]+'\')"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">'+f[2]+'</svg><span>'+f[1]+'</span></button>'; }).join('');
  var red=function(v,t,s,extra){
    var on=(IZV_OPSEG===v);
    return '<button type="button" class="ap-row izv-row'+(on?' on':'')+'" onclick="izvOdabir(\'o\',\''+v+'\')">'+
      '<div class="ap-rt"><div class="ap-rn">'+t+'</div><div class="ap-rs">'+s+'</div></div>'+
      (on?'<span class="mob-per-ok"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg></span>':'')+'</button>'+(extra||'');
  };
  var djelOpt='';
  if (ZAPOSLENICI.length){
    djelOpt=red('djelatnik','Radni sati \u2014 jedan djelatnik','Evidencija za odabranog djelatnika',
      IZV_OPSEG==='djelatnik' ? '<div class="izv-djel"><select onchange="izvOdabir(\'d\',this.value)">'+ZAPOSLENICI.map(function(n){return '<option'+(IZV_DJEL===n?' selected':'')+'>'+n+'</option>';}).join('')+'</select></div>' : '');
  }
  if (!IZV_DJEL) IZV_DJEL=ZAPOSLENICI[0]||'';
  var html='<div class="rsf-grab"></div><div class="rsf-head"><div><div class="rsf-kicker">Izvoz podataka</div><div class="rsf-title">'+periodLbl()+'</div></div>'+
    '<button type="button" class="rsf-x" onclick="closeModal()" aria-label="Zatvori">'+RS_ICO.x+'</button></div>'+
    '<div class="rsf-body">'+
    '<div class="ap-cap">Format</div><div class="izv-segs">'+seg+'</div>'+
    '<div class="ap-cap">Opseg</div><div class="ap-list">'+
      red('ova','Ova rubrika \u2014 '+d.naziv, redaka+' '+(redaka===1?'redak':'redaka')+' u razdoblju')+
      red('sve','Sve rubrike (skupno)','RDG, tro\u0161kovi po kategorijama, prodaja, radni sati, PDV, dospije\u0107a')+
      djelOpt+
    '</div>'+
    '<div class="rsf-foot-note">Izvoz po\u0161tuje odabrano razdoblje (gore desno). PDF se otvara u pregledu za ispis \u2014 odaberite \u201eSpremi kao PDF\u201d.</div>'+
    '</div>'+
    '<div class="rsf-actions"><span></span><div class="rsf-act-r">'+
      '<button type="button" class="rsf-btn ghost" onclick="closeModal()">Odustani</button>'+
      '<button type="button" class="rsf-btn pri" onclick="izvoziPokreni(\''+IZV_FORMAT+'\',\''+IZV_OPSEG+'\',IZV_DJEL)">Preuzmi</button>'+
    '</div></div>';
  if (osvjezi && document.querySelector('.pnOvl .pnModal.rsf')){
    document.querySelector('.pnOvl .pnModal.rsf').innerHTML=html;
  } else rsfOtvori(html);
}

</script>
