// EXPORT EXCEL
// ═══════════════════════════════════════════
function exportExcel() {
  var c26=calc26(), fc=getForecast3();
  var activeIdx=[];
  for (var i=0; i<12; i++) { if (c26.prihodi[i]>0||c26.rashodi[i]>0) activeIdx.push(i); }
  var n=activeIdx.length;
  var avgMargin=n?activeIdx.map(function(i){return c26.prihodi[i]>0?((c26.prihodi[i]-c26.rashodi[i])/c26.prihodi[i]*100):0;}).reduce(function(a,b){return a+b;},0)/n:0;
  var avgBurn=n?activeIdx.reduce(function(s,i){return s+c26.rashodi[i];},0)/n:0;
  var wb=XLSX.utils.book_new();
  var hdr=['Stavka'].concat(MONTHS).concat(['TOTAL']);
  var ws1=XLSX.utils.aoa_to_sheet([hdr,
    ['PRIHODI'].concat(c26.prihodi).concat([sumA(c26.prihodi)]),
    ['RASHODI'].concat(c26.rashodi).concat([sumA(c26.rashodi)]),
    ['DOBIT/GUBITAK'].concat(c26.dobit).concat([sumA(c26.dobit)]),
    [],
    ['Profit Margin %'].concat(c26.prihodi.map(function(_,i){return c26.prihodi[i]>0?+((c26.prihodi[i]-c26.rashodi[i])/c26.prihodi[i]*100).toFixed(2):0;})).concat([+avgMargin.toFixed(2)])
  ]);
  ws1['!cols']=[{wch:30}].concat(MONTHS.map(function(){return {wch:12};})).concat([{wch:14}]);
  XLSX.utils.book_append_sheet(wb,ws1,'Pregled 2026');
  var rows2=[['Kategorija'].concat(MONTHS).concat(['TOTAL'])];
  for (var ri=0; ri<ROWS.length; ri++) {
    var r=ROWS[ri]; var arr=P[r.key]||mk12();
    rows2.push([r.lbl].concat(arr.map(function(v){return parseFloat(v)||0;})).concat([sumA(arr)]));
  }
  var ws2=XLSX.utils.aoa_to_sheet(rows2);
  ws2['!cols']=[{wch:36}].concat(MONTHS.map(function(){return {wch:12};})).concat([{wch:14}]);
  XLSX.utils.book_append_sheet(wb,ws2,'Struktura tro\u0161kova');
  var ws3=XLSX.utils.aoa_to_sheet([['Forecast'],['Mjesec','Prihod','Rashod','Dobit']].concat(fc.map(function(f){return [f.label,+f.prihod.toFixed(2),+f.rashod.toFixed(2),+f.dobit.toFixed(2)];})));
  ws3['!cols']=[{wch:20},{wch:18},{wch:18},{wch:18}];
  XLSX.utils.book_append_sheet(wb,ws3,'Forecast');
  var ws4=XLSX.utils.aoa_to_sheet([['CEO Panel',''],['Profit Margin',+avgMargin.toFixed(2)+'%'],['Cash Burn/mj.',+avgBurn.toFixed(2)],['Ukupni prihodi',sumA(c26.prihodi)],['Ukupni rashodi',sumA(c26.rashodi)],['Ukupna dobit',sumA(c26.dobit)]]);
  ws4['!cols']=[{wch:36},{wch:20}];
  XLSX.utils.book_append_sheet(wb,ws4,'CEO Panel');
  XLSX.writeFile(wb,'PerlaNote_RDG_2026.xlsx');
}

// PUBLISH
// ═══════════════════════════════════════════
function publishRDG() {
  var baked={pn_td:TD, pn_rows:ROWS, pn_p:P};
  var inject='<script>window.__BAKED__='+JSON.stringify(baked)+';window.__RO__=true;document.addEventListener("DOMContentLoaded",function(){document.body.setAttribute("data-ro","true");});<\/script>';
  var html=document.documentElement.outerHTML;
  html='<!DOCTYPE html>\n'+html;
  html=html.replace('<head>','<head>'+inject);
  var blob=new Blob([html],{type:'text/html;charset=utf-8'});
  var url=URL.createObjectURL(blob);
  var a=document.createElement('a');
  var today=new Date().toLocaleDateString('hr-HR',{day:'2-digit',month:'2-digit',year:'numeric'}).replace(/\./g,'-').replace(/ /g,'');
  a.href=url; a.download='PerlaNote_RDG_'+today+'_OBJAVLJENO.html';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
  var s=document.getElementById('saveStatus');
  if (s) { s.textContent='Objavljeno!'; s.style.color='#0d9488'; }
}

var SETTINGS = (function(){
  var base = {name:'PERLA NOTTE', sub:'j.d.o.o.', oib:'26880323172', adresa:'', iban:'', email:'', tel:'', logo:PN_LOGO_CRNI};
  try { var s=localStorage.getItem('pn_settings'); if(s) base=Object.assign(base, JSON.parse(s)); } catch(e) {}
  try { var lg=localStorage.getItem('pn_logo'); if(lg) base.logo=lg; } catch(e) {}
  return base;
})();

function applySettingsToHeader() {
  var tEl = document.getElementById('headerTitle');
  var sEl = document.getElementById('headerSub');
  var lEl = document.getElementById('headerLogo');
  if (tEl) tEl.textContent = SETTINGS.name || 'PERLA NOTE';
  // headerSub je naslov trenutne rubrike (postavlja ga switchTab)
  if (lEl) {
    // u bo\u010dnoj (tamnoj) traci koristi se bijela ina\u010dica loga
    var logoSide = (SETTINGS.logo && SETTINGS.logo!==PN_LOGO_CRNI) ? SETTINGS.logo : PN_LOGO_BIJELI;
    lEl.innerHTML = '<img src="'+logoSide+'" alt="Perla Notte RDG">';
  }
}

function saveSettings() {
  var fields = ['name','sub','oib','adresa','iban','email','tel'];
  fields.forEach(function(f) {
    var el = document.getElementById('set_'+f);
    if (el) SETTINGS[f] = el.value.trim();
  });
  // Logo se sprema odvojeno (pn_logo) jer moze biti velik - ovdje spremamo samo tekstualne postavke
  var toSave = {};
  fields.concat(['sub']).forEach(function(f){ toSave[f]=SETTINGS[f]; });
  toSave.name=SETTINGS.name; toSave.sub=SETTINGS.sub; toSave.oib=SETTINGS.oib;
  toSave.adresa=SETTINGS.adresa; toSave.iban=SETTINGS.iban; toSave.email=SETTINGS.email; toSave.tel=SETTINGS.tel;
  var settingsOk = true;
  try { localStorage.setItem('pn_settings', JSON.stringify(toSave)); } catch(e) { settingsOk=false; }
  var logoOk = SETTINGS.logo ? saveLogoToStorage(SETTINGS.logo) : true;
  applySettingsToHeader();
  saveAll();
  var btn = document.getElementById('settingsSaveBtn');
  if (btn) {
    if (settingsOk && logoOk) {
      btn.innerHTML = PST_ICO.check+'<span>Spremljeno</span>'; btn.className='pst-save ok';
    } else {
      btn.innerHTML = '<span>Djelomi\u010dno spremljeno (logo prevelik)</span>'; btn.className='pst-save warn';
    }
    setTimeout(function(){ btn.innerHTML=PST_SAVE_LBL; btn.className='pst-save'; },2500);
  }
}

function handleLogoUpload(inp) {
  var file = inp.files[0]; if (!file) return;
  if (file.size > 3000000) { alert('Logo mora biti manji od 3MB'); return; }
  var reader = new FileReader();
  reader.onload = function(e) {
    var img = new Image();
    img.onload = function() {
      // Smanji/komprimiraj logo na malu velicinu (dovoljno za prikaz u headeru/sidebaru)
      // kako bismo izbjegli premasivanje ogranicenja localStorage-a (osobito kod file:// pristupa)
      var maxDim = 160;
      var w = img.width, h = img.height;
      if (w > h) { if (w > maxDim) { h = Math.round(h * maxDim / w); w = maxDim; } }
      else { if (h > maxDim) { w = Math.round(w * maxDim / h); h = maxDim; } }
      var canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      var ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, w, h);
      var dataUrl = canvas.toDataURL('image/png', 0.85);

      SETTINGS.logo = dataUrl;
      var prev = document.getElementById('logoPreview');
      if (prev) prev.innerHTML = '<img src="'+dataUrl+'" style="max-height:80px;max-width:200px;object-fit:contain;border-radius:8px;" />';
      applySettingsToHeader();

      // Odvojeno spremanje loga (velicina) od ostalih postavki (tekst), pa greska na jednom ne blokira drugo
      var ok = saveLogoToStorage(dataUrl);
      if (!ok) {
        alert('\u26a0 Logo je uspje\u0161no u\u010ditan i prikazan, ali NIJE trajno spremljen jer je predugacak za lokalnu pohranu ovog preglednika. Poku\u0161ajte s manjom/jednostavnijom slikom (idealno kvadratni PNG do 160x160px).');
      }
    };
    img.onerror = function() { alert('Nije mogu\u0107e u\u010ditati odabranu sliku.'); };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

function saveLogoToStorage(dataUrl) {
  try {
    localStorage.setItem('pn_logo', dataUrl);
    return true;
  } catch(e) {
    console.error('Logo save failed:', e);

var DAILY = (function(){
  try { var s=localStorage.getItem('pn_daily'); if(s) return JSON.parse(s); } catch(e) {}
  // 12 months x 31 days
  var d = [];
  for (var m=0;m<12;m++) { var days=[]; for(var i=0;i<31;i++) days.push(0); d.push(days); }
  return d;
})();

var DAYS_IN_MONTH = [31,28,31,30,31,30,31,31,30,31,30,31];
var DAILY_MONTH = 0; // currently selected month

function saveDailyAndSync() {
  try { localStorage.setItem('pn_daily', JSON.stringify(DAILY)); } catch(e) {}
  // U knjigu (RDG) uvijek ide ZBROJ svih aparata, neovisno o tome koji je aparat prikazan
  var SVI = (typeof DAILY_UK!=='undefined' && DAILY_UK) ? DAILY_UK : DAILY;
  if (!P.prihodi_vending) P.prihodi_vending = mk12();
  for (var m=0;m<12;m++) {
    var sum=0;
    for (var d=0;d<DAYS_IN_MONTH[m];d++) sum+=parseFloat(SVI[m][d])||0;
    P.prihodi_vending[m]=sum;
  }
  saveAll();
  // Osvjezi samo ako je Dashboard aktivan
  if (activeTab==='dash' && typeof refreshCharts === 'function') refreshCharts();
  // Osvjezi RDG in-place ako je aktivan
  if (activeTab==='rdg' && typeof updateRDGInPlace === 'function') updateRDGInPlace();
}

    for (j=0; j<pK.length; j++) tPlace[i]+=getRowVal(pK[j],i);
    for (j=0; j<fK.length; j++) tFiks[i]+=getRowVal(fK[j],i);
    for (j=0; j<oK.length; j++) tOst[i]+=getRowVal(oK[j],i);
    tUR[i]=tPlace[i]+tFiks[i]+tOst[i];
  }
  var pv=P.prihodi_vending||mk12();
  for (i=0; i<12; i++) {
    var comb=(parseFloat((P.prihodi_grupe&&P.prihodi_grupe[i])||0))+(parseFloat(pv[i])||0);
    tD[i]=comb-tUR[i];
  }
  var totPlace=sumA(tPlace), totFiks=sumA(tFiks), totOst=sumA(tOst), totUR=sumA(tUR);
  var totPv=sumA(pv), totPg=sumA(P.prihodi_grupe||mk12());
  var totP=totPg+totPv, totD=totP-totUR;

  // Azuriraj summary kartice
  var cards=tab.querySelectorAll('.card-value');
  if (cards[0]) cards[0].innerHTML=fmt2(totP)+' <span style="font-size:11px;color:var(--label4)">EUR</span>';
  if (cards[1]) { cards[1].innerHTML=fmt2(totUR)+' <span style="font-size:11px;color:var(--label4)">EUR</span>'; }
  if (cards[2]) { cards[2].innerHTML=(totD<0?'-':'')+fmt2(totD)+' <span style="font-size:11px;color:var(--label4)">EUR</span>'; cards[2].className='card-value '+(totD>=0?'green':'red'); }

  // Azuriraj totale u redovima
  tab.querySelectorAll('tr[data-subtotal]').forEach(function(tr) {
    var type=tr.dataset.subtotal;
    var arr=type==='place'?tPlace:type==='fiksni'?tFiks:type==='ostali'?tOst:type==='total'?tUR:tD;
    var tot=type==='place'?totPlace:type==='fiksni'?totFiks:type==='ostali'?totOst:type==='total'?totUR:totD;
    var tds=tr.querySelectorAll('td');
    for (var mi=0; mi<12; mi++) {
      if (tds[mi+1]) tds[mi+1].innerHTML=arr[mi]?fmt2(arr[mi])+' <span style="font-size:9px;color:#aaa">EUR</span>':'<span style="color:#ccc">—</span>';
    }
    if (tds[13]) {
      if (type==='dobit') tds[13].innerHTML='<span style="color:'+(tot>=0?'var(--green)':'var(--red)')+';font-weight:600">'+(tot<0?'-':'')+fmt2(tot)+' <span style="font-size:9px;color:#aaa">EUR</span></span>';
      else tds[13].innerHTML=tot?fmt2(tot)+' <span style="font-size:9px;color:#aaa">EUR</span>':'<span style="color:#ccc">—</span>';
    }
  });

  // Azuriraj row totale
  tab.querySelectorAll('tr:not([data-subtotal]) .num-input[data-k]').forEach(function(inp) {
    var tr=inp.closest('tr'); if (!tr) return;
    var k=inp.dataset.k; if (!k) return;
    var lastTd=tr.querySelector('td:last-child');
    if (!lastTd || lastTd.querySelector('input')) return;
    var t=sumA(P[k]);
    lastTd.innerHTML=t?fmt2(t)+' <span style="font-size:9px;color:#aaa">EUR</span>':'<span style="color:#ccc">—</span>';
  });
}

function pnKljucArtikla(n){ return String(n||'').toLowerCase().replace(/&/g,'and').replace(/[^a-z0-9\u00c0-\u024f]+/g,' ').trim(); }
function pnSluzbeniNaziv(n){
  var k=pnKljucArtikla(n);
  for (var i=0;i<SLUZBENI_ARTIKLI.length;i++) if (pnKljucArtikla(SLUZBENI_ARTIKLI[i])===k) return SLUZBENI_ARTIKLI[i];
  return String(n||'').trim().replace(/\s+/g,' ');
}
// Spaja sve varijante istog naziva (velika/mala slova, razmaci) u sluzbeni naziv. Vraca broj spojenih kljuceva.
function pnNormalizirajArtikle(obj){
  var spojeno=0;
  for (var mo in obj) for (var dd in obj[mo]) {
    var arts=obj[mo][dd], novi={}, promjena=false;
    Object.keys(arts).forEach(function(k){
      var c=pnSluzbeniNaziv(k); if (c!==k) promjena=true;
      if (!novi[c]) novi[c]=[0,0]; else spojeno++;
      novi[c][0]+=(+arts[k][0]||0); novi[c][1]=Math.round((novi[c][1]+(+arts[k][1]||0))*100)/100;
    });
    if (promjena) obj[mo][dd]=novi;
  }
  return spojeno;
}
var chartArtikli = null;

function getArtikliChartData() {
  // Vraca podatke za Dashboard graf preracunate iz stvarnih unosa u DAILY_ARTIKLI (Prodaja po danima),
  // BEZ diranja globalnog CRM_ARTIKLI popisa (koji ostaje glavni izvor za dropdown-ove/boje drugdje).
  var totals = {};
  for (var mo in DAILY_ARTIKLI) {
    if (typeof periodUrange==='function' && !periodUrange(parseInt(mo,10))) continue;
    for (var dd in DAILY_ARTIKLI[mo]) {
      var arts = DAILY_ARTIKLI[mo][dd];
      for (var an in arts) {
        if (!totals[an]) totals[an] = {kom:0, iznos:0};
        totals[an].kom += arts[an][0];
        totals[an].iznos += arts[an][1];
      }
    }
  }
  if (Object.keys(totals).length===0) return (PERIOD && PERIOD.tip!=='god') ? [] : CRM_ARTIKLI;
  var novi = Object.keys(totals).map(function(n){
    return {name:n, iznos:Math.round(totals[n].iznos*100)/100, kom:totals[n].kom};
  });
  novi.sort(function(a,b){ return b.iznos-a.iznos; });
  return novi;
}

  }
}

// UVOZ IZ CRM (Import CRM JSON)
// ═══════════════════════════════════════════
function uvozIzCRM() {
  var inp = document.createElement('input');
  inp.type='file'; inp.accept='.json';
  inp.style.cssText='position:fixed;left:-9999px;top:-9999px;opacity:0';
  inp.onchange = function(e) {
    var file = e.target.files[0];
    document.body.removeChild(inp);
    if (!file) return;
    var reader = new FileReader();
    reader.onload = function(ev) {
      try {
        var crm = JSON.parse(ev.target.result);
        processCRMImport(crm);
      } catch(err) {
        alert('Greška pri učitavanju JSON-a: '+err.message);
      }
    };
    reader.readAsText(file, 'UTF-8');
  };
  document.body.appendChild(inp);
  inp.click();
}

function processCRMImport(crm) {
  // 1. Artikli / prihodi
  var arts={}, monthly={};
  if (crm.prihodi) {
    for (var i=0;i<crm.prihodi.length;i++) {
      var p=crm.prihodi[i];
      var name=p.opis, iznos=parseFloat(p.iznos)||0, kom=parseInt(p.kom)||0;
      var m=parseInt(p.datum.substring(5,7))-1;
      if (!arts[name]) arts[name]={iznos:0,kom:0};
      arts[name].iznos+=iznos; arts[name].kom+=kom;
      if (!monthly[m]) monthly[m]=0;
      monthly[m]+=iznos;
    }
    // Update CRM_ARTIKLI
    (function(){ var a2={}; Object.keys(arts).forEach(function(n){ var c=pnSluzbeniNaziv(n); if(!a2[c]) a2[c]={iznos:0,kom:0}; a2[c].iznos+=arts[n].iznos; a2[c].kom+=arts[n].kom; }); arts=a2; })();
    CRM_ARTIKLI = Object.keys(arts).sort(function(a,b){return arts[b].iznos-arts[a].iznos;}).map(function(n){return {name:n,iznos:Math.round(arts[n].iznos*100)/100,kom:arts[n].kom};});
    // Update P.prihodi_grupe with monthly totals
    if (!P.prihodi_grupe) P.prihodi_grupe=mk12();
    for (var m2=0;m2<12;m2++) P.prihodi_grupe[m2]=(monthly[m2]||0);
    // Update DAILY from per-article daily data
    if (!P.prihodi_vending) P.prihodi_vending=mk12();
  }

  // 2. Radni sati
  if (crm.radniSati) {
    if (!P.radni_sati) P.radni_sati=mk12();
    for (var j=0;j<crm.radniSati.length;j++) {
      var rs=crm.radniSati[j];
      var rm=parseInt(rs.datum.substring(5,7))-1;
      P.radni_sati[rm]=(P.radni_sati[rm]||0)+parseFloat(rs.sati||0);
    }
  }

  // 3. Rashodi
  if (crm.rashodi) {
    var rashKat={};
    for (var k=0;k<crm.rashodi.length;k++) {
      var r=crm.rashodi[k];
      var rkat=r.kat||'Ostalo', rinz=parseFloat(r.iznos)||0;
      var rm2=parseInt(r.datum.substring(5,7))-1;
      if (!rashKat[rkat]) rashKat[rkat]=mk12();
      rashKat[rkat][rm2]+=rinz;
    }
    // Map to P keys
    var katMap={'Nabava robe':'nabava_proteina','Ksigovodstvo':'knjig_s','Banka':'banka_s','Osoblje':'place_mgmt_s','Ostalo':'razno_s'};
    for (var rk in rashKat) {
      var pkey=katMap[rk]||'razno_s';
      if (!P[pkey]) P[pkey]=mk12();
      for (var m3=0;m3<12;m3++) P[pkey][m3]=(P[pkey][m3]||0)+rashKat[rk][m3];
    }
  }

  // 4. Settings
  if (crm.settings) {
    if (!SETTINGS) SETTINGS={};
    if (crm.settings.naziv) SETTINGS.name=crm.settings.naziv;
    if (crm.settings.oib) SETTINGS.oib=crm.settings.oib;
    if (crm.settings.adresa) SETTINGS.adresa=crm.settings.adresa;
    if (crm.settings.iban) SETTINGS.iban=crm.settings.iban;
    if (crm.settings.email) SETTINGS.email=crm.settings.email;
    if (crm.settings.tel) SETTINGS.tel=crm.settings.tel;
    if (crm.settings.logo) SETTINGS.logo=crm.settings.logo;
    try{localStorage.setItem('pn_settings',JSON.stringify(SETTINGS));}catch(e){}
    applySettingsToHeader();
  }

  saveAll();
  renderRDG();
  if (chartU) refreshCharts();
  buildArtikliChart();
  alert('✓ Uvoz iz CRM uspješno završen!\n\nPrihodi: '+Object.keys(arts).length+' artikala\nRadni sati: '+(crm.radniSati?crm.radniSati.length:0)+' unosa\nRashodi: '+(crm.rashodi?crm.rashodi.length:0)+' unosa');
}

function parseDMY(str) {
  // "dd.mm." -> Date za 2026. godinu
  if (!str) return null;
  var parts = str.replace(/\.$/,'').split('.');
  if (parts.length<2) return null;
  var d=parseInt(parts[0],10), m=parseInt(parts[1],10);
  if (!d||!m) return null;
  return new Date(2026, m-1, d);
}
function getDospijeca() {
  var out=[];
  var today=new Date();
  var KNOWN_NON_TRANS=['dash','rdg','ceo','alerts','postavke','radni_sati'];
  var cats = ALL_TABS.filter(function(t){ return KNOWN_NON_TRANS.indexOf(t.id)===-1; });
  for (var ci=0; ci<cats.length; ci++) {
    var catId=cats[ci].id;
    if (!TD[catId]) continue;
    for (var mo=0; mo<12; mo++) {
      var rows=TD[catId][mo]||[];
      for (var ri=0; ri<rows.length; ri++) {
        var r=rows[ri];
        if (!r.vpl || pnZatvoren(r)) continue;
        var vplDate=parseDMY(r.vpl);
        if (vplDate && vplDate<today) {
          out.push({kat:catId, katLbl:cats[ci].lbl, mo:mo, ri:ri, r:r, dana:Math.max(1,Math.floor((today-vplDate)/86400000))});
        }
      }
    }
  }
  return out;
}
function oznaciPlaceno(kat, mo, ri) {
  var today=new Date();
  var ds=String(today.getDate()).padStart(2,'0')+'.'+String(today.getMonth()+1).padStart(2,'0')+'.';
  var _r=TD[kat][mo][ri];
  if (pnImaRate(_r)) { var _o=pnOstatak(_r); if (_o>0.01) pnDodajUplatu(_r, ds, _o, false, 'ru\u010dno ozna\u010deno'); }
  else TD[kat][mo][ri].placeno=ds;
  saveAll();
  renderDospijeca();
  renderNav();
}
function getNadolazeca() {
  var out=[];
  var today=new Date();
  var horizon=new Date(); horizon.setDate(horizon.getDate()+14);
  var KNOWN_NON_TRANS=['dash','rdg','ceo','alerts','postavke','radni_sati'];
  var cats = ALL_TABS.filter(function(t){ return KNOWN_NON_TRANS.indexOf(t.id)===-1; });
  for (var ci=0; ci<cats.length; ci++) {
    var catId=cats[ci].id;
    if (!TD[catId]) continue;
    for (var mo=0; mo<12; mo++) {
      var rows=TD[catId][mo]||[];
      for (var ri=0; ri<rows.length; ri++) {
        var r=rows[ri];
        if (!r.vpl || pnZatvoren(r)) continue;
        var vplDate=parseDMY(r.vpl);
        if (vplDate && vplDate>=today && vplDate<=horizon) {
          var days=Math.round((vplDate-today)/86400000);
          out.push({kat:catId, katLbl:cats[ci].lbl, mo:mo, ri:ri, r:r, dana:days});
        }
      }
    }
  }
  out.sort(function(a,b){return a.dana-b.dana;});
  return out;
}

var chartCF=null;

function cfMonday(d) {
  var dd = new Date(d);
  var day = (dd.getDay()+6)%7;
  dd.setDate(dd.getDate()-day);
  dd.setHours(0,0,0,0);
  return dd;
}
function cfDays() {
  if (!CFW) CFW = cfMonday(new Date());
  var arr=[];
  for (var i=0;i<7;i++) { var d=new Date(CFW); d.setDate(d.getDate()+i); arr.push(d); }
  return arr;
}
function cfKey(d) { return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
var CF_MS=['sij','vlj','o\u017eu','tra','svi','lip','srp','kol','ruj','lis','stu','pro'];
function cfLabel() {
  var d=cfDays(), a=d[0], b=d[6];
  return a.getDate()+'.'+CF_MS[a.getMonth()]+' \u2013 '+b.getDate()+'.'+CF_MS[b.getMonth()]+' '+b.getFullYear()+'.';
}
function cfShift(n) {
  if (n===0) { CFW=cfMonday(new Date()); }
  else { var d=cfDays()[0]; CFW=new Date(d.getFullYear(),d.getMonth(),d.getDate()+n*7); }
  renderCashflow();
}

function pnJePonuda(t){ return /ponuda\s*br/i.test(String(t||'')); }

// Izvori za redak cash flowa. "Ostali tro\u0161kovi" hvataju svaku kategoriju koja nije
// izrijekom navedena drugdje \u2014 tako i naknadno dodane kategorije zavr\u0161e u nov\u010danom tijeku.
var CF_PRIHODI=['prihodi26','izlazni_prihodi'];
var CF_NIJE_TROSAK=['dnevni','radni_sati','zaposlenici','postavke','dash','rdg','ceo','alerts'];
function cfSrcZa(l){
  var src=(l.src||[]).slice();
  if (l.id==='in_prihodi') {
    CF_PRIHODI.forEach(function(k){ if (TD[k] && src.indexOf(k)<0) src.push(k); });
    return src;
  }
  if (l.id!=='cogs_ostali') return src;
  var pokriveno={};
  CFL.forEach(function(x){ if (x.id!=='cogs_ostali') (x.src||[]).forEach(function(k){ pokriveno[k]=1; }); });
  CF_PRIHODI.forEach(function(k){ pokriveno[k]=1; });
  CF_NIJE_TROSAK.forEach(function(k){ pokriveno[k]=1; });
  for (var k2 in TD) { if (TD.hasOwnProperty(k2) && !pokriveno[k2] && src.indexOf(k2)<0) src.push(k2); }
  return src;
}

// ═══════════════════════════════════════════
// RATE / DJELOMIČNA PLAĆANJA
// Račun može biti plaćen u više navrata. Svaka uplata: {d:'dd.mm.', i:iznos, izv:1 kad je potvrđena izvodom, ref:'redak izvoda'}
// Trošak ostaje u mjesecu u kojem je račun nastao; u novčani tijek ulazi svaka uplata na svoj datum.
// ═══════════════════════════════════════════
function pnSakrij(r, kljuc, vrijednost){
  try { Object.defineProperty(r, kljuc, {value:vrijednost, writable:true, enumerable:false, configurable:true}); }
  catch(e) { r[kljuc]=vrijednost; }
}
// Rate zapisane u opisu, npr. "( 500,00 EUR PLAĆENO 21.07.26.)" — čitaju se uvijek iznova,
// pa se izmjena opisa odmah odrazi na novcani tijek. Rezultat se pamti dok se opis ne promijeni.
function pnUplateIzOpisa(r){
  var t=String(r.tvrtka||'');
  if (r.__uKljuc===t) return r.__uRate||[];
  var v=pnRateIzOpisa(t, r.iznos)||[];
  pnSakrij(r,'__uKljuc',t); pnSakrij(r,'__uRate',v);
  return v;
}
function pnUplate(r){
  if (!r) return [];
  if (Array.isArray(r.uplate) && r.uplate.length) return r.uplate;
  if (r.bezRata) return [];
  return pnUplateIzOpisa(r);
}
// Prije izmjene rata: rate iz opisa pretvori u stvarno polje retka
function pnMaterijaliziraj(r){
  if (!Array.isArray(r.uplate) || !r.uplate.length) {
    var d=r.bezRata ? [] : pnUplateIzOpisa(r);
    r.uplate = d.map(function(u){ return {d:u.d, i:u.i, izv:u.izv, ref:u.ref||''}; });
  }
  return r.uplate;
}
function pnImaRate(r){ return pnUplate(r).length>0; }
function pnPlacenoIznos(r){ var s=0; pnUplate(r).forEach(function(u){ s+=parseFloat(u.i)||0; }); return Math.round(s*100)/100; }
function pnOstatak(r){ return Math.round(((parseFloat(r.iznos)||0)-pnPlacenoIznos(r))*100)/100; }
// Ponuda ceka broj racuna kad opis zavrsava s "RN.BR:" bez broja
function pnPonudaBezRacuna(t){ return /PONUDA\s*BR:/i.test(String(t||'')) && /RN\.?\s*BR:\s*$/i.test(String(t||'').trim()); }
function pnPonudaZaRacun(dobavljac, iznos){
  var w1=pnRijeci(dobavljac), naj=null, najS=-1;
  pnSveStavke().forEach(function(st){
    var r=st.r;
    if (!pnPonudaBezRacuna(r.tvrtka)) return;
    if (Math.abs((parseFloat(r.iznos)||0)-(parseFloat(iznos)||0))>=0.01) return;
    var w2=pnRijeci(r.tvrtka), pog=0;
    w1.forEach(function(w){ if (w2.indexOf(w)>=0) pog++; });
    if (pog>najS) { najS=pog; naj=st; }
  });
  return (naj && najS>0) ? naj : null;
}
function pnViseRata(r){ return pnUplate(r).length>1 || (pnImaRate(r) && pnOstatak(r)>0.01); }
function pnZatvoren(r){ return pnImaRate(r) ? (pnOstatak(r)<=0.01) : !!r.placeno; }
function pnPad2(n){ return String(n).length<2 ? '0'+n : String(n); }
function pnDanasDMY(){ var d=new Date(); return pnPad2(d.getDate())+'.'+pnPad2(d.getMonth()+1)+'.'; }
function pnSortUplate(r){
  r.uplate.sort(function(a,b){ var A=parseDMY(a.d), B=parseDMY(b.d); return (A?A.getTime():0)-(B?B.getTime():0); });
}
function pnOsvjeziStatus(r){
  if (!Array.isArray(r.uplate) || !r.uplate.length) return;
  pnSortUplate(r);
  if (pnOstatak(r)<=0.01) r.placeno = r.uplate[r.uplate.length-1].d;  // zatvoren – miče se iz Dospijeća
  else r.placeno = '';                                                // djelomično plaćen – ostaje otvoren
  r.izvod = r.uplate.some(function(u){ return u.izv; }) ? 1 : 0;
}
function pnDodajUplatu(r, datum, iznos, izIzvoda, ref){
  pnMaterijaliziraj(r);
  if (!r.uplate.length && r.placeno) r.placeno='';  // rucni datum zamjenjuje stvarna uplata
  r.uplate.push({d:datum, i:Math.round((parseFloat(iznos)||0)*100)/100, izv:izIzvoda?1:0, ref:ref||''});
  pnOsvjeziStatus(r);
}
function pnRateRijec(n){
  var z=n%100, j=n%10;
  if (z>=11 && z<=14) return 'rata';
  if (j===1) return 'rati';
  if (j>=2 && j<=4) return 'rate';
  return 'rata';
}
function pnDatumZatvaranja(r){
  var u=pnUplate(r);
  return u.length ? (u[u.length-1].d||'') : (r.placeno||'');
}
function pnOpisRata(r){
  var u=pnUplate(r); if(!u.length) return '';
  return u.map(function(x){ return fmt2(x.i)+' ('+x.d+')'+(x.izv?'':' • bez izvoda'); }).join('  ·  ');
}

// ── Jednokratno: rate zapisane u opisu tipa "( 500,00 EUR PLAĆENO 21.07.26.)" pretvaraju se u prave rate ──
function pnRateIzOpisa(txt, ukupno){
  var t=String(txt||'').toLowerCase();
  var re=/\(\s*([0-9][0-9.,]*)\s*(?:eur|eura|euro|€)?\s*pla[cčć]eno\s*([0-9]{1,2})\s*\.\s*([0-9]{1,2})\s*\.(?:\s*[0-9]{2,4}\s*\.?)?\s*\)/g;
  var out=[], m, zbroj=0;
  while ((m=re.exec(t))!==null) {
    var iz=parseHR(m[1]); if(!iz) continue;
    var dan=parseInt(m[2],10), mj=parseInt(m[3],10);
    if (!dan||!mj||mj>12||dan>31) continue;
    out.push({d:pnPad2(dan)+'.'+pnPad2(mj)+'.', i:iz, izv:1, ref:'prepoznato iz opisa'});
    zbroj+=iz;
  }
  if (!out.length) return null;
  if (zbroj > (parseFloat(ukupno)||0)+0.01) return null;   // ne diramo ako se ne uklapa u iznos računa
  return out;
}
(function(){

  // u redak brisu se — od sada se čitaju uvijek iznova iz opisa, pa izmjena opisa odmah vrijedi.
  var FLAG='pn_rate_ocisti_1';

// UPARIVANJE REDAKA IZVODA S POSTOJEĆIM RAČUNIMA
// ═══════════════════════════════════════════
function pnBrojeviRacuna(t){
  var s=String(t||'').toUpperCase(), out=[], m;
  var re=/\d{1,7}[-\/]\d{1,7}(?:[-\/]\d{1,7})?/g;
  while ((m=re.exec(s))!==null) out.push(m[0].replace(/\//g,'-'));
  return out;
}
var PN_STOP_RIJECI=['ponuda','racun','račun','broj','eura','euro','placeno','plaćeno','naknada','uplata','isplata','nalog','trajni','prijenos','opis','datum','valuta','svrha','doo','j.d.o.o','d.o.o'];
function pnRijeci(t){
  return String(t||'').toLowerCase().replace(/[^a-z0-9šđčćž ]+/g,' ').split(/\s+/)
    .filter(function(w){ return w.length>3 && PN_STOP_RIJECI.indexOf(w)<0; });
}
function pnOcijeniPodudaranje(r, iznosAbs, opis){
  var ost=pnOstatak(r), pun=parseFloat(r.iznos)||0, score=0, razlozi=[];
  var b1=pnBrojeviRacuna(opis), b2=pnBrojeviRacuna(r.tvrtka), pogodakBroj=false;
  b1.forEach(function(a){ b2.forEach(function(b){
    if (a===b || (a.length>=6 && b.indexOf(a)===0) || (b.length>=6 && a.indexOf(b)===0)) pogodakBroj=true;
  }); });
  if (pogodakBroj) { score+=100; razlozi.push('broj računa'); }
  var w1=pnRijeci(opis), w2=pnRijeci(r.tvrtka), pog=0;
  w1.forEach(function(w){ if (w2.indexOf(w)>=0) pog++; });
  if (pog) { score+=Math.min(40,pog*20); razlozi.push('naziv dobavljača'); }
  if (Math.abs(ost-iznosAbs)<0.01 && ost>0.01) { score+=60; razlozi.push('iznos = preostali dug'); }
  else if (Math.abs(pun-iznosAbs)<0.01) { score+=55; razlozi.push('iznos računa'); }
  else if (iznosAbs < ost-0.01) { score+=20; razlozi.push('djelomična uplata'); }
  else score-=40;
  if (pnImaRate(r) && ost<=0.01) { score-=70; razlozi.push('već zatvoren ratama'); }
  else if (r.placeno && !r.izvod) { score+=15; razlozi.push('označen plaćenim, čeka izvod'); }
  else if (r.placeno && r.izvod) { score-=70; razlozi.push('već potvrđen izvodom'); }
  return {score:score, razlog:razlozi.join(' · '), ostatak:ost};
}
function pnSveStavke(){
  var KNOWN=['dash','rdg','ceo','alerts','postavke','radni_sati'];
  var cats=ALL_TABS.filter(function(t){ return KNOWN.indexOf(t.id)===-1; });
  var out=[];
  cats.forEach(function(c){
    if (!TD[c.id]) return;
    for (var mo=0;mo<12;mo++) {
      var rows=TD[c.id][mo]||[];
      for (var ri=0;ri<rows.length;ri++) {
        var r=rows[ri];
        if (!r.tvrtka && !(parseFloat(r.iznos)||0)) continue;
        out.push({kat:c.id, katLbl:c.lbl, mo:mo, ri:ri, r:r});
      }
    }
  });
  return out;
}
function pnKandidati(iznosAbs, opis){
  var out=[];
  pnSveStavke().forEach(function(s){
    var o=pnOcijeniPodudaranje(s.r, iznosAbs, opis);
    if (o.score<=0) return;
    out.push({kat:s.kat, katLbl:s.katLbl, mo:s.mo, ri:s.ri, r:s.r, score:o.score, razlog:o.razlog, ostatak:o.ostatak});
  });
  out.sort(function(a,b){ return b.score-a.score; });
  return out.slice(0,10);
}
// Uplata istog datuma i iznosa vec je zabiljezena kao rata nekog racuna -> izvod je ne smije knjiziti drugi put
function pnVecEvidentirano(datum, iznosAbs){
  var dat=String(datum||'').split('.'); if(dat.length<2) return null;
  var kljuc=dat[0].replace(/^0/,'')+'.'+dat[1].replace(/^0/,'')+'.';
  var nadjen=null;
  pnSveStavke().forEach(function(st){
    if (nadjen) return;
    pnUplate(st.r).forEach(function(u){
      if (nadjen) return;
      var ud=String(u.d||'').split('.'); if(ud.length<2) return;
      var uk=ud[0].replace(/^0/,'')+'.'+ud[1].replace(/^0/,'')+'.';
      if (uk===kljuc && Math.abs((parseFloat(u.i)||0)-iznosAbs)<0.01) nadjen=st;
    });
  });
  return nadjen;
}
function pronadjiNeplacenuStavku(iznosAbs, opis){
  var k=pnKandidati(iznosAbs, opis);
  return (k.length && k[0].score>=75) ? k[0] : null;
}

      if (nep>0.01) out.push({kat:st.kat, katLbl:st.katLbl, mo:st.mo, ri:st.ri, r:r, iznos:Math.round(nep*100)/100, datum:pnUplate(r)[pnUplate(r).length-1].d});

  pnRateZbroj();

function cfCalcWeek() {
  var days=cfDays(), keys=days.map(cfKey);
  var vals={}; var tx={};
  CFL.forEach(function(l){ if(l.g==='h') return; vals[l.id]=[0,0,0,0,0,0,0]; tx[l.id]=[[],[],[],[],[],[],[]]; });

  CFL.forEach(function(l){
    if (l.g!=='in' && l.g!=='out') return;
    cfSrcZa(l).forEach(function(srcId){
      if (srcId==='__vending__') {
        // dnevna prodaja iz DAILY po tocnom datumu
        days.forEach(function(d,di){
          if (d.getFullYear()!==2026) return;
          var mo=d.getMonth(), day=d.getDate()-1;
          var _SVI=(typeof DAILY_UK!=='undefined' && DAILY_UK) ? DAILY_UK : DAILY;
          var v=parseFloat(_SVI[mo] && _SVI[mo][day]) || 0;
          if (v) { vals[l.id][di]+=v; tx[l.id][di].push({o:'Dnevna prodaja', a:v}); }
        });
        return;
      }
      var catTD=TD[srcId]; if(!catTD) return;
      for (var mo2=0;mo2<12;mo2++) {
        var rows=catTD[mo2]||[];
        for (var ri=0;ri<rows.length;ri++) {
          var r=rows[ri]; var a=parseFloat(r.iznos)||0; if(!a) continue;
          var upl=pnUplate(r);
          if (upl.length) {
            // Ra\u010dun pla\u0107en u ratama: svaka rata ulazi na svoj datum i sa svojim iznosom
            for (var ui=0; ui<upl.length; ui++) {
              var u=upl[ui]; if (!u.izv) continue;          // samo rate potvr\u0111ene izvodom
              var au=parseFloat(u.i)||0; if(!au) continue;
              var dtu=parseDMY(u.d); if(!dtu) continue;
              var diu=keys.indexOf(cfKey(dtu)); if(diu<0) continue;
              vals[l.id][diu]+=au;
              tx[l.id][diu].push({o:(r.tvrtka||'')+(upl.length>1?(' \u2014 '+(ui+1)+'. rata od '+upl.length):''), a:au});
            }
            continue;
          }
          if (!r.izvod) continue;                    // u nov\u010dani tijek ulazi samo ono \u0161to je potvr\u0111eno izvodom
          var dstr = r.placeno; if(!dstr) continue;
          var dt=parseDMY(dstr); if(!dt) continue;
          var k=cfKey(dt); var di=keys.indexOf(k); if(di<0) continue;
          vals[l.id][di]+=a;
          tx[l.id][di].push({o:r.tvrtka||'', a:a});
        }
      }
    });
  });

  // Ručne korekcije — ulaze samo u novčani tijek
  if (typeof CF_RUCNO!=='undefined') {
    cfRucnoZaTjedan(keys).forEach(function(x){
      var lid=x.r.linija||'cogs_ostali';
      if (!vals[lid]) return;
      var iz=Math.abs(parseFloat(x.r.iznos)||0); if(!iz) return;
      vals[lid][x.di]+=iz;
      tx[lid][x.di].push({o:(x.r.opis||'Ručna korekcija')+' · ručno', a:iz});
    });
  }

  var totIn=[0,0,0,0,0,0,0], totOut=[0,0,0,0,0,0,0];
  CFL.forEach(function(l){
    if (l.g==='in') for(var i=0;i<7;i++) totIn[i]+=vals[l.id][i];
    if (l.g==='out' && l.id!=='loan') for(var i2=0;i2<7;i2++) totOut[i2]+=vals[l.id][i2];
  });
  var net=[0,0,0,0,0,0,0];
  for (var i3=0;i3<7;i3++) net[i3]=totIn[i3]-totOut[i3]-vals.loan[i3];
  vals.net=net;

  var balKey='pn_cf_bal_'+keys[0];
  var savedBal=null;
  try { var sb=localStorage.getItem(balKey); if (sb!==null) savedBal=parseFloat(sb); } catch(e) {}
  var cur = savedBal;
  vals.bgn=[0,0,0,0,0,0,0]; vals.end=[0,0,0,0,0,0,0];
  for (var i4=0;i4<7;i4++) {
    if (cur===null||isNaN(cur)) { vals.bgn[i4]=null; vals.end[i4]=null; }
    else { vals.bgn[i4]=cur; cur=cur+net[i4]; vals.end[i4]=cur; }
  }
  return {vals:vals, tx:tx, days:days, totIn:totIn, totOut:totOut, savedBal:savedBal};
}

function cfSetBalance(val) {
  var days=cfDays(); var keys=days.map(cfKey);
  var balKey='pn_cf_bal_'+keys[0];
  try { localStorage.setItem(balKey, val); } catch(e) {}
  renderCashflow();
}

function cfGradiRedove() {
  var R=cfCalcWeek(), V=R.vals, days=R.days;
  var DAYN=['PON','UTO','SRI','\u010cET','PET','SUB','NED'];
  var rows=[['Redak'].concat(days.map(function(d,i){return DAYN[i]+' '+d.getDate()+'.'+(d.getMonth()+1)+'.';})).concat(['UKUPNO'])];
  CFL.forEach(function(l){
    if (l.g==='h') { rows.push([l.l]); return; }
    var v=V[l.id]||[0,0,0,0,0,0,0];
    var tot = l.g==='b' ? '' : v.reduce(function(a,b){return a+(b||0);},0);
    rows.push([l.l].concat(v.map(function(x){return x==null?'':fmt2(x);})).concat([tot===''?'':fmt2(tot)]));
  });
  return rows;
}
function cfKopirajExcel() {
  var rows=cfGradiRedove();
  var tsv=rows.map(function(r){return r.join('\t');}).join('\n');
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(tsv).then(function(){ showToastPn('\u2713 Kopirano u me\u0111uspremnik'); }).catch(function(){ cfFallbackCopy(tsv); });
  } else { cfFallbackCopy(tsv); }
}
function cfFallbackCopy(text) {
  var ta=document.createElement('textarea'); ta.value=text; ta.style.position='fixed'; ta.style.left='-9999px';
  document.body.appendChild(ta); ta.select();
  try { document.execCommand('copy'); showToastPn('\u2713 Kopirano u me\u0111uspremnik'); } catch(e) { alert('Kopiranje nije uspjelo.'); }
  document.body.removeChild(ta);
}
function showToastPn(msg) {
  var t=document.createElement('div'); t.textContent=msg;
  t.style.cssText='position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--nav-900);color:#fff;padding:9px 18px;border-radius:9px;font-size:12px;z-index:3000;box-shadow:0 8px 24px rgba(0,0,0,.25)';
  document.body.appendChild(t);
  setTimeout(function(){ t.remove(); }, 2000);
}
function cfPreuzmiExcel() {
  var rows=cfGradiRedove();
  var wb=XLSX.utils.book_new();
  var ws=XLSX.utils.aoa_to_sheet(rows);
  ws['!cols']=rows[0].map(function(){return {wch:14};});
  XLSX.utils.book_append_sheet(wb, ws, 'Cash flow '+cfLabel().slice(0,20));
  XLSX.writeFile(wb, 'CashFlow_'+cfDays()[0].toISOString().slice(0,10)+'.xlsx');
}

  h+='<input type="text" id="cfBalInp" value="'+(R.savedBal!==null&&!isNaN(R.savedBal)?fmt2(R.savedBal):'')+'" placeholder="npr. 21.299,65" style="width:200px;padding:6px 9px;border:1px solid var(--sep);border-radius:8px;font-size:12px" onblur="cfSetBalance(parseHR(this.value))">';

function getISOWeek(date) {
  var d=new Date(Date.UTC(date.getFullYear(),date.getMonth(),date.getDate()));
  var dayNum=(d.getUTCDay()+6)%7;
  d.setUTCDate(d.getUTCDate()-dayNum+3);
  var firstThu=new Date(Date.UTC(d.getUTCFullYear(),0,4));
  var diff = (d - firstThu)/86400000;
  return 1 + Math.round(diff/7);
}

var PDF_ROWS = [];

function handlePdfUpload(inp) {
  var file=inp.files[0]; if(!file) return;
  var status=document.getElementById('pdfStatus');
  status.textContent='Učitavanje...';
  var reader=new FileReader();
  reader.onload=function(e){
    var typedarray=new Uint8Array(e.target.result);
    pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    pdfjsLib.getDocument(typedarray).promise.then(function(pdf){
      var pagePromises=[];
      for (var p=1;p<=pdf.numPages;p++) {
        pagePromises.push(pdf.getPage(p).then(function(page){
          return page.getTextContent().then(function(tc){
            return pdfItemsToLines(tc.items);
          });
        }));
      }
      Promise.all(pagePromises).then(function(pages){
        var allText = pages.join('\n');
        parsePdfIzvod(allText);
        status.textContent='✓ Učitano '+pdf.numPages+' str.';
      });
    }).catch(function(err){
      status.textContent='⚠ Greška: '+err.message;
    });
  };
  reader.readAsArrayBuffer(file);
}

// Grupira PDF.js text iteme u prave retke prema Y-poziciji (umjesto spajanja svega u jedan dugacki red)
function pdfItemsToLines(items) {
  var words = items.map(function(it){
    var y = it.transform ? it.transform[5] : 0;
    return {text: it.str, y: y};
  }).filter(function(w){ return w.text && w.text.trim().length>0; });
  if (!words.length) return '';
  words.sort(function(a,b){ return b.y - a.y; });
  var lines=[]; var cur=[words[0]];
  for (var i=1;i<words.length;i++) {
    if (Math.abs(words[i].y - cur[cur.length-1].y) > 2.5) {
      lines.push(cur.map(function(w){return w.text;}).join(' '));
      cur=[words[i]];
    } else {
      cur.push(words[i]);
    }
  }
  lines.push(cur.map(function(w){return w.text;}).join(' '));
  return lines.join('\n');
}

// ── Knjigovodstvena pravila (partner -> kategorija), uci se iz korisnickih ispravaka ──
var PN_RULES = (function(){
  try { var s=localStorage.getItem('pn_rules'); if(s) return JSON.parse(s); } catch(e) {}
  return [];
})();
function savePnRules() { try { localStorage.setItem('pn_rules', JSON.stringify(PN_RULES)); } catch(e) {} }
function pravioZaPartnera(opis) {
  var o=(opis||'').toLowerCase();
  for (var i=0;i<PN_RULES.length;i++) {
    if (o.indexOf(PN_RULES[i].partner.toLowerCase())>=0) return PN_RULES[i].kat;
  }
  return null;
}
function zapamtiPravilo(opis, kat) {
  if (!opis || !kat) return;
  var partner = opis.split(/\s{2,}/)[0].split(' ').slice(0,3).join(' ').trim();
  if (!partner) return;
  var existing = PN_RULES.filter(function(r){ return r.partner.toLowerCase()===partner.toLowerCase(); })[0];
  if (existing) existing.kat = kat;
  else PN_RULES.push({partner:partner, kat:kat});
  savePnRules();
}

var PDF_SALDO_INFO = null; // {pocetno, zavrsno, nalogaTeret, nalogaKorist} zadnje ucitanog izvoda

function izvuciSaldoInfo(text) {
  var info = {pocetno:null, zavrsno:null, nalogaTeret:null, nalogaKorist:null};
  var m1 = text.match(/Po\u010detno stanje:?\s*(-?\d{1,3}(?:\.\d{3})*,\d{2})/i);
  if (m1) info.pocetno = m1[1];
  var m2 = text.match(/Kona\u010dno stanje:?\s*(-?\d{1,3}(?:\.\d{3})*,\d{2})/i);
  if (m2) info.zavrsno = m2[1];
  var m3 = text.match(/Naloga na teret\s*(\d+)/i);
  if (m3) info.nalogaTeret = parseInt(m3[1],10);
  var m4 = text.match(/Naloga u korist\s*(\d+)/i);
  if (m4) info.nalogaKorist = parseInt(m4[1],10);
  return info;
}

function parsePdfIzvod(text) {
  PDF_SALDO_INFO = izvuciSaldoInfo(text);

  var lines = text.split(/\n/);
  var dateRe = /(\d{2}\.\d{2}\.\d{4})\.?/;
  var amtRe = /(-?\d{1,3}(?:\.\d{3})*,\d{2})(?!.*\d{1,3}(?:\.\d{3})*,\d{2})/;
  // Retci koji spominju stanje racuna (pocetno/konacno/prethodno/privremeno/raspolozivo) NISU transakcije - iskljuci ih
  var stanjeRe = /po\u010detno stanje|kona\u010dno stanje|prethodno stanje|privremeno stanje|raspolo\u017eivo stanje|stanje na dan|s\s*t\s*a\s*n\s*j\s*e|rekapitulacija/i;

  PDF_ROWS = [];
  var vidjeniRedci = {}; // sprijeci duplo hvatanje istog retka (npr. Datum valute + Datum obrade su isti redak, prikazuju se dvaput ako format ima ponovljene datume)

  for (var i=0;i<lines.length;i++) {
    var ln=lines[i].trim(); if(!ln) continue;
    if (stanjeRe.test(ln)) continue;
    var dM=ln.match(dateRe); if(!dM) continue;
    var aM=ln.match(amtRe); if(!aM) continue;
    var amtStr=aM[1].replace(/\./g,'').replace(',','.');
    var amtAbs=Math.abs(parseFloat(amtStr)); if(isNaN(amtAbs)||amtAbs===0) continue;

    var opis=ln.replace(dM[0],'').replace(aM[1],'').replace(/\s+/g,' ').trim();
    // Odbaci retke koji su samo IBAN/referenca (nastavak prethodnog retka transakcije, nemaju stvarni opis partnera)
    if (/^HR\d{2}\s|^\d{4}-\d|^HR\d{2}\s*\d/.test(opis) && opis.replace(/[\d\sHRhr\-]/g,'').length<3) continue;
    if (opis.length>70) opis=opis.slice(0,70);

    var kljuc = dM[1]+'|'+amtAbs+'|'+opis.slice(0,20);
    if (vidjeniRedci[kljuc]) continue;
    vidjeniRedci[kljuc]=true;

    // Odredi smjer (prihod/rashod): ako izvod ima SAMO isplate (naloga u korist=0) ili SAMO uplate (naloga na teret=0),
    // sve prepoznate stavke sigurno idu u taj smjer. Inace (miješano), zadano je rashod uz mogucnost rucne izmjene.
    var predznak = -1; // zadano: rashod
    if (PDF_SALDO_INFO.nalogaTeret===0 && PDF_SALDO_INFO.nalogaKorist>0) predznak = 1;
    else if (PDF_SALDO_INFO.nalogaKorist===0 && PDF_SALDO_INFO.nalogaTeret>0) predznak = -1;
    var amt = amtAbs * predznak;

    var naucenaKat = pravioZaPartnera(opis);
    var kat = naucenaKat || (amt<0 ? 'razno' : 'prihodi26');
    var kandidati = pnKandidati(amtAbs, opis);
    var podudaranje = (kandidati.length && kandidati[0].score>=75) ? kandidati[0] : null;
    var _p={datum:dM[1], opis:opis||'(bez opisa)', iznos:amt};
    var _evid = pnVecEvidentirano(dM[1], amtAbs);
    var vecKnjizeno = (IZVOD_POTPISI.indexOf(pnPotpisIzvoda(_p))>=0) || !!_evid;
    var _evidOpis = _evid ? ('već evidentirano kao rata: '+String(_evid.r.tvrtka||'').slice(0,46)) : '';
    var _mo=parseInt(String(dM[1]).split('.')[1],10)-1; if (isNaN(_mo)||_mo<0||_mo>11) _mo=new Date().getMonth();
    PDF_ROWS.push({
      datum:dM[1], opis:opis||'(bez opisa)', iznos:amt, kat:kat, naucenaKat:!!naucenaKat,
      kandidati:kandidati, vecKnjizeno:vecKnjizeno, mjesec:(podudaranje?_mo:_mo),
      akcija: vecKnjizeno ? 'preskoci' : (podudaranje ? 'upari' : 'nova'),
      cilj: podudaranje ? {kat:podudaranje.kat, mo:podudaranje.mo, ri:podudaranje.ri} : null,
      podudaranjeRazlog: podudaranje ? podudaranje.razlog : '',
      vecRazlog: _evidOpis,
      ukljuci:true, dupliciran:false, podudaranje:podudaranje
    });
  }
  renderPdfPreview();
}

function pdvIzvodProvjeriDuplikat(datumDDMMYYYY, iznosAbs, opis) {
  var parts=datumDDMMYYYY.split('.'); var mo=parseInt(parts[1],10)-1;
  var KNOWN_NON_TRANS_LOCAL=['dash','rdg','ceo','alerts','postavke','radni_sati'];
  var cats = ALL_TABS.filter(function(t){ return KNOWN_NON_TRANS_LOCAL.indexOf(t.id)===-1; });
  for (var ci=0;ci<cats.length;ci++) {
    var catId=cats[ci].id;
    if (!TD[catId] || !TD[catId][mo]) continue;
    var rows=TD[catId][mo];
    for (var ri=0;ri<rows.length;ri++) {
      var r=rows[ri];
      // vec placeni redak, isti mjesec, isti iznos = vjerojatno vec zabiljezeno (bilo ranije uvezeno ili rucno oznaceno)
      if (r.placeno && Math.abs((parseFloat(r.iznos)||0)-iznosAbs)<0.01 && r.datum===parts[0]+'.'+parts[1]+'.') return true;
    }
  }
  return false;
}

        var vr='u:'+k.kat+'|'+k.mo+'|'+k.ri;
        var odabran=(r.akcija==='upari' && r.cilj && r.cilj.kat===k.kat && r.cilj.mo===k.mo && r.cilj.ri===k.ri);
        h+='<option value="'+vr+'"'+(odabran?' selected':'')+'>'+String(k.r.tvrtka||'—').slice(0,44)+' · '+MNAMES[k.mo]+(k.ostatak>0.01?(' · ostaje '+fmt2(k.ostatak)):'')+'</option>';
      }
      h+='</optgroup>';
    }
    if (r.akcija==='upari' && r.cilj && !(r.kandidati||[]).some(function(k){return k.kat===r.cilj.kat&&k.mo===r.cilj.mo&&k.ri===r.cilj.ri;})) {
      h+='<option value="u:'+r.cilj.kat+'|'+r.cilj.mo+'|'+r.cilj.ri+'" selected>'+pnOznakaCilja(r.cilj).slice(0,60)+'</option>';
    }
    h+='<option value="trazi">Potraži račun…</option>';
    h+='<option value="preskoci"'+(presk?' selected':'')+'>Preskoči</option>';
    h+='</select></td>';

    // DETALJI
    h+='<td style="padding:2px 3px;font-size:11px">';
    if (r.akcija==='upari' && r.cilj) {
      h+='<span style="color:var(--nav-600);font-weight:600">'+pnOznakaCilja(r.cilj)+'</span>';
      if (r.podudaranjeRazlog) h+='<br><span style="color:var(--label3);font-size:10px">prepoznato po: '+r.podudaranjeRazlog+'</span>';
    } else if (r.akcija==='nova') {
      h+='<div style="display:flex;gap:5px;align-items:center;flex-wrap:wrap">';
      h+='<select class="pdfKat" data-i="'+i+'" style="font-size:11px;padding:3px 4px;border-radius:7px;border:1px solid var(--sep);background:var(--surface);color:var(--nav-600);font-weight:600">'+pnKatOpcije(r.kat)+'</select>';
      h+='<select class="pdfMo" data-i="'+i+'" style="font-size:11px;padding:3px 4px;border-radius:7px;border:1px solid var(--sep);background:var(--surface);color:var(--label2)">'+pnMjesecOpcije(r.mjesec)+'</select>';
      h+='</div>';
      if (r.naucenaKat) h+='<span style="color:var(--nav-500);font-size:10px;font-weight:600">&#10003; kategorija zapamćena od prije</span>';
    } else {
      h+='<span style="color:var(--label3)">ne knjiži se</span>';
    }
    h+='</td>';
    h+='<td style="padding:2px 3px;text-align:center"><button class="del-btn" onclick="PDF_ROWS.splice('+i+',1);renderPdfPreview();">&times;</button></td>';
    h+='</tr>';
  }
  h+='</tbody></table></div>';

  h+='<div style="display:flex;justify-content:flex-end;gap:8px;margin-top:16px">';
  h+='<button class="hbtn" onclick="PDF_ROWS=[];renderPdfPreview();document.getElementById(\'pdfStatus\').textContent=\'\';">Odustani</button>';
  h+='<button class="hbtn" style="background:var(--green);color:#fff" onclick="potvrdiPdfUvoz()">&#10003; Proknjiži ('+(nNova+nUpari)+')</button>';
  h+='</div></div>';

  wrap.innerHTML=saldoHtml+h;

  wrap.querySelectorAll('.pdfAkc').forEach(function(sel){
    sel.addEventListener('change', function(){
      var i=parseInt(this.dataset.i,10), v=this.value, r=PDF_ROWS[i];
      if (v==='nova') { r.akcija='nova'; r.cilj=null; }
      else if (v==='preskoci') { r.akcija='preskoci'; r.cilj=null; }
      else if (v==='trazi') { pnTraziRacun(i); return; }
      else if (v.indexOf('u:')===0) {
        var p=v.slice(2).split('|');
        r.akcija='upari'; r.cilj={kat:p[0], mo:parseInt(p[1],10), ri:parseInt(p[2],10)};
      }
      renderPdfPreview();
    });
  });
  wrap.querySelectorAll('.pdfKat').forEach(function(sel){
    sel.addEventListener('change', function(){
      var i=parseInt(this.dataset.i,10);
      PDF_ROWS[i].kat=this.value;
      zapamtiPravilo(PDF_ROWS[i].opis, this.value);
      renderPdfPreview();
    });
  });
  wrap.querySelectorAll('.pdfMo').forEach(function(sel){
    sel.addEventListener('change', function(){
      PDF_ROWS[parseInt(this.dataset.i,10)].mjesec=parseInt(this.value,10);
      renderPdfPreview();
    });
  });
}

// ── Pretraživanje svih računa (kad automatika ne pronađe pravi) ──
var PN_TRAZI_I=null;
function pnTraziRacun(i){
  PN_TRAZI_I=i;
  var r=PDF_ROWS[i];
  var h='<div class="rsf-head"><div><div class="rsf-kicker">Redak iz izvoda</div><div class="rsf-title">Potraži račun</div></div></div>';
  h+='<div class="rsf-hero" style="background:linear-gradient(135deg,#ff9500,#ff6a00)"><div class="rsf-hero-t"><div class="rsf-hero-n">'+
     String(r.opis||'').replace(/</g,'&lt;').slice(0,70)+'</div><div class="rsf-hero-time">'+fmt2(Math.abs(r.iznos))+' EUR</div></div>'+
     '<span class="rsf-pill">'+r.datum+'</span></div>';
  h+='<div class="rsf-body"><div class="rsf-cap">Tražilica</div>';
  h+='<div class="rsf-group"><div class="rsf-row"><input type="text" id="pnTraziQ" placeholder="upišite dio naziva ili broj računa…" style="width:100%;text-align:left;max-width:none"></div></div>';
  h+='<div class="rsf-cap">Rezultati</div><div class="rsf-group" id="pnTraziLista"></div></div>';
  h+='<div class="rsf-actions"><button type="button" class="rsf-btn ghost" onclick="closeModal()">Odustani</button></div>';
  rsfOtvori(h);
  var q=document.getElementById('pnTraziQ');
  q.addEventListener('input', pnTraziCrtaj);
  pnTraziCrtaj();
  setTimeout(function(){ q.focus(); },60);
}
function pnTraziCrtaj(){
  var el=document.getElementById('pnTraziLista'); if(!el) return;
  var q=((document.getElementById('pnTraziQ')||{}).value||'').toLowerCase().trim();
  var r=PDF_ROWS[PN_TRAZI_I];
  var sve=pnSveStavke();
  var lista = q
    ? sve.filter(function(s){ return String(s.r.tvrtka||'').toLowerCase().indexOf(q)>=0; })
    : pnKandidati(Math.abs(r.iznos), r.opis);
  lista=lista.slice(0,40);
  if (!lista.length) { el.innerHTML='<div class="rsf-row" style="color:var(--rsf-t3);font-size:14px">Nema rezultata</div>'; return; }
  el.innerHTML=lista.map(function(s){
    var ost=pnOstatak(s.r);
    return '<button type="button" class="rsf-row" style="width:100%;border:none;background:none;text-align:left;cursor:pointer" '+
      'onclick="pnTraziOdaberi(\''+s.kat+'\','+s.mo+','+s.ri+')">'+
      '<span class="rsf-ri" style="background:'+(ost>0.01?'#ff9500':'#34c759')+'">'+(ost>0.01?'!':'✓')+'</span>'+
      '<span class="rsf-rl" style="white-space:normal;font-size:14px">'+String(s.r.tvrtka||'—').slice(0,60)+
        '<br><span style="font-size:11.5px;color:var(--rsf-t3)">'+(s.katLbl||s.kat)+' · '+MNAMES[s.mo]+' · '+fmt2(parseFloat(s.r.iznos)||0)+' EUR'+
        (ost>0.01?(' · ostaje '+fmt2(ost)):' · zatvoren')+'</span></span></button>';
  }).join('');
}
function pnTraziOdaberi(kat,mo,ri){
  var r=PDF_ROWS[PN_TRAZI_I];
  r.akcija='upari'; r.cilj={kat:kat, mo:mo, ri:ri}; r.podudaranjeRazlog='ručni odabir';
  closeModal();
  renderPdfPreview();
}

function potvrdiPdfUvoz() {
  var nNovih=0, nUsklad=0, greske=[];
  for (var i=0;i<PDF_ROWS.length;i++) {
    var r=PDF_ROWS[i];
    if (r.akcija==='preskoci') continue;
    var parts=String(r.datum||'').split('.');
    var dat=parts[0]+'.'+parts[1]+'.';
    var moIzvod=parseInt(parts[1],10)-1;

    if (r.akcija==='upari' && r.cilj) {
      var c=r.cilj;
      var t=(TD[c.kat]&&TD[c.kat][c.mo]&&TD[c.kat][c.mo][c.ri]);
      if (!t) { greske.push(r.opis); continue; }
      pnDodajUplatu(t, dat, Math.abs(r.iznos), true, r.opis);
      syncTDtoP(c.kat);
      nUsklad++;
      pnZapamtiPotpis(pnPotpisIzvoda(r));
      continue;
    }

    var kat=r.kat, mo=(r.mjesec!=null && r.mjesec>=0 && r.mjesec<12) ? r.mjesec : moIzvod;
    if (!TD[kat]) { TD[kat]=[]; for (var m2=0;m2<12;m2++) TD[kat].push([]); }
    if (!TD[kat][mo]) TD[kat][mo]=[];
    TD[kat][mo].push({
      datum:dat, iznos:Math.abs(r.iznos), tvrtka:r.opis, vpl:'', placeno:dat, izvod:1,
      uplate:[{d:dat, i:Math.abs(r.iznos), izv:1, ref:r.opis}]
    });
    syncTDtoP(kat);
    nNovih++;
    pnZapamtiPotpis(pnPotpisIzvoda(r));
  }
  saveAll();
  PDF_ROWS=[];
  var pw=document.getElementById('pdfPreviewWrap'); if (pw) pw.innerHTML='';
  var ps=document.getElementById('pdfStatus'); if (ps) ps.textContent='';
  var poruka='Proknjiženo: '+nNovih+' novih stavki';
  if (nUsklad) poruka+=', '+nUsklad+' uplata pripisano postojećim računima';
  if (greske.length) poruka+='\n\nNije proknjiženo ('+greske.length+') — odabrani račun više ne postoji.';
  pnAlert('✓ '+poruka, {title:'Izvod proknjižen'});
  renderRDG();
  if (typeof renderNav==='function') renderNav();
}

// TRANSAKCIJE / ULAZNI RAČUNI / IZLAZNI RAČUNI (chip hub)
// ═══════════════════════════════════════════
var KNOWN_NON_TRANS=['dash','rdg','ceo','alerts','postavke','radni_sati'];
function renderChipHub(targetId, catIds, title, hint) {
  var el=document.getElementById('tab-'+targetId); if(!el) return;
  var h='<div class="sec-title">'+title+'</div>';
  if (hint) h+='<div style="font-size:12px;color:var(--label3);margin-bottom:14px">'+hint+'</div>';
  h+='<div class="chips">';
  for (var i=0;i<catIds.length;i++) {
    var t=ALL_TABS.filter(function(x){return x.id===catIds[i];})[0];
    if (!t) continue;
    h+='<div class="chip" data-goto="'+t.id+'" style="border-color:'+(TC[t.id]||'#4a72ab')+'33"><span class="c" style="color:'+(TC[t.id]||'#4a72ab')+'">&#9679;</span>'+t.lbl+'</div>';
  }
  h+='</div>';
  el.innerHTML=h;
  el.querySelectorAll('.chip').forEach(function(ch){
    ch.addEventListener('click', function(){ switchTab(this.dataset.goto); });
  });
}
function renderTransakcije() {
  var cats = ALL_TABS.filter(function(t){ return KNOWN_NON_TRANS.indexOf(t.id)===-1; }).map(function(t){return t.id;});
  renderChipHub('transakcije', cats, 'Transakcije — sve kategorije', 'Odaberite kategoriju za detaljan unos i pregled transakcija.');
}

function apZbrojArtikala(){
  var out={};
  for (var ap in DAILY_ART_AP) {
    var d=DAILY_ART_AP[ap]; if(!d) continue;

      if (!out[mo]) out[mo]={};
      for (var dd in d[mo]) {

          out[mo][dd][an][0]+=arts[an][0]||0;

        }
      }
    }
  }
  return out;
}

  for (var mo in art) {
    var mi=parseInt(mo,10); if(isNaN(mi)||mi<0||mi>11) continue;
    for (var dd in art[mo]) {
      var di=parseInt(dd,10)-1; if(isNaN(di)||di<0||di>30) continue;
      var s=0, a=art[mo][dd];
      for (var an in a) s+=a[an][1]||0;
      d[mi][di]=Math.round(s*100)/100;
    }
  }
  return d;
}

function ocistiDuplikateArtikala() {
  // Sigurna, redoslijed-neovisna verzija: za svaki dan gradi POTPUNO NOVI objekt
  // zbrajajuci sve varijante istog naziva (case-insensitive) u kanonski oblik.
  // Ovo garantirano ne gubi podatke, bez obzira kojim redom se kljucevi obrade.
  var canonMap = {};
  CRM_ARTIKLI.forEach(function(a){ canonMap[a.name.toLowerCase()] = pnSluzbeniNaziv(a.name); });
  SLUZBENI_ARTIKLI.forEach(function(n){ canonMap[n.toLowerCase()] = n; });
  var spojeno = 0, primjeriSpajanja = [];
  var ukupnoPrije = 0, ukupnoPoslije = 0;

  for (var mo in DAILY_ARTIKLI) {
    for (var dd in DAILY_ARTIKLI[mo]) {
      var arts = DAILY_ARTIKLI[mo][dd];
      var staroKljuceva = Object.keys(arts).length;
      var novi = {};
      Object.keys(arts).forEach(function(k){
        ukupnoPrije += arts[k][1];
        var lower = k.toLowerCase();
        var canon = canonMap[lower] || k;
        if (canon !== k && primjeriSpajanja.indexOf(k+' \u2192 '+canon)<0) {
          primjeriSpajanja.push(k+' \u2192 '+canon);
        }
        if (!novi[canon]) novi[canon] = [0, 0];
        novi[canon][0] += arts[k][0];
        novi[canon][1] = Math.round((novi[canon][1] + arts[k][1]) * 100) / 100;
      });
      var novoKljuceva = Object.keys(novi).length;
      if (novoKljuceva < staroKljuceva) spojeno += (staroKljuceva - novoKljuceva);
      Object.keys(novi).forEach(function(k){ ukupnoPoslije += novi[k][1]; });
      DAILY_ARTIKLI[mo][dd] = novi;
    }
  }

  if (spojeno===0) {
    alert('Nema duplikata za spajanje \u2014 svi nazivi artikala su ve\u0107 usugla\u0161eni.');
    return;
  }
  saveDailyArtikliAndSync();
  buildArtikliChart();
  if (typeof renderPrihodiEvidencija==='function' && activeTab==='izlazni_prihodi') renderPrihodiEvidencija();

function artColor(name) {
  var c=pnSluzbeniNaziv(name);
  var idx = SLUZBENI_ARTIKLI.indexOf(c);
  if (idx<0) { idx = CRM_ARTIKLI.map(function(a){return pnSluzbeniNaziv(a.name);}).indexOf(c); if (idx>=0) idx+=SLUZBENI_ARTIKLI.length; }
  if (idx<0) { var h=0; String(c).split('').forEach(function(ch){h=(h*31+ch.charCodeAt(0))>>>0;}); idx=h; }
  return ARTIKLI_COLORS[idx % ARTIKLI_COLORS.length];
}

function toggleMonthPrih(key) { EXPANDED_MONTHS[key]=!EXPANDED_MONTHS[key]; renderPrihodiEvidencija(); }
function toggleDayPrih(key) { EXPANDED_DAYS[key]=!EXPANDED_DAYS[key]; renderPrihodiEvidencija(); }



function exportPrihodiCSV() {
  var rows=[['Datum','Artikl','Kom','Iznos EUR']];
  Object.keys(DAILY_ARTIKLI).forEach(function(m){
    Object.keys(DAILY_ARTIKLI[m]).forEach(function(d){
      Object.keys(DAILY_ARTIKLI[m][d]).forEach(function(an){
        var v=DAILY_ARTIKLI[m][d][an];
        rows.push([String(d).padStart(2,'0')+'.'+String(parseInt(m,10)+1).padStart(2,'0')+'.2026.', an, v[0], v[1]]);
      });
    });
  });
  var csv=rows.map(function(r){return r.join(';');}).join('\n');
  var blob=new Blob(['\uFEFF'+csv],{type:'text/csv;charset=utf-8'});
  var a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='prihodi_evidencija.csv';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
}

function zapChip(btn, hiddenId){
  var on=btn.classList.contains('on');

  var h=document.getElementById(hiddenId); if(h) h.value = on ? '' : btn.getAttribute('data-v');

}

  var greska=function(t){ if(err){ err.textContent=t; err.style.display='block'; } };
  if (!ime1) { greska('Upi\u0161ite ime djelatnika.'); document.getElementById('zapIme').focus(); return; }

  if (oib && !/^\d{11}$/.test(oib)) { greska('OIB mora imati to\u010dno 11 znamenki.'); document.getElementById('zapOib').focus(); return; }

  if (dup) { greska('Djelatnik s tim imenom ve\u0107 postoji.'); return; }

            satnica:g('zapSatnica'), tel:g('zapTel'), email:g('zapEmail'), nap:g('zapNap')};
  if (idx===null || idx===undefined) {
    ZAPOSLENICI.push(puno);
  } else {
    var staro=ZAPOSLENICI[idx];
    if (staro!==puno) {
      DJELATNICI_SATI.forEach(function(e){ if(e.ime===staro) e.ime=puno; });
      delete ZAP_INFO[staro];
      saveDjelSatiAndSync();
    }
    ZAPOSLENICI[idx]=puno;
  }
  ZAP_INFO[puno]=info;
  saveZaposlenici();
  closeModal();
  renderZaposlenici();
}

function ocrRacunajSate() {
  var pEl=document.getElementById('mSatiPocetak'), zEl=document.getElementById('mSatiZavrsetak'), pzEl=document.getElementById('mSatiPauza'), bEl=document.getElementById('mSatiBroj');
  if (!pEl || !zEl || !bEl) return;
  var p=pEl.value, z=zEl.value;
  if (!p || !z) { if (typeof rsOsvjeziHero==='function') rsOsvjeziHero(); return; }
  var pMin=parseInt(p.split(':')[0],10)*60+parseInt(p.split(':')[1],10);
  var zMin=parseInt(z.split(':')[0],10)*60+parseInt(z.split(':')[1],10);
  var diffMin=zMin-pMin;
  if (diffMin<0) diffMin+=24*60; // rad preko ponoci
  var pauza=parseInt((pzEl&&pzEl.value)||0,10)||0;
  var sati=Math.max(0, (diffMin-pauza)/60);
  bEl.value = Math.round(sati*100)/100;
  if (typeof rsOsvjeziHero==='function') rsOsvjeziHero();
}

// ── KONTEKSTUALNI EXPORT (CSV/Excel/PDF za trenutno otvoreni folder) ──
function currentTabLabel() {
  var t=ALL_TABS.filter(function(x){return x.id===activeTab;})[0];
  if (t) return t.lbl;
  var n=NAV.filter(function(x){return x.id===activeTab;})[0];
  return n ? n.l : activeTab;
}
function scrapeActiveTable() {
  // Radni sati koristi kalendar (div grid), nema <table> - gradimo redove izravno iz podataka
  if (activeTab==='radni_sati') {
    var rowsRS=[['Datum','Zaposlenik','Radno mjesto','Po\u010detak','Zavr\u0161etak','Pauza (min)','Vrsta unosa','Sati','Napomena']];
    var sortedSati = DJELATNICI_SATI.slice().sort(function(a,b){ return (a.datum||'').localeCompare(b.datum||''); });
    sortedSati.forEach(function(e){
      rowsRS.push([e.datum||'', e.ime||'', e.pozicija||'', e.pocetak||'', e.zavrsetak||'', (e.pauza!=null?e.pauza:''), e.vrsta||'', e.sati, e.nap||'']);
    });
    return rowsRS.length>1 ? rowsRS : null;
  }
  var pane=document.getElementById('tab-'+activeTab); if (!pane) return null;
  var table=pane.querySelector('table'); if (!table) return null;
  var rows=[];
  table.querySelectorAll('tr').forEach(function(tr){
    var row=[];
    tr.querySelectorAll('th,td').forEach(function(cell){
      var inp=cell.querySelector('input,select');
      var txt = inp ? inp.value : cell.textContent.replace(/\s+/g,' ').trim();
      row.push(txt);
    });
    if (row.length) rows.push(row);
  });
  return rows.length ? rows : null;
}
function exportViewCSV() {
  if (activeTab==='rdg') {
    var c26=calc26();
    var rows=[['Stavka'].concat(MONTHS).concat(['TOTAL'])];
    rows.push(['PRIHODI'].concat(c26.prihodi.map(fmt2)).concat([fmt2(sumA(c26.prihodi))]));
    rows.push(['RASHODI'].concat(c26.rashodi.map(fmt2)).concat([fmt2(sumA(c26.rashodi))]));
    rows.push(['DOBIT'].concat(c26.dobit.map(fmt2)).concat([fmt2(sumA(c26.dobit))]));
    downloadCSV(rows, 'RDG_2026');
    return;
  }
  var data=scrapeActiveTable();
  if (!data) { alert('Nema tablice za izvoz na ovoj stranici.'); return; }
  downloadCSV(data, izvIme(currentTabLabel()));
}
function downloadCSV(rows, filename) {
  var csv=rows.map(function(r){ return r.map(function(v){ v=String(v==null?'':v); return /[;\n"]/.test(v) ? '"'+v.replace(/"/g,'""')+'"' : v; }).join(';'); }).join('\n');
  var blob=new Blob(['\uFEFF'+csv],{type:'text/csv;charset=utf-8'});
  var a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=filename+'.csv';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
}
function exportViewExcel() {
  if (activeTab==='rdg') { exportExcel(); return; }
  if (activeTab==='radni_sati') { exportRadniSatiXLSX(); return; }
  var data=scrapeActiveTable();
  if (!data) { alert('Nema tablice za izvoz na ovoj stranici.'); return; }
  var wb=XLSX.utils.book_new();

var PDV_STOPA = 0.25; // standardna hrvatska stopa PDV-a 25%
// Kategorije koje ULAZE u osnovicu za pretporez (imaju PDV na računu)
var PDV_ULAZNE_KAT = ['knjigovodstvo','nabava_proteina','nabava_casa','telefon','internet','razno'];

function pdvCalcMonthly() {
  var out=[];
  for (var m=0; m<12; m++) {
    var prihodBruto = (parseFloat((P.prihodi_grupe&&P.prihodi_grupe[m])||0)) + (parseFloat((P.prihodi_vending&&P.prihodi_vending[m])||0));
    var izlOsn = prihodBruto>0 ? prihodBruto/(1+PDV_STOPA) : 0;
    var izlPdv = prihodBruto - izlOsn;

    var ulazBruto=0;
    PDV_ULAZNE_KAT.forEach(function(catId){
      var rowKey=TAB_TO_P[catId]; if(!rowKey || !P[rowKey]) return;
      ulazBruto += parseFloat(P[rowKey][m])||0;
    });
    var ulOsn = ulazBruto>0 ? ulazBruto/(1+PDV_STOPA) : 0;
    var ulPdv = ulazBruto - ulOsn;

    var razlika = izlPdv - ulPdv;
    out.push({m:m, izlOsn:izlOsn, izlPdv:izlPdv, ulOsn:ulOsn, ulPdv:ulPdv, razlika:razlika, prihodBruto:prihodBruto, ulazBruto:ulazBruto});
  }
  return out;
}
function pdvRok(m) {
  // Rok uplate: zadnji dan mjeseca nakon obračunskog razdoblja
  var d=new Date(2026, m+2, 0);
  return String(d.getDate()).padStart(2,'0')+'.'+String(d.getMonth()+1).padStart(2,'0')+'.2026.';
}

// ── UVOZ SLIKE (OCR) ── prepoznavanje tablice prodaje iz screenshota vending platforme
var OCR_ROWS = [];
function unosIzSlike() {
  if (!apZaUnos()) { apTraziOdabir(); return; }
  window.EXCEL_SUGGESTED_DATE=null; window.EXCEL_RANGE_WARNING=null;
  var inp=document.createElement('input');
  inp.type='file'; inp.accept='image/*';
  inp.style.cssText='position:fixed;left:-9999px;top:-9999px;opacity:0';
  inp.onchange=function(e){
    var file=e.target.files[0];
    document.body.removeChild(inp);
    if(!file) return;
    ocrProcessImage(file);
  };
  document.body.appendChild(inp);
  inp.click();
}

function ocrProcessImage(file) {
  var loadingHtml='<div style="padding:30px 22px;text-align:center">' +
    '<div style="font-size:14px;font-weight:700;margin-bottom:10px">U\u010ditavanje i prepoznavanje slike\u2026</div>' +
    '<div id="ocrProgress" style="font-size:12px;color:var(--label3);margin-bottom:14px">Priprema OCR modula\u2026</div>' +
    '<div style="height:6px;background:var(--sep2);border-radius:3px;overflow:hidden"><div id="ocrBar" style="height:100%;width:0%;background:var(--nav-600);transition:width .2s"></div></div>' +
    '</div>';
  openModal(loadingHtml);

  Tesseract.recognize(file, 'eng', {
    logger: function(m) {
      var p=document.getElementById('ocrProgress'), b=document.getElementById('ocrBar');
      if (p) p.textContent = (m.status||'') + (m.progress? ' \u2014 '+Math.round(m.progress*100)+'%' : '');
      if (b && m.progress) b.style.width=(m.progress*100)+'%';
    },
    tessedit_pageseg_mode: '6',
    preserve_interword_spaces: '1'
  }).then(function(result){
    window.OCR_RAW_TEXT = result.data.text;
    ocrParseTableFromWords(result.data);
  }).catch(function(err){
    closeModal();
    alert('Gre\u0161ka pri OCR prepoznavanju: '+err.message);
  });
}

// Precizna metoda: koristi pozicije rijeci (bounding boxes) da rekonstruira retke tablice,
// umjesto oslanjanja na newline-ove u OCR tekstu (koji cesto ne prate stupce tablice).
var OCR_EXPECTED_COUNT = null;
function ocrParseTableFromWords(ocrData) {
  var allText = ocrData.text || '';
  var dateM = allText.match(/(20\d{2})[-\/](\d{2})[-\/](\d{2})/);
  OCR_DETECTED_DATE = null;
  if (dateM) {
    var mm=dateM[2], dd2=dateM[3];
    if (parseInt(mm,10)>=1 && parseInt(mm,10)<=12 && parseInt(dd2,10)>=1 && parseInt(dd2,10)<=31) {
      OCR_DETECTED_DATE = dateM[1]+'-'+mm+'-'+dd2;
    }
  }

  // Procijeni ocekivani broj redaka brojanjem koliko se puta bilo koji poznati naziv artikla pojavljuje u cijelom tekstu
  OCR_EXPECTED_COUNT = null;
  try {
    var lowerAll=allText.toLowerCase();
    var cnt=0;
    CRM_ARTIKLI.forEach(function(a){
      var re=new RegExp(a.name.toLowerCase().replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'g');
      var mm=lowerAll.match(re);
      if (mm) cnt+=mm.length;
    });
    if (cnt>0) OCR_EXPECTED_COUNT=cnt;
  } catch(e) {}

  var words = [];
  // Tesseract.js v4/v5 struktura: ocrData.words je ravna lista; ako ne postoji, izvuci iz blocks/paragraphs/lines
  if (ocrData.words && ocrData.words.length) {
    words = ocrData.words;
  } else if (ocrData.blocks) {
    ocrData.blocks.forEach(function(bl){ (bl.paragraphs||[]).forEach(function(pa){ (pa.lines||[]).forEach(function(li){ (li.words||[]).forEach(function(w){ words.push(w); }); }); }); });
  }

  // Grupiraj rijeci u retke po Y-poziciji (centar bbox-a)
  var wordsWithY = words.map(function(w){
    var b=w.bbox||{}; var yc=((b.y0||0)+(b.y1||0))/2; var h=(b.y1||0)-(b.y0||0);
    return {text:w.text, x0:b.x0||0, yc:yc, h:h||14};
  }).filter(function(w){ return w.text && w.text.trim().length>0; });
  wordsWithY.sort(function(a,b){ return a.yc-b.yc; });

  // Grupiranje po razmaku (gap-based) umjesto po fiksnoj bazi - puno tocnije razdvaja retke
  var rows=[]; var curRow=[];
  var avgH = wordsWithY.length ? wordsWithY.reduce(function(s,w){return s+w.h;},0)/wordsWithY.length : 14;
  for (var i=0;i<wordsWithY.length;i++) {
    if (curRow.length===0) { curRow.push(wordsWithY[i]); continue; }
    var prevY=curRow[curRow.length-1].yc;
    var gap=wordsWithY[i].yc-prevY;
    if (gap > avgH*0.55) { rows.push(curRow); curRow=[wordsWithY[i]]; }
    else curRow.push(wordsWithY[i]);
  }
  if (curRow.length) rows.push(curRow);
  rows.forEach(function(row){ row.sort(function(a,b){ return a.x0-b.x0; }); });

  var knownNames=CRM_ARTIKLI.map(function(a){return a.name;});
  var HEADER_WORDS=['total','transactions','transaction','amount','export','daily','monthly','yearly','goods','machine','merchant','number','completed','orders','name','id'];

  function fixDecimal(kom, iznos, hadDecimal) {
    if (!hadDecimal) {
      var pricePerUnit = iznos/kom;
      if (pricePerUnit>15) return Math.round((iznos/10)*10)/10;
    }
    return iznos;
  }

  OCR_ROWS=[];
  for (var r=0;r<rows.length;r++) {
    var rowWords=rows[r];
    var rowText=rowWords.map(function(w){return w.text;}).join(' ');
    var rowLower=rowText.toLowerCase();
    var headerHits=0;
    HEADER_WORDS.forEach(function(hw){ if (rowLower.indexOf(hw)>=0) headerHits++; });
    if (headerHits>=2) continue;

    // Pronadji POZICIJE svih poznatih naziva artikala unutar retka (podrzava vise artikala u jednom spojenom retku)
    var nameHits=[];
    for (var w0=0; w0<rowWords.length; w0++) {
      var joined2=(rowWords[w0].text+' '+((rowWords[w0+1]||{}).text||'')).toLowerCase();
      var joined3=(joined2+' '+((rowWords[w0+2]||{}).text||'')).toLowerCase();
      for (var k=0;k<knownNames.length;k++) {
        var kn=knownNames[k].toLowerCase();
        if (kn===joined2.trim() || kn===joined3.trim() || rowWords[w0].text.toLowerCase()===kn) {
          nameHits.push({name:knownNames[k], wordIdx:w0});
          break;
        }
      }
    }

    if (nameHits.length>1) {
      // Vise artikala spojeno u isti redak - obradi svaki segment posebno
      for (var ni=0; ni<nameHits.length; ni++) {
        var segStart=nameHits[ni].wordIdx;
        var segEnd = (ni+1<nameHits.length) ? nameHits[ni+1].wordIdx : rowWords.length;
        var segWords=rowWords.slice(segStart, segEnd);
        var segNums=[];
        segWords.forEach(function(w){
          var t=w.text.replace(/,/g,'.');
          if (/^\d+(\.\d{1,2})?$/.test(t)) segNums.push(t);
        });
        if (segNums.length<2) continue;
        var last2s=segNums.slice(-2);
        var kom2=parseInt(last2s[0],10), iznos2=parseFloat(last2s[1]);
        if (isNaN(kom2)||isNaN(iznos2)||kom2<=0||iznos2<=0) continue;
        iznos2=fixDecimal(kom2, iznos2, last2s[1].indexOf('.')>=0);
        OCR_ROWS.push({naziv:nameHits[ni].name, kom:kom2, iznos:iznos2, ukljuci:true});
      }
      continue;
    }

    // Standardni slucaj - jedan artikl po retku
    var numTokens=[];
    rowWords.forEach(function(w){
      var t=w.text.replace(/,/g,'.');
      if (/^\d+(\.\d{1,2})?$/.test(t)) numTokens.push({val:t, x:w.x0});
    });
    if (numTokens.length<2) continue;
    numTokens.sort(function(a,b){return a.x-b.x;});
    var last2=numTokens.slice(-2);
    var komTok=last2[0], iznosTok=last2[1];
    var kom=parseInt(komTok.val,10);
    var iznos=parseFloat(iznosTok.val);
    if (isNaN(kom)||isNaN(iznos)||kom<=0||iznos<=0) continue;
    iznos=fixDecimal(kom, iznos, iznosTok.val.indexOf('.')>=0);

    var nameOnly = nameHits.length===1 ? nameHits[0].name : null;
    if (!nameOnly) {
      var nameWords=[];
      for (var w2=0; w2<rowWords.length; w2++) {
        var tw=rowWords[w2].text;
        if (/\d/.test(tw) || tw.toLowerCase()==='dotyourspot') break;
        nameWords.push(tw);
      }
      nameOnly = nameWords.join(' ').trim();
    }
    if (!nameOnly) continue;
    OCR_ROWS.push({naziv:nameOnly, kom:kom, iznos:iznos, ukljuci:true});
  }
  ocrRenderPreview();
}

var OCR_DETECTED_DATE = null;
function ocrParseTable(rawText) {
  // Pokusaj prepoznati datum u formatu GGGG-MM-DD (npr. iz raspona "2026-09-11 - 2026-09-11")
  OCR_DETECTED_DATE = null;
  var dateM = rawText.match(/(20\d{2})[-\/](\d{2})[-\/](\d{2})/);
  if (dateM) {
    var yy=dateM[1], mm=dateM[2], dd2=dateM[3];
    if (parseInt(mm,10)>=1 && parseInt(mm,10)<=12 && parseInt(dd2,10)>=1 && parseInt(dd2,10)<=31) {
      OCR_DETECTED_DATE = yy+'-'+mm+'-'+dd2;
    }
  }

  var lines=rawText.split('\n').map(function(l){return l.trim();}).filter(function(l){return l.length>2;});
  OCR_ROWS=[];
  var knownNames=CRM_ARTIKLI.map(function(a){return a.name;});
  // Ocekivani format retka: Naziv artikla [ostale kolone koje ignoriramo] broj_narudzbi iznos(decimalni)
  var numPairRe = /(\d+)\s+([\d]+[.,]\d{1,2})\s*$/;
  for (var i=0;i<lines.length;i++) {
    var ln=lines[i];
    var m=ln.match(numPairRe);
    if (!m) continue;
    var kom=parseInt(m[1],10);
    var iznos=parseFloat(m[2].replace(',','.'));
    if (isNaN(kom)||isNaN(iznos)||kom<=0) continue;
    var pre = ln.slice(0, m.index).trim();

    // 1. Najpouzdanije: provjeri sadrzi li redak vec poznat naziv artikla (iz CRM_ARTIKLI liste)
    var nameOnly = null;
    for (var k=0;k<knownNames.length;k++) {
      if (pre.toLowerCase().indexOf(knownNames[k].toLowerCase())===0 || ln.toLowerCase().indexOf(knownNames[k].toLowerCase())>=0) {
        nameOnly = knownNames[k]; break;
      }
    }
    // 2. Fallback: uzmi tekst prije prvog koda stroja (npr. E01498) ili niza brojeva/hexa (Machine ID)
    if (!nameOnly) {
      var stop = pre.search(/\b[A-Za-z]?\d{4,}[A-Za-z0-9]*\b|\b[0-9a-f]{8,}\b/i);
      var cut = stop>=0 ? pre.slice(0, stop).trim() : pre;
      nameOnly = cut.replace(/[^A-Za-z\u0100-\u017F ]+$/,'').trim();
    }
    if (!nameOnly) continue;
    OCR_ROWS.push({naziv:nameOnly, kom:kom, iznos:iznos, ukljuci:true});
  }
  ocrRenderPreview();
}

function ocrRenderPreview() {
  var today=window.EXCEL_SUGGESTED_DATE || ''; // ako je Excel raspon = 1 dan, ponudi ga; inace prazno (rucni odabir)
  var artOpts=CRM_ARTIKLI.map(function(a){return '<option value="'+a.name+'">'+a.name+'</option>';}).join('');
  var html='<div style="padding:20px 22px;border-bottom:1px solid var(--sep2);display:flex;justify-content:space-between;align-items:center">'+
    '<div style="font-size:15px;font-weight:700">Prepoznate stavke sa slike ('+OCR_ROWS.length+')</div>'+
    '<button onclick="closeModal()" style="background:var(--surface2);border:none;width:28px;height:28px;border-radius:50%;cursor:pointer;font-size:14px">&#10005;</button></div>';
  html+='<div style="padding:16px 22px">';
  if (window.EXCEL_RANGE_WARNING) {
    html+='<div style="background:var(--red-bg);color:var(--red);border-radius:8px;padding:9px 12px;font-size:11.5px;margin-bottom:12px">&#9888; Ova datoteka pokriva raspon <b>'+window.EXCEL_RANGE_WARNING+'</b> (vi\u0161e dana zajedno), ne samo jedan dan. Iznosi \u0107e biti uneseni kao zbroj za odabrani datum. Za to\u010dnu dnevnu evidenciju, izvezite s Po\u010detni=Kraj datum (isti dan).</div>';
  }
  if (window.EXCEL_SUGGESTED_DATE) {
    html+='<div style="background:var(--green-bg);color:var(--green);border-radius:8px;padding:9px 12px;font-size:11.5px;margin-bottom:12px">&#10003; Datum prepoznat iz Excel datoteke: <b>'+window.EXCEL_SUGGESTED_DATE+'</b> (mo\u017eete promijeniti ispod).</div>';
